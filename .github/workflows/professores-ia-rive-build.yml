name: Professores IA native Rive build

on:
  push:
    branches: [professores-ia-rive-v210]
    paths:
      - 'rive/teachers/**'
      - '.github/workflows/professores-ia-rive-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rive CLI
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libx11-6 libxcb1 libxkbcommon0 python3-pil
          curl -fsSL https://releases.rive.app/cli/install.sh | bash
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"

      - name: Verify RML
        run: rive rive/teachers/lily --verify --format=json

      - name: Build unsigned native Rive
        run: rive rive/teachers/lily --once --format=json

      - name: Inspect compiled scene
        shell: bash
        run: |
          rive inspect rive/teachers/lily --json > rive/teachers/lily/build/inspect.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("rive/teachers/lily/build/inspect.json")
          data=json.loads(p.read_text())
          text=p.read_text()
          required=[
            "AvatarStateMachine","isIdle","isListening","isThinking","isSpeaking",
            "emotionStrength","talkIntensity","eyeTargetX","eyeTargetY",
            "visemeIndex","visemeStrength","Idle","HeadRig","BodyRig"
          ]
          missing=[x for x in required if x not in text]
          assert not missing, f"missing compiled Rive contract entries: {missing}"
          print("RIVE_CONTRACT=PASS")
          PY

      - name: Headless render proof
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p rive-proof
          rive rive/teachers/lily --screenshot=rive-proof/lily-contain.png --viewport=500x625 --fit=contain --advance=120
          rive rive/teachers/lily --screenshot=rive-proof/lily-layout.png --viewport=500x625 --fit=layout --advance=120
          SAMPLE_ROOT="$(rive samples --path)"
          cp -R "$SAMPLE_ROOT/rml_triangle" rive-proof/sample-triangle
          rive rive-proof/sample-triangle --screenshot=rive-proof/sample-triangle.png --viewport=500x625 --fit=contain

      - name: Reject blank visual proof
        shell: python
        run: |
          from PIL import Image, ImageStat
          from pathlib import Path
          def diversity(path):
              im=Image.open(path).convert("RGB")
              extrema=ImageStat.Stat(im).extrema
              ranges=[hi-lo for lo,hi in extrema]
              unique=len(set(im.getdata()))
              print(path, "ranges=", ranges, "unique=", unique)
              return max(ranges), unique
          sample_range,sample_unique=diversity("rive-proof/sample-triangle.png")
          assert sample_range>8 and sample_unique>2, "Rive headless renderer itself produced a blank sample"
          lily_range,lily_unique=diversity("rive-proof/lily-contain.png")
          assert lily_range>8 and lily_unique>4, "Lily Rive rendered blank; structural PASS is not visual PASS"
          Path("rive-proof/VISUAL_GATE_PASS.txt").write_text("RIVE_VISUAL_GATE=PASS\n")

      - name: Collect Rive file
        shell: bash
        run: |
          set -eux
          find rive/teachers/lily/build -maxdepth 1 -type f -print
          RIV="$(find rive/teachers/lily/build -maxdepth 1 -name '*.riv' | head -1)"
          test -n "$RIV"
          cp "$RIV" rive-proof/lily.riv
          sha256sum rive-proof/lily.riv > rive-proof/lily.riv.sha256
          cp rive/teachers/lily/build/inspect.json rive-proof/inspect.json

      - name: Upload native Rive proof
        uses: actions/upload-artifact@v4
        with:
          name: Professores_IA_Rive_Lily_Prototype
          path: rive-proof/
          if-no-files-found: error
