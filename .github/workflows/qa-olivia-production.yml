name: QA Olivia V17 Dynamic Chat Gate

on:
  push:
    branches: [fns-digital-human]
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  qa-olivia-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install

      - name: Materialize frozen V16 visuals for bundle gate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const name of ['fechada','falando','aberta']) {
            const src=`public/assets/olivia-${name}-v16.b64`;
            const dst=`public/assets/olivia-${name}-v16.jpg`;
            const raw=fs.readFileSync(src,'utf8').replace(/^data:image\/jpeg;base64,/i,'').replace(/\s+/g,'');
            fs.writeFileSync(dst,Buffer.from(raw,'base64'));
          }
          NODE
          for name in fechada falando aberta; do
            dst="public/assets/olivia-${name}-v16.jpg"
            fallback="public/assets/olivia-${name}-v15.jpg"
            if ! file "$dst" | grep -q JPEG; then cp "$fallback" "$dst"; fi
            file "$dst" | grep -q JPEG
          done

      - name: Frozen visual/core + V17 source gate
        run: |
          set -euo pipefail
          node --check src/strict-output-v17.js
          node --check src/strict-output-v16.js
          node --check src/strict-output-v7.js
          node --check src/strict-output.js
          node --check src/index.js
          node --check public/app.js
          node --check public/avatar-core.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q '"main": "src/strict-output-v17.js"' wrangler.jsonc
          grep -q 'FNS-OLIVIA-V17-DYNAMIC-CHAT' src/strict-output-v17.js
          grep -q 'Array.isArray(body?.messages)' src/strict-output-v17.js
          grep -q 'Array.isArray(body?.history)' src/strict-output-v17.js
          grep -q 'static_fallback:false' src/strict-output-v17.js
          ! grep -q 'Claro. Sigamos en español. Cuéntame un poco más sobre eso.' src/strict-output-v17.js
          grep -q 'olivia-fechada-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-falando-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-aberta-v16.jpg' src/strict-output-v16.js
          echo 'V17 SOURCE PASS — behavior only, frozen V16 visuals intact'

      - name: Multi-turn context QA with fake AI
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v17.js';
          const captures=[];
          const env={AI:{async run(model,input){
            captures.push(structuredClone(input.messages));
            const last=[...input.messages].reverse().find(x=>x.role==='user')?.content||'';
            return {response:/te amo mucho/i.test(last)
              ?'Gracias por decírmelo. Me alegra hablar contigo. ¿Cómo estás hoy?'
              :'¡Hola! Me alegra verte. ¿Cómo estás hoy?'};
          }}};

          const req1=new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',message:'Hola',level:'A1',history:[]})});
          const res1=await worker.fetch(req1,env,{}); const j1=await res1.json();
          if(!res1.ok||!j1.reply)throw new Error('turn1 failed '+JSON.stringify(j1));

          const req2=new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',message:'Te amo mucho',level:'A1',messages:[{role:'user',content:'Hola'},{role:'assistant',content:j1.reply}]})});
          const res2=await worker.fetch(req2,env,{}); const j2=await res2.json();
          if(!res2.ok||!j2.reply||j2.reply===j1.reply||j2.static_fallback!==false)throw new Error('turn2 failed '+JSON.stringify(j2));

          const sent=captures.at(-1)||[];
          for(const expected of [
            ['user','Hola'],
            ['assistant',j1.reply],
            ['user','Te amo mucho']
          ]){
            if(!sent.some(x=>x.role===expected[0]&&x.content===expected[1]))throw new Error('missing context '+JSON.stringify(expected));
          }
          console.log('V17 MULTI-TURN PASS — full context reaches model and replies vary by input');
          NODE

      - name: Quota-safe mock boundary — zero Workers AI calls
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v17.js';
          const env=new Proxy({}, {get(){throw new Error('QA tried to touch production env/AI')}});
          for(const path of ['/tts','/chat','/stt']){
            const req=new Request('https://qa.local'+path,{method:'POST',headers:{'Content-Type':'application/json','X-FNS-QA-Mock':'1'},body:JSON.stringify({teacher:'Olivia',text:'Hola'})});
            const res=await worker.fetch(req,env,{});
            if(!res.ok||res.headers.get('X-FNS-QA-Mock')!=='1')throw new Error(path+' escaped QA mock boundary');
          }
          console.log('LOCAL MOCK PASS — 0 Workers AI calls');
          NODE

      - name: Turbine registry unchanged
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const back=fs.readFileSync('src/strict-output-v7.js','utf8');
          for(const letter of 'ABCDEFGHIJKLMNO') if(!back.includes(letter+':{speaker:')) throw new Error('missing '+letter);
          if(!back.includes('@cf/deepgram/aura-2-es')) throw new Error('Aura-2 Spanish missing');
          console.log('A-O PASS');
          NODE

      - name: Bundle gate only
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v17-gate

      - name: Final gate
        run: echo 'OLIVIA V17 DYNAMIC CHAT GATE PASS — V16 visual frozen and untouched'
