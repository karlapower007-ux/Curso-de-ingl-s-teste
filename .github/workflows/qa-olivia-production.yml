name: QA Avatar Multi-Core V11 Production Gate

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/qa-olivia-production.yml'
      - '.github/workflows/deploy-fns-worker.yml'
  workflow_dispatch:

jobs:
  qa-multicore-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Source gate
        run: |
          set -euo pipefail
          node --check public/avatar-core.js
          node --check src/strict-output-v7.js
          node --check src/index.js
          node --check public/app.js
          node -e "const c=require('./src/avatar-config.json'); if(c.avatars.olivia.voice.turbines.length!==15) process.exit(1);"
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q 'avatar-multicore-v11' public/avatar.html
          ! grep -q 'app.js' public/avatar.html
          grep -q 'run_worker_first": true' wrangler.jsonc
          grep -q "path==='/avatar/runtime-config'" src/strict-output-v7.js
          grep -q "path==='/avatar/chat'" src/strict-output-v7.js
          grep -q "path==='/avatar/tts'" src/strict-output-v7.js
          echo 'MULTI-CORE PRODUCTION SOURCE GATE PASS'
      - name: Turbine registry gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const front=JSON.parse(fs.readFileSync('src/avatar-config.json','utf8')).avatars.olivia;
          const back=fs.readFileSync('src/strict-output-v7.js','utf8');
          if(front.voice.turbines.map(x=>x.id).join('')!=='ABCDEFGHIJKLMNO')throw new Error('Config turbines mismatch');
          for(const letter of 'ABCDEFGHIJKLMNO')if(!back.includes(letter+':{speaker:'))throw new Error('Backend turbine missing '+letter);
          if(!back.includes("@cf/deepgram/aura-2-es"))throw new Error('Aura-2 missing');
          console.log('A-O PASS');
          NODE
      - name: Bundle gate
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-multicore-gate
      - name: Final gate
        run: echo 'V11 MULTI-CORE PRODUCTION GATE PASS'
