  <meta http-equiv="Expires" content="0">
  <script>
  (()=>{try{
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister().catch(()=>{}))).catch(()=>{});}
    if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>/fns|emma|avatar|visual|static/i.test(k)).map(k=>caches.delete(k)))).catch(()=>{});}
    console.warn('[FNS TURBINE v18] bootstrap cache bypass ativo');
  }catch(e){console.warn('[FNS TURBINE v18] bootstrap warning',e)}})();
  </script>

<!-- FNS FIX DEFINITIVO: DESTRUIÇÃO DA V19 + TRAVA ANTI-RISCO --> 
<style id="fns-smile-proportions"> 
    /* 1. RESSUSCITA A BOCA ORIGINAL (Força bruta contra o display:none da v19) */ 
    html body .human-avatar .avatar-mouth-motion { 
        display: block !important; 
        visibility: visible !important; 
        opacity: 1 !important; 
        width: 13.6% !important; 
        height: 10px !important; /* Altura base mínima */ 
        left: 50% !important; 
        top: 58.1% !important; 
         
        /* Fundo real com dentes discretos */ 
        background: linear-gradient(180deg, #fffdfa 0%, #f4f1ed 20%, #2b080d 30%, #b23f59 100%) !important; 
        border-radius: 10% 10% 60% 60% !important; 
        box-shadow: none !important; 
    } 
 
    /* 2. LINHA DO LÁBIO SUPERIOR (O Sorriso) */ 
    html body .human-avatar .avatar-mouth-motion::after { 
        content: "" !important; 
        position: absolute !important; 
        top: -4px !important; 
        left: -5% !important; 
        width: 110% !important; 
        height: 14px !important; 
        border-top: 3px solid rgba(150, 42, 63, 0.9) !important; 
        border-radius: 50% 50% 0 0 / 100% 100% 0 0 !important; 
        pointer-events: none !important; 
    } 
</style> 
 
<script> 
    (function() { 
        function forceCorrectionAndCleanup() { 
            // 3. CAÇA E DESTRÓI O LIXO DA V19 (Caso o cache esteja segurando o JS fantasma) 
            const ghostStyle = document.getElementById('fns-override-v19'); 
            if (ghostStyle) ghostStyle.remove(); 
             
            const ghostMouth = document.getElementById('fns-nova-boca-v19'); 
            if (ghostMouth) ghostMouth.remove(); 
 
            // 4. TRAVA ANTI-RISCO NA BOCA ORIGINAL 
            const mouth = document.querySelector('.human-avatar .avatar-mouth-motion'); 
            if (mouth && mouth.style.transform) { 
                // Remove qualquer tentativa da v19 de esconder a boca via scale(0) 
                if (mouth.style.transform.includes('scale(0)')) { 
                    mouth.style.transform = mouth.style.transform.replace('scale(0)', 'scale(1)'); 
                } 
 
                // Impede o esmagamento vertical do core 
                const currentTransform = mouth.style.transform; 
                mouth.style.transform = currentTransform 
                    .replace(/scaleY\([^)]+\)/, function(match) { 
                        const val = parseFloat(match.replace(/[^\d.]/g, '')); 
                        return 'scaleY(' + Math.max(0.40, val) + ')'; // Nunca fecha 100% 
                    }) 
                    .replace(/scaleX\([^)]+\)/, 'scaleX(1.05)'); // Trava a largura 
            } 
             
            requestAnimationFrame(forceCorrectionAndCleanup); 
        } 
         
        requestAnimationFrame(forceCorrectionAndCleanup); 
    })(); 
</script>   
</body></html>
