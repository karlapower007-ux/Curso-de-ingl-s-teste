name: Probe Render Now

on:
  push:
    branches: [avatar-fabiano-production]
    paths:
      - '.github/workflows/probe-render-now.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live Avatar Fabiano
        shell: bash
        run: |
          set +e
          BASE='https://avatar-fabiano-api.onrender.com'
          echo '=== ROOT ==='
          code=$(curl --compressed -sS -o /tmp/root.html -w '%{http_code}' --max-time 45 "$BASE/")
          echo "HTTP $code bytes $(wc -c </tmp/root.html 2>/dev/null || echo 0)"
          grep -Eo 'FABIANO_UI_[A-Za-z0-9_]+' /tmp/root.html 2>/dev/null | head -10 || true
          grep -Eo 'avatar-fabiano-(perfil|debatendo)\.png' /tmp/root.html 2>/dev/null | sort -u || true
          echo 'ROOT FIRST 600:'
          head -c 600 /tmp/root.html 2>/dev/null || true
          echo
          echo '=== ADMIN ==='
          code=$(curl --compressed -sS -o /tmp/admin.html -w '%{http_code}' --max-time 45 "$BASE/admin")
          echo "HTTP $code bytes $(wc -c </tmp/admin.html 2>/dev/null || echo 0)"
          grep -Eo 'FABIANO_UI_[A-Za-z0-9_]+' /tmp/admin.html 2>/dev/null | head -10 || true
          echo '=== HEALTH ==='
          curl --compressed -sS --max-time 45 "$BASE/health" || true
          echo
