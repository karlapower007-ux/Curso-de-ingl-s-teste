name: Probe Wrangler auto-provisioning

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths: ['.github/workflows/probe-wrangler-autoprovision.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        working-directory: consciencia-fabiano
        run: npm install

      - name: Attempt non-live version upload with draft bindings
        working-directory: consciencia-fabiano
        shell: bash
        run: |
          set +e
          cat > /tmp/probe-worker.js <<'JS'
          export default { async fetch(){ return new Response("autoprovision-probe"); } }
          JS
          cat > /tmp/wrangler-probe.jsonc <<'JSON'
          {
            "name": "consciencia-fabiano",
            "main": "/tmp/probe-worker.js",
            "compatibility_date": "2026-09-18",
            "d1_databases": [{"binding":"AUTOPROBE_DB"}],
            "r2_buckets": [{"binding":"AUTOPROBE_R2"}]
          }
          JSON

          npx wrangler versions upload             --config /tmp/wrangler-probe.jsonc             --experimental-provision             --experimental-auto-create             > /tmp/probe.out 2>&1
          rc=$?
          echo "AUTOPROVISION_RC=$rc"
          sed -E 's/(Bearer|token|secret)[=: ]+[^ ]+/<redacted>/Ig' /tmp/probe.out | tail -120
          echo "=== resulting config ==="
          cat /tmp/wrangler-probe.jsonc
          exit 0

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/probe-wrangler-autoprovision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Wrangler auto-provision probe"
          git push origin HEAD:consciencia-cloudflare-native-v1
