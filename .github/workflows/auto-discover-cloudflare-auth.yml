name: Auto-discover Cloudflare auth

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths: ['.github/workflows/auto-discover-cloudflare-auth.yml']

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: consciencia-fabiano
    env:
      OLD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OLD_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALT_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ALT_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
      FOCO_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_FOCOEPODER2 }}
      FOCO_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_FOCOEPODER2 }}
      GLOBAL_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      GLOBAL_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Probe all pre-authorized Cloudflare credential modes
        shell: bash
        run: |
          set +e
          rm -f /tmp/auth-results.txt

          probe_token() {
            name="$1"; token="$2"; acct="$3"
            [ -n "$token" ] || { echo "$name=missing" >> /tmp/auth-results.txt; return; }
            export CLOUDFLARE_API_TOKEN="$token"
            export CLOUDFLARE_ACCOUNT_ID="$acct"
            unset CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL
            npx wrangler whoami >/tmp/whoami 2>&1
            who=$?
            r2=1; d1=1; vec=1
            if [ "$who" = "0" ]; then
              npx wrangler r2 bucket list >/tmp/r2 2>&1; r2=$?
              npx wrangler d1 list --json >/tmp/d1 2>&1; d1=$?
              npx wrangler vectorize get consciencia-fabiano-rag >/tmp/vec 2>&1; vec=$?
            fi
            echo "$name:whoami=$who,r2=$r2,d1=$d1,vectorize=$vec,account_set=$([ -n "$acct" ] && echo yes || echo no)" >> /tmp/auth-results.txt
            if [ "$who" = "0" ] && [ "$r2" = "0" ] && [ "$d1" = "0" ]; then
              echo "$name" > /tmp/working-mode
            fi
          }

          probe_key() {
            name="$1"; key="$2"; email="$3"; acct="$4"
            [ -n "$key" ] && [ -n "$email" ] || { echo "$name=missing" >> /tmp/auth-results.txt; return; }
            unset CLOUDFLARE_API_TOKEN
            export CLOUDFLARE_API_KEY="$key"
            export CLOUDFLARE_EMAIL="$email"
            export CLOUDFLARE_ACCOUNT_ID="$acct"
            npx wrangler whoami >/tmp/whoami-key 2>&1
            who=$?
            r2=1; d1=1; vec=1
            if [ "$who" = "0" ]; then
              npx wrangler r2 bucket list >/tmp/r2-key 2>&1; r2=$?
              npx wrangler d1 list --json >/tmp/d1-key 2>&1; d1=$?
              npx wrangler vectorize get consciencia-fabiano-rag >/tmp/vec-key 2>&1; vec=$?
            fi
            echo "$name:whoami=$who,r2=$r2,d1=$d1,vectorize=$vec,account_set=$([ -n "$acct" ] && echo yes || echo no)" >> /tmp/auth-results.txt
            if [ "$who" = "0" ] && [ "$r2" = "0" ] && [ "$d1" = "0" ]; then
              echo "$name" > /tmp/working-mode
            fi
          }

          probe_token "FOCO_TOKEN" "$FOCO_TOKEN" "$FOCO_ACCOUNT"
          probe_token "ALT_TOKEN" "$ALT_TOKEN" "$ALT_ACCOUNT"
          probe_token "CURRENT_TOKEN" "$OLD_TOKEN" "$OLD_ACCOUNT"
          probe_key "GLOBAL_KEY" "$GLOBAL_KEY" "$GLOBAL_EMAIL" "$OLD_ACCOUNT"

          echo "=== SAFE AUTH DISCOVERY RESULT ==="
          cat /tmp/auth-results.txt
          if [ -f /tmp/working-mode ]; then
            echo "WORKING_MODE=$(cat /tmp/working-mode)"
          else
            echo "WORKING_MODE=none"
          fi

      - name: Remove one-shot workflow
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/auto-discover-cloudflare-auth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Cloudflare auth auto-discovery probe"
          git push origin HEAD:consciencia-cloudflare-native-v1
