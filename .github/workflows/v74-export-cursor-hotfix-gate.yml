name: V7.4 Export Cursor Hotfix Gate
# validation trigger: 2026-09-20

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v74-export-cursor-hotfix-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "ops/v74-hotfix-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate hotfix branch
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin consciencia-v74-export-cursor-hotfix-20260920
          git worktree add /tmp/v74-hotfix origin/consciencia-v74-export-cursor-hotfix-20260920
          cd /tmp/v74-hotfix/consciencia-fabiano
          npm install --ignore-scripts
          npm run check
          echo "gate=success" >> "$GITHUB_OUTPUT"

      - name: Record result
        shell: bash
        run: |
          mkdir -p .ci-results
          {
            echo "V74_EXPORT_CURSOR_GATE=${{ steps.gate.outputs.gate || 'failed' }}"
            echo "HOTFIX_HEAD=6eaa3c92e3f6790ffbdcd996031a3f307c94bb71"
            echo "WORKFLOW_RUN=${GITHUB_RUN_ID}"
          } > .ci-results/v74-export-cursor-hotfix.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-results/v74-export-cursor-hotfix.txt
          git diff --cached --quiet || git commit -m "Record V7.4 export cursor gate"
          git push origin HEAD:main

      - name: Fail job if validation failed
        if: steps.gate.outputs.gate != 'success'
        run: exit 1
