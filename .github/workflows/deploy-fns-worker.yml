name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Protect audio, STT, TTS, memory and turn core
        run: |
          node --check src/index.js
          node --check public/app.js
          node --check public/natural-turns.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          echo "CORE LOCK PASS: app.js and src/index.js unchanged"

      - name: QA multilingual STT post-processing lock
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('public/app.js','utf8');
          const worker=fs.readFileSync('src/index.js','utf8');
          const turns=fs.readFileSync('public/natural-turns.js','utf8');
          const fail=m=>{throw new Error(m)};

          for(const token of [
            'r.lang=browserRecognitionLanguage();',
            "'X-FNS-STT-Language':selectedSttLanguage()",
            'recoverTranscriptCandidate',
            'repairTranscriptWithLLM'
          ]) if(!app.includes(token)) fail('Frontend STT invariant missing: '+token);

          for(const token of [
            'task:"transcribe"',
            'sttOptions.language=requestedLanguage',
            'sttOptions.initial_prompt=whisperInitialPrompt(requestedLanguage)',
            'sttOptions.temperature=0.1'
          ]) if(!worker.includes(token)) fail('Whisper language lock missing: '+token);

          for(const token of [
            'FNS STT POST-PROCESS LANGUAGE LOCK v1',
            "new Set(['en-US','pt-BR','es-ES'])",
            "kind:'manual-direct'",
            "kind:'manual-regex-bypass'",
            'repair rejected because language drifted',
            'post-processing language leak blocked'
          ]) if(!turns.includes(token)) fail('Post-STT language guard missing: '+token);

          console.log('QA STT LANGUAGE LOCK PASS: recognition + header + Whisper + post-processing guard present');
          NODE

      - name: QA Emma PNGTuber final architecture
        run: |
          grep -q "FNS FINAL FIX: MOTOR PNGTUBER" public/index.html
          grep -q "emma-fechada.png" public/index.html
          grep -q "emma-falando.png" public/index.html
          grep -q "emma-aberta.png" public/index.html
          grep -q "mouthOpen >= 0.15" public/index.html
          grep -q "mouthOpen >= 0.60" public/index.html
          ! grep -q "emma-static.js" public/index.html
          ! grep -q "avatar-mouth-motion" public/emma-static.css
          ! grep -q "avatar-webgl-layer" public/emma-static.css
          ! grep -q "ExpressionTurbine" public/emma-static.css

          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const files=['emma-fechada.png','emma-falando.png','emma-aberta.png'];
          const hashes=new Set();
          for(const f of files){
            const p='public/assets/'+f;
            const b=fs.readFileSync(p);
            if(b.length<5000) throw new Error(f+' too small: '+b.length);
            if(b[0]!==0x89||b[1]!==0x50||b[2]!==0x4e||b[3]!==0x47) throw new Error(f+' is not PNG');
            const w=b.readUInt32BE(16), h=b.readUInt32BE(20);
            if(w<256||h<256) throw new Error(f+' dimensions too small: '+w+'x'+h);
            const sha=crypto.createHash('sha256').update(b).digest('hex');
            hashes.add(sha);
            console.log(f, w+'x'+h, b.length+' bytes', sha.slice(0,12));
          }
          if(hashes.size!==3) throw new Error('PNGTuber frames are not three distinct images');
          console.log('PNGTUBER SOURCE QA PASS');
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA production PNGTuber and multilingual STT guard
        run: |
          sleep 5
          for f in emma-fechada.png emma-falando.png emma-aberta.png; do
            curl --compressed --fail --silent --show-error -o "$f" "https://fns-stt.karlapower007.workers.dev/assets/$f?v=pngtuber-final-20260917"
          done

          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const hashes=new Set();
          for(const f of ['emma-fechada.png','emma-falando.png','emma-aberta.png']){
            const b=fs.readFileSync(f);
            if(b[0]!==0x89||b[1]!==0x50||b[2]!==0x4e||b[3]!==0x47) throw new Error('production '+f+' invalid');
            const w=b.readUInt32BE(16), h=b.readUInt32BE(20);
            if(w<256||h<256) throw new Error('production '+f+' too small: '+w+'x'+h);
            hashes.add(crypto.createHash('sha256').update(b).digest('hex'));
          }
          if(hashes.size!==3) throw new Error('production frames are not distinct');
          console.log('PRODUCTION ASSET QA PASS');
          NODE

          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN

          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,
              executablePath:process.env.CHROME_BIN,
              args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            await page.goto('https://fns-stt.karlapower007.workers.dev/?pngtuber-final=persistent',{waitUntil:'networkidle2',timeout:60000});
            await page.click('button[data-view="live"]');
            await page.waitForSelector('.card.teacher',{timeout:30000});

            const opened=await page.evaluate(()=>{
              const card=[...document.querySelectorAll('.card.teacher')]
                .find(x=>x.querySelector('h3')?.textContent?.trim()==='Emma');
              const btn=card?.querySelector('button.primary');
              if(!btn)return false;
              btn.click();
              return true;
            });
            if(!opened)throw new Error('Emma card not found');
            await page.waitForSelector('.human-avatar img',{timeout:30000});

            const check=async(level,needle,state)=>{
              await page.evaluate(v=>document.querySelector('.human-avatar')?.style.setProperty('--mouth-open',String(v),'important'),level);
              await new Promise(r=>setTimeout(r,300));
              const got=await page.evaluate(()=>({
                src:document.querySelector('.human-avatar img')?.src||'',
                state:document.querySelector('.human-avatar')?.dataset.pngtuberState||'',
                legacyMouth:!!document.querySelector('.avatar-mouth-motion'),
                legacyFx:!!document.querySelector('.avatar-fx-layer'),
                legacyWebgl:!!document.querySelector('.avatar-webgl-layer')
              }));
              if(got.legacyMouth||got.legacyFx||got.legacyWebgl) throw new Error('legacy visual layer survived '+JSON.stringify(got));
              if(!got.src.includes(needle)||got.state!==state) throw new Error('swap failed '+JSON.stringify({level,got}));
              return got;
            };

            console.log('closed',await check(0,'emma-fechada.png','closed'));
            console.log('talking',await check(0.30,'emma-falando.png','talking'));
            console.log('open',await check(0.80,'emma-aberta.png','open'));

            const stt=await page.evaluate(async()=>{
              const select=document.querySelector('#sttLangSel');
              if(!select||!window.FNS_STT_LANGUAGE_GUARD)throw new Error('STT language guard unavailable');
              const cases=[
                ['en-US','My name is Fabiano and I want to practice English.'],
                ['pt-BR','Meu nome é Fabiano e quero conversar em português.'],
                ['es-ES','Me llamo Fabiano y quiero practicar español.']
              ];
              const results=[];
              for(const [code,text] of cases){
                select.value=code;
                const recovered=await recoverTranscriptCandidate(text,1,{targetLanguage:code});
                results.push({code,text:recovered?.text||'',kind:recovered?.kind||'',language:recovered?.language||''});
              }
              select.value='en-US';
              const falsePositive=await recoverTranscriptCandidate('Please call Mr. Para at reception.',1,{targetLanguage:'en-US'});
              return {
                results,
                falsePositive,
                blocksPortugueseAsEnglish:!window.FNS_STT_LANGUAGE_GUARD.sameLanguageOrNeutral('Meu nome é Fabiano e eu estou na portaria.','en-US'),
                blocksEnglishAsSpanish:!window.FNS_STT_LANGUAGE_GUARD.sameLanguageOrNeutral('My name is Fabiano and I am at reception.','es-ES')
              };
            });

            for(const r of stt.results){
              if(r.text!==({
                'en-US':'My name is Fabiano and I want to practice English.',
                'pt-BR':'Meu nome é Fabiano e quero conversar em português.',
                'es-ES':'Me llamo Fabiano y quiero practicar español.'
              })[r.code]) throw new Error('Manual STT language preservation failed '+JSON.stringify(r));
              if(r.kind!=='manual-direct'||r.language!==r.code) throw new Error('Manual direct bypass failed '+JSON.stringify(r));
            }
            if(stt.falsePositive?.text!=='Please call Mr. Para at reception.') throw new Error('English false-positive bypass failed '+JSON.stringify(stt.falsePositive));
            if(!stt.blocksPortugueseAsEnglish||!stt.blocksEnglishAsSpanish) throw new Error('Language drift detector failed '+JSON.stringify(stt));
            console.log('PRODUCTION STT LANGUAGE QA PASS',stt);

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final status
        run: echo "DEPLOY PASS - protected core intact; Emma PNGTuber unchanged; multilingual STT guard active"
