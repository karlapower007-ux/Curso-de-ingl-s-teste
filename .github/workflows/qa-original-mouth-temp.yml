name: QA Emma Original Mouth Evidence

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - '.github/workflows/qa-original-mouth-temp.yml'

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture production Emma
        run: |
          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,
              executablePath:process.env.CHROME_BIN,
              args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1100,deviceScaleFactor:1});
            await page.goto('https://fns-stt.karlapower007.workers.dev/?qa=original-mouth-proof',{
              waitUntil:'networkidle2',timeout:60000
            });
            const live=await page.$('button[data-view="live"]');
            if(!live) throw new Error('Live navigation button not found');
            await live.click();
            await page.waitForSelector('.card.teacher',{timeout:30000});
            const opened=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('.card.teacher')];
              const card=cards.find(x=>x.querySelector('h3')?.textContent?.trim()==='Emma');
              const button=card?.querySelector('button.primary');
              if(!button)return false;
              button.click();
              return true;
            });
            if(!opened) throw new Error('Emma teacher card could not be opened');
            await page.waitForSelector('.human-avatar .avatar-mouth-motion',{timeout:30000});
            await page.evaluate(()=>{
              const avatar=document.querySelector('.human-avatar');
              avatar.style.setProperty('--mouth-open','0.78','important');
              avatar.style.setProperty('--mouth-wide','0.90','important');
              avatar.classList.add('avatar-speaking');
            });
            await new Promise(r=>setTimeout(r,1200));

            const state=await page.evaluate(()=>{
              const avatar=document.querySelector('.human-avatar');
              const mouth=document.querySelector('.human-avatar .avatar-mouth-motion');
              const style=getComputedStyle(mouth);
              const after=getComputedStyle(mouth,'::after');
              const mouthRect=mouth.getBoundingClientRect();
              const avatarRect=avatar.getBoundingClientRect();
              const fix=document.getElementById('fns-smile-proportions');
              return {
                nativeMouthExists:!!mouth,
                fakeV19Exists:!!document.getElementById('fns-nova-boca-v19'),
                ghostV19StyleExists:!!document.getElementById('fns-override-v19'),
                display:style.display,
                visibility:style.visibility,
                opacity:style.opacity,
                cssWidth:style.width,
                cssHeight:style.height,
                renderedWidth:mouthRect.width,
                renderedHeight:mouthRect.height,
                avatarWidth:avatarRect.width,
                renderedWidthPct:avatarRect.width?mouthRect.width/avatarRect.width*100:0,
                top:style.top,
                left:style.left,
                transform:style.transform,
                afterBorderTop:after.borderTop,
                fixPresent:!!fix,
                fixHas136:fix?.textContent?.includes('width: 13.6% !important')||false,
                fixHasMinScale:document.documentElement.innerHTML.includes('Math.max(0.40, val)')
              };
            });

            if(!state.nativeMouthExists) throw new Error('Original mouth missing');
            if(state.fakeV19Exists) throw new Error('v19 fake mouth still exists');
            if(state.ghostV19StyleExists) throw new Error('v19 ghost style still exists');
            if(state.display==='none'||state.visibility==='hidden'||parseFloat(state.opacity)<0.9) throw new Error('Original mouth is not visible: '+JSON.stringify(state));
            if(!state.fixPresent||!state.fixHas136||!state.fixHasMinScale) throw new Error('Definitive smile fix is not active: '+JSON.stringify(state));
            if(!(state.renderedWidth>20&&state.renderedHeight>2)) throw new Error('Mouth geometry invalid: '+JSON.stringify(state));

            await page.screenshot({path:'emma-original-mouth-page.png',fullPage:true});
            const avatarEl=await page.$('.human-avatar');
            await avatarEl.screenshot({path:'emma-original-mouth-avatar.png'});
            fs.writeFileSync('emma-original-mouth-state.json',JSON.stringify(state,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: emma-original-mouth-evidence
          path: |
            emma-original-mouth-avatar.png
            emma-original-mouth-page.png
            emma-original-mouth-state.json
          if-no-files-found: error
