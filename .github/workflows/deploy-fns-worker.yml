name: Deploy FNS Worker

on:
  push:
    branches: [fns-digital-human]
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install

      - name: Materialize frozen V16 avatar frames
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const name of ['fechada','falando','aberta']){
            const raw=fs.readFileSync(`public/assets/olivia-${name}-v16.b64`,'utf8').replace(/^data:image\/jpeg;base64,/i,'').replace(/\s+/g,'');
            fs.writeFileSync(`public/assets/olivia-${name}-v16.jpg`,Buffer.from(raw,'base64'));
          }
          NODE
          for name in fechada falando aberta; do
            dst="public/assets/olivia-${name}-v16.jpg"
            if ! file "$dst" | grep -q JPEG; then cp "public/assets/olivia-${name}-v15.jpg" "$dst"; fi
            file "$dst" | grep -q JPEG
          done

      - name: Freeze approved visual engine + validate V18
        run: |
          set -euo pipefail
          node --check src/strict-output-v18.js
          node --check src/strict-output-v17.js
          node --check src/strict-output-v16.js
          node --check public/avatar-core.js
          test "$(git hash-object public/avatar-core.js)" = "eae5d60c405daf911a6e1828b30d62668e341c23"
          test "$(git hash-object public/avatar.html)" = "1192f6e04eac2e474e8bd261bb7e1db2ea40fac7"
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          test "$(git hash-object src/strict-output-v16.js)" = "bc35e9edfa35bcce85e905c5cac49609cc518340"
          grep -q '"main": "src/strict-output-v18.js"' wrangler.jsonc
          grep -q 'FNS-OLIVIA-V18-END-TO-END' src/strict-output-v18.js
          grep -q 'pollinations-openai' src/strict-output-v18.js
          grep -q 'hf-free-ai-chat' src/strict-output-v18.js
          grep -q 'static_fallback:false' src/strict-output-v18.js
          grep -q 'olivia-fechada-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-falando-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-aberta-v16.jpg' src/strict-output-v16.js
          echo 'VISUAL ENGINE BYTE-FROZEN + V18 SOURCE PASS'

      - name: V18 chat contract — context + quota failover
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v18.js';
          const seen=[];
          const envOk={AI:{async run(model,input){
            seen.push(structuredClone(input.messages));
            const last=[...input.messages].reverse().find(x=>x.role==='user')?.content||'';
            return {response:/te amo mucho/i.test(last)?'Gracias por decírmelo. Me alegra hablar contigo. ¿Cómo estás hoy?':'¡Hola! Estoy muy bien. ¿Cómo estás tú?'};
          }}};
          const r1=await worker.fetch(new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',message:'Hola',level:'A1',history:[]})}),envOk,{});
          const j1=await r1.json();
          if(!r1.ok||!j1.reply||j1.fallback!==false)throw new Error('turn1 '+JSON.stringify(j1));
          const r2=await worker.fetch(new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',message:'Te amo mucho',level:'A1',messages:[{role:'user',content:'Hola'},{role:'assistant',content:j1.reply}]})}),envOk,{});
          const j2=await r2.json();
          if(!r2.ok||!j2.reply||j2.reply===j1.reply)throw new Error('turn2 '+JSON.stringify(j2));
          const sent=seen.at(-1)||[];
          for(const [role,content] of [['user','Hola'],['assistant',j1.reply],['user','Te amo mucho']]) if(!sent.some(x=>x.role===role&&x.content===content))throw new Error('context missing '+role+' '+content);

          const oldFetch=globalThis.fetch;
          let publicCalls=0;
          globalThis.fetch=async (url,options={})=>{
            if(String(url)==='https://text.pollinations.ai/openai'){
              publicCalls++;
              return Response.json({choices:[{message:{content:'Hoy hablo contigo y te ayudo con español. ¿Qué quieres practicar?'}}]},{status:200});
            }
            throw new Error('unexpected '+String(url));
          };
          try{
            const envQuota={AI:{async run(){throw new Error('4006 daily free allocation used up your neurons')}}};
            const res=await worker.fetch(new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',message:'¿Qué haces hoy?',level:'A1',history:[{role:'user',content:'Hola'},{role:'assistant',content:'¡Hola! ¿Cómo estás?'}]})}),envQuota,{});
            const json=await res.json();
            if(!res.ok||!json.reply||json.fallback!==true||json.provider!=='pollinations-openai'||json.cloudflare_quota!==true||publicCalls!==1)throw new Error('quota failover '+JSON.stringify(json));
          }finally{globalThis.fetch=oldFetch;}
          console.log('V18 CHAT CONTRACT PASS');
          NODE

      - name: Bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v18-dist

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production visual + live chat smoke
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'
          curl --compressed --fail --silent --show-error "$BASE/?avatar=olivia&v=18" -o olivia-v18.html
          grep -q 'olivia-fechada-v16.jpg' olivia-v18.html
          grep -q 'olivia-falando-v16.jpg' olivia-v18.html
          grep -q 'olivia-aberta-v16.jpg' olivia-v18.html
          grep -q 'Profesora de español' olivia-v18.html
          curl --compressed --silent --show-error --max-time 35 -H 'Content-Type: application/json' \
            -d '{"teacher":"Olivia","level":"A1","message":"Hola, ¿cómo estás?","history":[]}' "$BASE/chat" -o live-chat.json
          node - <<'NODE'
          const j=JSON.parse(require('fs').readFileSync('live-chat.json','utf8'));
          if(j.ok!==true||typeof j.reply!=='string'||j.reply.trim().length<2||j.static_fallback!==false)throw new Error('LIVE CHAT FAIL '+JSON.stringify(j));
          console.log('LIVE CHAT PASS',{provider:j.provider,fallback:j.fallback,reply:j.reply.slice(0,100)});
          NODE

      - name: Browser E2E — JSON reply -> bubble -> TTS -> mouth movement
        run: |
          npm install --no-save puppeteer-core@24.18.0 pngjs@7.0.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const {PNG}=require('pngjs');
          function wavTone(ms=1800,rate=16000){
            const n=Math.floor(rate*ms/1000), bytes=n*2, b=Buffer.alloc(44+bytes);
            b.write('RIFF',0);b.writeUInt32LE(36+bytes,4);b.write('WAVE',8);b.write('fmt ',12);b.writeUInt32LE(16,16);b.writeUInt16LE(1,20);b.writeUInt16LE(1,22);b.writeUInt32LE(rate,24);b.writeUInt32LE(rate*2,28);b.writeUInt16LE(2,32);b.writeUInt16LE(16,34);b.write('data',36);b.writeUInt32LE(bytes,40);
            for(let i=0;i<n;i++)b.writeInt16LE(Math.round(Math.sin(2*Math.PI*440*i/rate)*25000),44+i*2);
            return b;
          }
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            let chatCalls=0,ttsCalls=0;
            await page.setRequestInterception(true);
            page.on('request',req=>{
              const u=new URL(req.url());
              if(u.pathname==='/chat'&&req.method()==='POST'){
                chatCalls++;
                return req.respond({status:200,contentType:'application/json',body:JSON.stringify({ok:true,reply:'Estoy bien y feliz de hablar contigo. ¿Cómo estás tú?',teacher:'Olivia',dynamic_chat:true,static_fallback:false})});
              }
              if(u.pathname==='/tts'&&req.method()==='POST'){
                ttsCalls++;
                return req.respond({status:200,contentType:'audio/wav',body:wavTone()});
              }
              if(u.pathname==='/stt')return req.abort('blockedbyclient');
              req.continue();
            });
            await page.goto('https://fns-stt.karlapower007.workers.dev/?avatar=olivia&v=18&qa=e2e',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('#textInput',{visible:true});
            await page.evaluate(()=>{
              window.__fnsQaFrames=[];
              window.__fnsQaModes=[];
              const img=document.getElementById('olivia-avatar-img');
              const note=()=>window.__fnsQaFrames.push(img.getAttribute('src')||'');
              new MutationObserver(note).observe(img,{attributes:true,attributeFilter:['src']});
              window.addEventListener('fns:avatar:v14',e=>window.__fnsQaModes.push(e.detail?.type||''));
              note();
            });
            await page.type('#textInput','Hola, ¿cómo estás?');
            await page.click('#sendBtn');
            await page.waitForFunction(()=>document.querySelectorAll('.chat-message.assistant').length>0,{timeout:12000});
            await page.waitForFunction(()=>/olivia-(falando|aberta)-v16\.jpg/i.test(document.getElementById('olivia-avatar-img')?.getAttribute('src')||''),{timeout:7000});
            const state=await page.evaluate(()=>({
              assistant:[...document.querySelectorAll('.chat-message.assistant')].map(x=>x.textContent.trim()),
              frames:window.__fnsQaFrames||[],modes:window.__fnsQaModes||[],
              src:document.getElementById('olivia-avatar-img')?.getAttribute('src')||'',
              status:document.getElementById('status')?.textContent||''
            }));
            if(chatCalls!==1)throw new Error('chat calls '+chatCalls);
            if(ttsCalls<1)throw new Error('assistant bubble did not trigger TTS');
            if(!state.assistant.some(x=>/Estoy bien/i.test(x)))throw new Error('assistant reply absent '+JSON.stringify(state));
            if(!state.frames.some(x=>/olivia-(falando|aberta)-v16\.jpg/i.test(x))&&!/olivia-(falando|aberta)-v16\.jpg/i.test(state.src))throw new Error('mouth did not move '+JSON.stringify(state));
            if(!state.modes.includes('speaking'))throw new Error('speaking mode never activated '+JSON.stringify(state));
            const img=await page.$('#olivia-avatar-img');
            const rendered=await img.screenshot({encoding:'binary'});const png=PNG.sync.read(rendered);let nonBlack=0;
            for(let i=0;i<png.data.length;i+=4)if(png.data[i]+png.data[i+1]+png.data[i+2]>30)nonBlack++;
            if(nonBlack/(png.width*png.height)<0.35)throw new Error('avatar blank');
            await page.screenshot({path:'olivia-v18-e2e-proof.png',fullPage:true});
            console.log('V18 BROWSER E2E PASS',{chatCalls,ttsCalls,src:state.src,modes:state.modes.slice(-8),frames:state.frames.slice(-8)});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: olivia-v18-end-to-end-proof
          path: fns-digital-human/worker/olivia-v18-e2e-proof.png
          retention-days: 30

      - name: Final
        run: echo 'V18 PASS — live backend reply + DOM bubble + TTS call + speaking mode + mouth frame verified; approved V16 visuals remain byte-frozen'
