name: QA Cloudflare Native RAG

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths:
      - 'consciencia-fabiano/**'
      - '.github/workflows/qa-cloudflare-native-rag.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax and architecture checks
        run: |
          npm run check
          node --check scripts/browser-voice-smoke.mjs
          node --check scripts/browser-ingest-smoke.mjs
          bash -n scripts/autonomous-release.sh

          # Core V4.0 identity
          grep -q '7.0.0-twenty-agent-cross-device' src/index.js
          grep -q 'cloudflare-v7-twenty-agent-cross-device' src/index.js
          grep -q 'universal_strict_match_core: "strict-match-core-v4"' src/index.js
          grep -q 'online_offline_search_symmetry: true' src/index.js
          grep -q 'same_paragraph_phrase_required: true' src/index.js
          grep -q 'fuzzy_matching_disabled: true' src/index.js
          grep -q 'or_matching_disabled: true' src/index.js
          grep -q 'omni_library_sync: true' src/index.js
          grep -q 'omni_sync_batch_size: 200' src/index.js
          grep -q 'omni_sync_worker: true' src/index.js
          grep -q 'omni_sync_memory_flush: true' src/index.js
          grep -q 'omni_search_all_documents: true' src/index.js
          grep -q 'omni_logical_task_capacity: 1000' src/index.js
          grep -q 'omni_physical_worker_cap: 16' src/index.js
          grep -q 'omni_virtual_scroller: true' src/index.js
          grep -q 'omni_card_gap_px: 40' src/index.js
          grep -q 'agent_swarm_enabled: true' src/index.js
          grep -q 'agent_swarm_logical_nodes: 20' src/index.js
          grep -q 'agent_swarm_physical_worker_cap: 16' src/index.js
          grep -q 'agent2_transformers_semantic: true' src/index.js
          grep -q 'agent10_bouncer: true' src/index.js
          grep -q 'agent11_short_entity_hunter: true' src/index.js
          grep -q 'agent12_long_form_explainer: true' src/index.js
          grep -q 'agent13_freshness_sentinel: true' src/index.js
          grep -q 'agent14_ocr_rescue: true' src/index.js
          grep -q 'agent15_definition_specialist: true' src/index.js
          grep -q 'agent16_chronology_mapper: true' src/index.js
          grep -q 'agent17_cross_library_balancer: true' src/index.js
          grep -q 'agent18_citation_specialist: true' src/index.js
          grep -q 'agent19_conflict_auditor: true' src/index.js
          grep -q 'agent20_mission_master: true' src/index.js
          grep -q 'cross_device_library_mirror: true' src/index.js
          grep -q 'cross_device_library_table: "library_chunks"' src/index.js
          grep -q 'cross_device_mobile_hydration: true' src/index.js
          grep -q 'semantic_fallback_after_literal_miss: true' src/index.js
          grep -q 'phantom_daemon: true' src/index.js
          grep -q 'phantom_daemon_target_interval_ms: 180000' src/index.js
          grep -q 'phantom_daemon_periodic_sync_best_effort: true' src/index.js
          grep -q 'omni_sync_cloud_fingerprint: true' src/index.js
          grep -q 'omni_sync_generation_gc: true' src/index.js
          grep -q 'omni_sync_manual_button: false' src/index.js
          grep -q 'omni_sync_zero_touch_after_authorization: true' src/index.js

          # One shared exact phrase engine for server and browser
          test -f public/strict-match-core.js
          grep -q 'STRICT_MATCH_VERSION="4.0.0"' public/strict-match-core.js
          grep -q 'STRICT_LOGICAL_TASK_CAP=1000' public/strict-match-core.js
          grep -q 'strictParagraphMatch' public/strict-match-core.js
          grep -q 'deriveStrictPhrase' public/strict-match-core.js
          grep -q 'paragraphBlocks' public/strict-match-core.js
          grep -q 'extractSemanticReference' public/strict-match-core.js
          grep -q 'from "../public/strict-match-core.js"' src/index.js
          grep -q 'strictParagraphMatch' src/index.js

          # Cloudflare + Supabase strict full-library path
          grep -q 'retrieveDurableStrictContext' src/index.js
          grep -q 'retrieveSupabaseStrictContext' src/index.js
          grep -q 'retrieveContextV4Strict' src/index.js
          grep -q '"/search-strict"' src/index.js
          grep -q 'strict-phrase-durable-v4' src/index.js
          grep -q 'strict-phrase-supabase-v4' src/index.js
          grep -q 'text","ilike.\*"' src/index.js
          grep -q 'pushStrictHit' src/index.js
          grep -q 'roundRobinStrictHits' src/index.js
          grep -q 'void suppliedEmbedding' src/index.js
          grep -q 'strict-phrase-provider-v4' src/index.js
          grep -q 'Nenhuma correspondência exata encontrada na biblioteca total.' src/index.js

          # IndexedDB strict scan across all local documents
          test -f public/rag-search-worker.js
          grep -q 'search-strict' public/rag-search-worker.js
          grep -q 'strictSearchAll' public/rag-search-worker.js
          grep -q 'openCursor' public/rag-search-worker.js
          grep -q 'strict-phrase-indexeddb-v4' public/rag-search-worker.js
          grep -q 'roundRobinStrictHits' public/rag-search-worker.js
          grep -q 'OFFLINE_TOP_K=1000' public/rag-cascade.js
          grep -q '"search-strict"' public/rag-cascade.js
          grep -q 'IndexedDB strict phrase full-library' public/rag-cascade.js

          # 1000 logical local tasks, hardware-governed worker pool
          test -f public/local-turbine-pool.js
          test -f public/local-turbine-worker.js
          grep -q 'LOGICAL_NODE_CAPACITY=1000' public/local-turbine-pool.js
          grep -q 'MAX_PHYSICAL_WORKERS=16' public/local-turbine-pool.js
          grep -q 'navigator.hardwareConcurrency' public/local-turbine-pool.js
          grep -q 'new Worker("/local-turbine-worker.js?v=4.0.0",{type:"module"})' public/local-turbine-pool.js
          grep -q 'strict-same-paragraph-phrase-v4' public/local-turbine-pool.js
          grep -q 'fuzzy_disabled:true' public/local-turbine-pool.js
          grep -q 'or_disabled:true' public/local-turbine-pool.js
          grep -q 'strictParagraphMatch' public/local-turbine-worker.js
          grep -q 'LOGICAL_AGENT_COUNT=20' public/agent-swarm.js
          grep -q 'navigator.hardwareConcurrency' public/agent-swarm.js
          grep -q 'embedding-worker.js' public/rag-cascade.js
          grep -q 'omniAgentSearch' public/rag-cascade.js
          grep -q 'runAgentSwarm' public/agent-swarm.js
          grep -q 'The Literal' public/agent-node-worker.js
          grep -q 'The Semantic' public/agent-node-worker.js
          grep -q 'The Contextualizer' public/agent-node-worker.js
          grep -q 'The Reference Judge' public/agent-node-worker.js
          grep -q 'The Sweeper' public/agent-node-worker.js
          grep -q 'The Bouncer' public/agent-node-worker.js
          grep -q 'Short Entity Hunter' public/agent-node-worker.js
          grep -q 'Long Form Explainer' public/agent-node-worker.js
          grep -q 'Freshness Sentinel' public/agent-node-worker.js
          grep -q 'OCR Rescue' public/agent-node-worker.js
          grep -q 'Definition Specialist' public/agent-node-worker.js
          grep -q 'Chronology Mapper' public/agent-node-worker.js
          grep -q 'Cross Library Balancer' public/agent-node-worker.js
          grep -q 'Citation Specialist' public/agent-node-worker.js
          grep -q 'Conflict and Duplicate Auditor' public/agent-node-worker.js
          grep -q 'Mission Master' public/agent-node-worker.js
          grep -q 'backfillLibraryChunksToCloud' public/app.js
          grep -q '/api/admin/library-mirror-upsert' public/app.js
          grep -q '/api/admin/library-mirror-upsert' src/index.js
          grep -q 'STRICT_PHRASE_MISS' public/local-turbine-worker.js
          grep -q 'CONTEXT_BEFORE=2' public/local-turbine-worker.js
          grep -q 'CONTEXT_AFTER=4' public/local-turbine-worker.js
          grep -q 'extractSemanticReference' public/local-turbine-worker.js

          # Omni Library sync: max 200 rows resident per page, then explicit release
          test -f public/omni-sync-worker.js
          test -f public/agent-swarm.js
          test -f public/agent-node-worker.js
          grep -q 'BATCH_SIZE=200' public/omni-sync-worker.js
          grep -q 'DAEMON_INTERVAL_MS=3\*60\*1000' public/sw-v3.js
          grep -q 'periodicsync' public/sw-v3.js
          grep -q '/api/admin/omni-sync-state' public/sw-v3.js
          grep -q 'sync_generation' public/sw-v3.js
          grep -q 'rows.length=0' public/sw-v3.js
          grep -q 'rows=null' public/sw-v3.js
          grep -q 'payload=null' public/sw-v3.js
          grep -q 'rows.length=0' public/omni-sync-worker.js
          grep -q 'rows=null' public/omni-sync-worker.js
          grep -q 'payload=null' public/omni-sync-worker.js
          grep -q '/api/admin/omni-sync-page' src/index.js
          grep -q '/api/admin/omni-sync-state' src/index.js
          grep -q 'supabaseOmniSyncState' src/index.js
          grep -q 'Math.min(200' src/index.js
          grep -q 'memory_bounded:true' src/index.js
          grep -q 'configurePhantomDaemon' public/app.js
          grep -q 'PHANTOM_DAEMON_INTERVAL_MS=3\*60\*1000' public/app.js
          grep -q 'omni-daemon-tick' public/app.js
          ! grep -q 'id="omniSyncBtn"' public/index.html
          grep -q 'OMNI_SYNC_STAMP_KEY' public/app.js

          # Rendering parity and zero-noise UI
          grep -q 'Nenhuma correspondência exata encontrada na biblioteca total.' public/app.js
          grep -q 'appendElegantSilence' public/app.js
          grep -q 'offline-turbine-source-subtitle' public/app.js
          grep -q 'offline-turbine-source-subtitle' public/style.css
          grep -q 'white-space:pre-wrap' public/style.css
          grep -q 'margin-bottom:2.5rem' public/style.css
          grep -q 'offline-turbine-viewport' public/style.css
          grep -q 'layer.replaceChildren(fragment)' public/app.js
          grep -q 'const GAP=40' public/app.js
          grep -q 'mergeSequentialOfflineCards' public/app.js

          # Service-worker cache and V7 manifest
          grep -q 'CACHE_NAME="fns-ultimate-resilience-v7"' public/sw-v3.js
          grep -q '"/strict-match-core.js"' public/sw-v3.js
          grep -q '"/omni-sync-worker.js"' public/sw-v3.js
          grep -q '"version": "7.0.0"' public/failover-manifest.json
          grep -q '"engine": "twenty-agent-cross-device-v7"' public/failover-manifest.json
          grep -q '"logical_agent_count": 20' public/failover-manifest.json
          grep -q '"agent2_transformers_semantic": true' public/failover-manifest.json
          grep -q '"agent10_bouncer": true' public/failover-manifest.json
          grep -q '"phantom_daemon": true' public/failover-manifest.json
          grep -q '"same_paragraph_phrase_required": true' public/failover-manifest.json
          grep -q '"omni_sync_batch_size": 200' public/failover-manifest.json

          # Existing production invariants kept intact
          grep -q 'MASSIVE_NODE_COUNT = 500' src/index.js
          grep -q 'MASSIVE_WORKER_CONCURRENCY = 25' src/index.js
          grep -q 'SSE_KEEPALIVE_MS = 15000' src/index.js
          grep -q 'EXACT_SWARM_NODE_COUNT = 1000' src/index.js
          grep -q 'EXACT_MAX_CONCURRENT_REQUESTS = 50' src/index.js
          grep -q 'api.groq.com/openai/v1/chat/completions' src/index.js
          grep -q 'text/event-stream' src/index.js
          grep -q 'provider_auth_surface: "server-side-secrets-only"' src/index.js
          grep -q 'client_provider_keys_exposed: false' src/index.js
          grep -q 'class LibraryDO' src/index.js
          grep -q 'durable_objects' wrangler.jsonc
          grep -q 'new_sqlite_classes' wrangler.jsonc
          grep -q 'pdfjs-dist@4.10.38' public/app.js
          grep -q 'whisper-large-v3-turbo' src/index.js
          ! grep -q 'env.AI' src/index.js
          ! grep -q '@cf/' src/index.js
          ! grep -qi 'gemini' src/index.js
          ! grep -q 'AI.toMarkdown' src/index.js
          ! grep -q 'request.formData' src/index.js
          ! grep -q 'readPdfBuffer' src/index.js

