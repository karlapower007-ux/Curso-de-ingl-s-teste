name: QA Cloudflare Native RAG

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths:
      - 'consciencia-fabiano/**'
      - '.github/workflows/qa-cloudflare-native-rag.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax and architecture checks
        run: |
          npm run check
          node --check scripts/browser-voice-smoke.mjs
          node --check scripts/browser-ingest-smoke.mjs
          bash -n scripts/autonomous-release.sh
          grep -q 'whisper-large-v3-turbo' src/index.js
          grep -q 'browser-local-pt-BR' src/index.js
          grep -q 'class LibraryDO' src/index.js
          grep -q 'env.LIBRARY' src/index.js
          grep -q 'durable_objects' wrangler.jsonc
          grep -q 'new_sqlite_classes' wrangler.jsonc
          grep -q 'conversation_messages' src/index.js
          grep -q 'job_text_pages' src/index.js
          grep -q 'CHUNK_CONCURRENCY = 50' src/index.js
          grep -q 'EMBED_CONCURRENCY = 50' src/index.js
          grep -q 'GROQ_HISTORY_MESSAGES' src/index.js
          grep -q 'GROQ_INPUT_BUDGET_TOKENS' src/index.js
          grep -q 'isUsefulChunkText' src/index.js
          grep -q 'embeddingAdapter' src/index.js
          grep -q 'lexical_rag_fallback: true' src/index.js
          grep -q 'embedding_provider: "browser-transformers"' src/index.js
          grep -q 'LOCAL_EMBEDDING_MODEL' src/index.js
          grep -q 'local-ingest-start' public/app.js
          grep -q 'indexedDB' public/app.js
          grep -q 'embedding-worker.js' public/app.js
          grep -q 'marked@15.0.12' public/index.html
          grep -q 'dompurify@3.2.6' public/index.html
          grep -q 'DOMPurify' public/app.js
          grep -q 'safeMarkdownHtml' public/app.js
          grep -q 'isFocusedCitationRequest' src/index.js
          grep -q 'LEXICAL_MIN_COVERAGE = 0.50' src/index.js
          grep -q 'gracefulEmptyAnswer' src/index.js
          grep -q 'transcribeBlobWithRetry' public/app.js
          grep -q 'scheduleVoiceReconnect' public/app.js
          grep -q 'unlockAudioOutput' public/app.js
          grep -q 'noiseSuppression: true' public/app.js
          grep -q 'echoCancellation: true' public/app.js
          grep -q 'autoGainControl: true' public/app.js
          grep -q 'pdf_noise_filter: true' src/index.js
          grep -q 'humanDocumentName' src/index.js
          grep -q 'cleanNarrativeText' src/index.js
          grep -q 'Obras Padrão' src/index.js
          grep -q 'standard.*works' public/app.js
          grep -q 'BM25_K1' src/index.js
          grep -q 'bm25-fallback' src/index.js
          grep -q 'chunking_density: "paragraph-verse-granular"' src/index.js
          grep -q 'Fabiano, não encontrei uma referência direta' src/index.js
          grep -q 'aggressiveGroqMessages' src/index.js
          grep -q 'GROQ_AGGRESSIVE_INPUT_BUDGET_TOKENS' src/index.js
          grep -q 'idbDelete' public/app.js
          grep -q 'pruneIndexedDbPointers' public/app.js
          grep -q 'Date.now()' public/index.html
          grep -q 'no-cache, no-store, must-revalidate' src/index.js
          grep -q '/api/admin/ping' src/index.js
          grep -q '/health/deploy' src/index.js
          grep -q 'deploy-only-no-storage-read' src/index.js
          grep -q 'semantic_min_score: 0.38' src/index.js
          grep -q 'top_k: 15' src/index.js
          grep -q 'require_lexical_match: false' src/index.js
          grep -q 'processar TODOS os trechos de contexto fornecidos' src/index.js
          grep -q 'FONTES E REFERÊNCIAS' src/index.js
          grep -q 'whisper-local.js' public/index.html
          grep -q 'rag-cascade.js' public/index.html
          test -f public/rag-cascade.js
          test -f public/rag-search-worker.js
          test -f public/opfs-sqlite-worker.js
          test -f public/biblioteca.json
          grep -q 'fns_rag_resilience_v1' public/rag-search-worker.js
          grep -q '@sqlite.org/sqlite-wasm@3.53.4-build1' public/opfs-sqlite-worker.js
          grep -q 'Localhost ChromaDB' public/rag-cascade.js
          grep -q 'Supabase pgvector' public/rag-cascade.js
          grep -q 'Pinecone Serverless' public/rag-cascade.js
          grep -q 'MongoDB Atlas Vector Search' public/rag-cascade.js
          grep -q 'DataStax Astra DB' public/rag-cascade.js
          grep -q 'BM25 local bruto' public/rag-cascade.js
          grep -q '/api/rag/search' src/index.js
          grep -q '/api/rag/provider-search' src/index.js
          grep -q 'normalizeClientContext' src/index.js
          grep -q 'rag_resilience_levels: 10' src/index.js
          grep -q '1.15.0-offline-library-sync' src/index.js
          grep -q 'local_library_catalog: true' src/index.js
          grep -q 'LOCAL_EMBED_DB_VERSION = 3' public/app.js
          grep -q 'library_catalog' public/app.js
          grep -q 'sync_queue' public/app.js
          grep -q 'offline_vector_jobs' public/app.js
          grep -q 'processSyncQueue' public/app.js
          grep -q 'queueOfflineVectorization' public/app.js
          grep -q 'getDocumentChunks' public/rag-cascade.js
          grep -q 'get-document-chunks' public/rag-search-worker.js
          grep -q 'IndexedDB local' public/app.js
          grep -q 'token.length < 4' src/index.js
          grep -q 'Digite a senha de acesso da biblioteca' public/app.js
          grep -q 'localBookCatalog' public/app.js
          grep -q 'Seus livros NÃO foram apagados' public/app.js
          grep -q 'listDocuments' public/rag-cascade.js
          grep -q 'deleteDocument' public/rag-cascade.js
          grep -q 'list-documents' public/rag-search-worker.js
          test -f public/whisper-local.js
          test -f public/whisper-worker.js
          grep -q 'Xenova/whisper-tiny' public/whisper-worker.js
          grep -q '@xenova/transformers@2.17.2' public/whisper-worker.js
          grep -q 'noiseSuppression: true' public/whisper-local.js
          grep -q 'echoCancellation: true' public/whisper-local.js
          grep -q 'autoGainControl: true' public/whisper-local.js
          test -f public/embedding-worker.js
          grep -q '@huggingface/transformers@3.8.1' public/embedding-worker.js
          grep -q 'search-lexical' src/index.js
          grep -q 'never split a rate-limited batch' src/index.js
          grep -q 'parallelMapLimit' src/index.js
          grep -q 'embedOneWithRetry' src/index.js
          grep -q 'matrixChunkPages' src/index.js
          grep -q 'server_pdf_parsing: false' src/index.js
          grep -q 'R2_DIRECT_DISABLED' src/index.js
          grep -q '/api/admin/r2-presign' src/index.js
          grep -q 'extractPdfLocally' public/app.js
          grep -q 'uploadOriginalDirectToR2' public/app.js
          grep -q 'pdfjs-dist@4.10.38' public/index.html
          grep -q 'waitForIndexJob' public/app.js
          grep -q 'voiceLoopEnabled' public/app.js
          grep -q 'api.groq.com/openai/v1/chat/completions' src/index.js
          grep -q 'text/event-stream' src/index.js
          grep -q 'streamChat' public/app.js
          ! grep -q 'env.AI' src/index.js
          ! grep -q '@cf/' src/index.js
          ! grep -qi 'gemini' src/index.js
          ! grep -q 'AI.toMarkdown' src/index.js
          ! grep -q 'request.formData' src/index.js
          ! grep -q 'readPdfBuffer' src/index.js
          ! grep -q 'job_pdf_parts' src/index.js
          ! grep -q 'onrender.com' src/index.js
