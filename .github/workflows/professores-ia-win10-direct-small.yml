name: QA direct Windows 10 ISO small parts
on:
  push:
    branches: [professores-ia-qemu-bootstrap]

permissions:
  contents: read

jobs:
  direct-win10-small:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official verified Windows 10 Enterprise Evaluation x64
        shell: bash
        run: |
          set -euo pipefail
          url='https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'
          curl -fL --retry 5 --retry-delay 3 "$url" -o win10e.iso
          echo 'ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668  win10e.iso' | sha256sum -c -
          split -b 240M -d -a 2 win10e.iso small.part.
          sha256sum small.part.* > small.parts.sha256
          ls -lh small.part.*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('small.part.00') != '' }}
        with:
          name: win10e-direct-small-00
          path: small.part.00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('small.part.01') != '' }}
        with:
          name: win10e-direct-small-01
          path: small.part.01
          retention-days: 1
          compression-level: 0
