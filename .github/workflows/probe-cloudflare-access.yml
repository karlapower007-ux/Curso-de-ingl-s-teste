name: Probe Cloudflare Access capability

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths: ['.github/workflows/probe-cloudflare-access.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1
      - name: Probe Access applications API
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/access.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/access/apps?per_page=50" -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')
          success=$(jq -r '.success // false' /tmp/access.json)
          err=$(jq -r '.errors[0].code // 0' /tmp/access.json)
          count=$(jq -r 'if (.result|type)=="array" then (.result|length) else 0 end' /tmp/access.json)
          echo "ACCESS_APPS http=$code success=$success count=$count error_code=$err"
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/probe-cloudflare-access.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Cloudflare Access capability probe"
          git push origin HEAD:consciencia-cloudflare-native-v1
