name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
      - '.github/workflows/qa-olivia-v9-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Protect Emma core and validate Olivia V9
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v6.js
          node --check src/strict-output-v7.js
          node --check public/app.js
          node --check public/natural-state.js
          node --check public/natural-turns.js
          node --check public/olivia-core-v8.js
          node --check public/olivia-v9-singleton.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' public/index.html
          grep -q '"main": "src/strict-output-v7.js"' wrangler.jsonc
          grep -q 'olivia-v9-singleton.js?v=9' public/index.html
          grep -q 'olivia-core-v8.js?v=8' public/index.html
          grep -q 'if (window.oliviaIsBooted)' public/olivia-v9-singleton.js
          grep -q 'window.oliviaIsBooted = true' public/olivia-v9-singleton.js
          grep -q "container.id = 'olivia-standalone-node'" public/olivia-v9-singleton.js
          grep -q "avatarImg.id = 'olivia-avatar-img'" public/olivia-v9-singleton.js
          grep -q 'document.body.appendChild(container)' public/olivia-v9-singleton.js
          ! grep -q 'MutationObserver' public/olivia-v9-singleton.js
          echo 'CORE LOCK + OLIVIA V9 SOURCE PASS'

      - name: Validate V9 event bridge and turbines A-O
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v9=fs.readFileSync('public/olivia-v9-singleton.js','utf8');
          const front=fs.readFileSync('public/olivia-core-v8.js','utf8');
          const back=fs.readFileSync('src/strict-output-v7.js','utf8');
          for(const x of [
            "window.addEventListener('fns:olivia:v8:visual', onEngineVisual)",
            "if (type === 'listening-start')",
            "if (type === 'speaking-start')",
            "setAvatarState('listening'",
            "setAvatarState('talking'",
            "setAvatarState('idle'"
          ]) if(!v9.includes(x)) throw new Error('V9 visual bridge missing '+x);
          for(const letter of 'ABCDEFGHIJKLMNO'){
            if(!front.includes(letter+':{label:'))throw new Error('frontend turbine missing '+letter);
            if(!back.includes(letter+':{speaker:'))throw new Error('backend turbine missing '+letter);
          }
          if(!back.includes("@cf/deepgram/aura-2-es"))throw new Error('Aura-2 Spanish missing');
          if(!back.includes("encoding:'linear16',container:'wav'"))throw new Error('lossless Hi-Fi turbines missing');
          if(!front.includes("browser-fallback-"))throw new Error('fast browser fallback missing');
          console.log('V9 VISUAL BRIDGE + TURBINES A-O PASS');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v9-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA production Olivia V9 singleton visual sync and Emma lock
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'

          curl --compressed --fail --silent --show-error "$BASE/?olivia=v9&qa=source" -o production.html
          grep -q 'olivia-v9-singleton.js?v=9' production.html
          grep -q 'olivia-core-v8.js?v=8' production.html
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' production.html

          for f in olivia-fechada.png olivia-falando.png olivia-aberta.png; do
            curl --compressed --fail --silent --show-error -o "$f" "$BASE/assets/$f?v=v9-20260917"
          done
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const hashes=new Set();
          for(const f of ['olivia-fechada.png','olivia-falando.png','olivia-aberta.png']){
            const b=fs.readFileSync(f);
            if(b[0]!==0x89||b[1]!==0x50||b[2]!==0x4e||b[3]!==0x47)throw new Error(f+' invalid');
            hashes.add(crypto.createHash('sha256').update(b).digest('hex'));
          }
          if(hashes.size!==3)throw new Error('Olivia frames not distinct');
          console.log('PRODUCTION OLIVIA V9 ASSETS PASS');
          NODE

          curl --compressed --fail --silent --show-error --max-time 15 -D turbine-a.headers -o turbine-a.audio \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hola. Bienvenido a nuestra práctica de español.","teacher":"Olivia","voice_turbine":"A"}' \
            "$BASE/tts"
          test -s turbine-a.audio
          grep -iq '^x-fns-voice-turbine: A' turbine-a.headers

          curl --compressed --fail --silent --show-error --max-time 15 -D turbine-k.headers -o turbine-k.audio \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hola. Vamos a practicar la pronunciación con calma.","teacher":"Olivia","voice_turbine":"K"}' \
            "$BASE/tts"
          test -s turbine-k.audio
          grep -iq '^x-fns-voice-turbine: K' turbine-k.headers
          echo 'PRODUCTION TTS TURBINES A + K PASS'

          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            await page.goto('https://fns-stt.karlapower007.workers.dev/?olivia=v9&qa=visual',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>window.FNS_OLIVIA_V9?.health?.().imageLoaded===true,{timeout:30000});
            await page.waitForFunction(()=>window.FNS_OLIVIA_V9?.health?.().engineV8===true,{timeout:30000});
            await page.waitForSelector('#liteModal[data-olivia-v9="true"]',{timeout:30000});

            const boot=await page.evaluate(()=>window.FNS_OLIVIA_V9.health());
            if(!boot.globalLock||!boot.singleton||!boot.singletonBodyChild||!boot.singletonOutsideApp||!boot.singletonOutsideModal||!boot.visible||!boot.imageLoaded)throw new Error('V9 boot failed '+JSON.stringify(boot));
            if(boot.turbines!==15||boot.stats.createCount!==1)throw new Error('V9 engine/singleton count failed '+JSON.stringify(boot));

            const singleton=await page.evaluate(async()=>{
              const first=document.getElementById('olivia-standalone-node');
              const id=first?.dataset.instanceId;
              const stage=document.getElementById('oliviaV8Stage');
              if(stage)stage.replaceChildren(document.createElement('div'));
              for(let i=0;i<10;i++)window.FNS_OLIVIA_V8?.ensureSingleton?.();
              const s=document.createElement('script');s.src='/olivia-v9-singleton.js?v=9&reinjection=qa-'+Date.now();document.body.appendChild(s);
              await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=reject;});
              await new Promise(r=>setTimeout(r,250));
              const now=document.getElementById('olivia-standalone-node');
              return {same:first===now,idSame:id===now?.dataset.instanceId,count:document.querySelectorAll('#olivia-standalone-node').length,health:window.FNS_OLIVIA_V9.health()};
            });
            if(!singleton.same||!singleton.idSame||singleton.count!==1||singleton.health.stats.createCount!==1)throw new Error('V9 singleton reinjection/rerender failed '+JSON.stringify(singleton));

            const states=await page.evaluate(async()=>{
              const img=document.getElementById('olivia-avatar-img');
              const node=document.getElementById('olivia-standalone-node');
              const first=node;
              const fire=(type,source)=>window.dispatchEvent(new CustomEvent('fns:olivia:v8:visual',{detail:{type,source}}));
              const out=[];
              fire('listening-start','qa:stt-start');await new Promise(r=>setTimeout(r,90));out.push({state:img.dataset.frame,src:img.src});
              fire('listening-stop','qa:stt-stop');await new Promise(r=>setTimeout(r,90));out.push({state:img.dataset.frame,src:img.src});
              fire('speaking-start','qa:audio-onplay');await new Promise(r=>setTimeout(r,90));out.push({state:img.dataset.frame,src:img.src});
              fire('speaking-stop','qa:audio-ended');await new Promise(r=>setTimeout(r,90));out.push({state:img.dataset.frame,src:img.src});
              return {same:first===document.getElementById('olivia-standalone-node'),out,health:window.FNS_OLIVIA_V9.health()};
            });
            if(!states.same)throw new Error('V9 node replaced during state changes '+JSON.stringify(states));
            if(states.out[0].state!=='listening'||!states.out[0].src.includes('olivia-falando.png'))throw new Error('V9 listening image failed '+JSON.stringify(states));
            if(states.out[1].state!=='idle'||!states.out[1].src.includes('olivia-fechada.png'))throw new Error('V9 STT idle failed '+JSON.stringify(states));
            if(states.out[2].state!=='talking'||!states.out[2].src.includes('olivia-aberta.png'))throw new Error('V9 talking image failed '+JSON.stringify(states));
            if(states.out[3].state!=='idle'||!states.out[3].src.includes('olivia-fechada.png'))throw new Error('V9 TTS idle failed '+JSON.stringify(states));

            const options=await page.evaluate(()=>[...document.querySelectorAll('#voiceTurbineSel option')].map(o=>o.value).join(''));
            if(options!=='ABCDEFGHIJKLMNO')throw new Error('A-O selector mismatch '+options);
            const emma=await page.evaluate(()=>({pngtuber:!!window.FNS_EMMA_PNGTUBER,strict:!!window.FNS_EMMA_STRICT_OUTPUT}));
            if(!emma.pngtuber||!emma.strict)throw new Error('Emma guards missing '+JSON.stringify(emma));

            console.log('PRODUCTION V9 VISUAL PASS',boot,singleton,states,emma);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final status
        run: echo 'DEPLOY PASS - Olivia V9 absolute singleton + forced preload + direct STT/TTS image states; A-O active; Emma/core unchanged'
