name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Protect Emma core and validate Olivia V8
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v6.js
          node --check src/strict-output-v7.js
          node --check public/app.js
          node --check public/natural-state.js
          node --check public/natural-turns.js
          node --check public/olivia-core-v8.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' public/index.html
          grep -q '"main": "src/strict-output-v7.js"' wrangler.jsonc
          grep -q 'olivia-core-v8.js?v=8' public/index.html
          grep -q 'olivia-v8.css?v=8' public/index.html
          ! grep -q 'olivia-core-v7.js?v=7' public/index.html
          ! grep -q 'MutationObserver' public/olivia-core-v8.js
          grep -q "STANDALONE_ID='olivia-standalone-node'" public/olivia-core-v8.js
          grep -q 'if(node)return node;' public/olivia-core-v8.js
          grep -q 'document.body.appendChild(node)' public/olivia-core-v8.js
          echo 'CORE LOCK + OLIVIA V8 SOURCE PASS'

      - name: Validate direct visual wiring and turbines A-O
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const front=fs.readFileSync('public/olivia-core-v8.js','utf8');
          const back=fs.readFileSync('src/strict-output-v7.js','utf8');
          const visual=[
            "window.addEventListener(VISUAL_EVENT,handleVisualEvent)",
            "emitVisual('speaking-start','audio:onplay')",
            "audio.onended=()=>finish(true,null,'audio:onended')",
            "emitVisual('speaking-start','speechSynthesis:onstart')",
            "u.onend=()=>finish(true,'speechSynthesis:onend')",
            "emitVisual('listening-start','stt:startRecording')",
            "emitVisual('listening-stop','stt:transcribe')"
          ];
          for(const x of visual)if(!front.includes(x))throw new Error('visual wiring missing '+x);
          for(const letter of 'ABCDEFGHIJKLMNO'){
            if(!front.includes(letter+':{label:'))throw new Error('frontend turbine missing '+letter);
            if(!back.includes(letter+':{speaker:'))throw new Error('backend turbine missing '+letter);
          }
          if(!back.includes("@cf/deepgram/aura-2-es"))throw new Error('Aura-2 Spanish missing');
          if(!back.includes("encoding:'linear16',container:'wav'"))throw new Error('lossless Hi-Fi turbines missing');
          if(!front.includes("browser-fallback-"))throw new Error('fast browser fallback missing');
          console.log('V8 VISUAL WIRING + TURBINES A-O PASS');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v8-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA production Olivia V8 visual sync and Emma lock
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'

          curl --compressed --fail --silent --show-error "$BASE/?olivia=v8&qa=source" -o production.html
          grep -q 'olivia-core-v8.js?v=8' production.html
          grep -q 'olivia-v8.css?v=8' production.html
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' production.html

          for f in olivia-fechada.png olivia-falando.png olivia-aberta.png; do
            curl --compressed --fail --silent --show-error -o "$f" "$BASE/assets/$f?v=v8-20260917"
          done
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const hashes=new Set();
          for(const f of ['olivia-fechada.png','olivia-falando.png','olivia-aberta.png']){
            const b=fs.readFileSync(f);
            if(b[0]!==0x89||b[1]!==0x50||b[2]!==0x4e||b[3]!==0x47)throw new Error(f+' invalid');
            hashes.add(crypto.createHash('sha256').update(b).digest('hex'));
          }
          if(hashes.size!==3)throw new Error('Olivia frames not distinct');
          console.log('PRODUCTION OLIVIA V8 ASSETS PASS');
          NODE

          curl --compressed --fail --silent --show-error --max-time 15 -D turbine-a.headers -o turbine-a.audio \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hola. Bienvenido a nuestra práctica de español.","teacher":"Olivia","voice_turbine":"A"}' \
            "$BASE/tts"
          test -s turbine-a.audio
          grep -iq '^x-fns-voice-turbine: A' turbine-a.headers

          curl --compressed --fail --silent --show-error --max-time 15 -D turbine-k.headers -o turbine-k.audio \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hola. Vamos a practicar la pronunciación con calma.","teacher":"Olivia","voice_turbine":"K"}' \
            "$BASE/tts"
          test -s turbine-k.audio
          grep -iq '^x-fns-voice-turbine: K' turbine-k.headers
          echo 'PRODUCTION TTS TURBINES A + K PASS'

          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            await page.goto('https://fns-stt.karlapower007.workers.dev/?olivia=v8&qa=visual',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('#liteModal[data-olivia-v8="true"]',{timeout:30000});
            await page.waitForSelector('#olivia-standalone-node[data-visible="true"]',{timeout:30000});
            await page.waitForSelector('#olivia-standalone-image',{timeout:30000});

            const boot=await page.evaluate(()=>{
              const api=window.FNS_OLIVIA_V8;
              const node=document.getElementById('olivia-standalone-node');
              const img=document.getElementById('olivia-standalone-image');
              const cs=getComputedStyle(node),r=node.getBoundingClientRect();
              return {health:api?.health(),visibility:cs.visibility,opacity:cs.opacity,display:cs.display,rect:{w:r.width,h:r.height},loaded:!!(img?.complete&&img?.naturalWidth>0)};
            });
            if(!boot.health?.singletonBodyChild||!boot.health?.singletonOutsideModal||boot.health?.singletonCreates!==1)throw new Error('V8 singleton boot failed '+JSON.stringify(boot));
            if(boot.health?.turbineCount!==15||!boot.loaded||boot.visibility!=='visible'||Number(boot.opacity)!==1||boot.display==='none'||boot.rect.w<100||boot.rect.h<100)throw new Error('V8 visible boot failed '+JSON.stringify(boot));

            const singleton=await page.evaluate(async()=>{
              const api=window.FNS_OLIVIA_V8;
              const first=document.getElementById('olivia-standalone-node');
              const id=first?.dataset.instanceId;
              for(let i=0;i<20;i++)api.ensureSingleton();
              const s=document.createElement('script');s.src='/olivia-core-v8.js?v=8&reinjection=qa-'+Date.now();document.body.appendChild(s);
              await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=reject;});
              const stage=document.getElementById('oliviaV8Stage');
              if(stage)stage.replaceChildren(document.createElement('div'));
              await new Promise(r=>setTimeout(r,250));
              const now=document.getElementById('olivia-standalone-node');
              return {same:first===now,idSame:id===now?.dataset.instanceId,creates:api.health().singletonCreates,parentBody:now?.parentElement===document.body,insideModal:document.querySelector('#liteModal')?.contains(now)};
            });
            if(!singleton.same||!singleton.idSame||singleton.creates!==1||!singleton.parentBody||singleton.insideModal)throw new Error('V8 singleton reinjection/rerender failed '+JSON.stringify(singleton));

            const animation=await page.evaluate(async()=>{
              const api=window.FNS_OLIVIA_V8;
              const node=document.getElementById('olivia-standalone-node');
              const img=document.getElementById('olivia-standalone-image');
              const before=node;
              const frames=[],srcs=[];
              api.emitVisual('speaking-start','qa:visual-start');
              for(let i=0;i<12;i++){
                await new Promise(r=>setTimeout(r,70));
                frames.push(img?.dataset.frame||'');srcs.push(img?.src||'');
              }
              api.emitVisual('speaking-stop','qa:visual-stop');
              await new Promise(r=>setTimeout(r,120));
              return {same:before===document.getElementById('olivia-standalone-node'),frames:[...new Set(frames)],srcs:[...new Set(srcs)],finalFrame:img?.dataset.frame||'',finalSrc:img?.src||'',health:api.health()};
            });
            if(!animation.same||!animation.frames.includes('talking')||!animation.frames.includes('open')||animation.srcs.length<2||animation.finalFrame!=='closed')throw new Error('V8 mouth animation sync failed '+JSON.stringify(animation));

            const options=await page.evaluate(()=>[...document.querySelectorAll('#voiceTurbineSel option')].map(o=>o.value).join(''));
            if(options!=='ABCDEFGHIJKLMNO')throw new Error('A-O selector mismatch '+options);
            const emma=await page.evaluate(()=>({pngtuber:!!window.FNS_EMMA_PNGTUBER,strict:!!window.FNS_EMMA_STRICT_OUTPUT}));
            if(!emma.pngtuber||!emma.strict)throw new Error('Emma guards missing '+JSON.stringify(emma));

            console.log('PRODUCTION V8 VISUAL PASS',boot,singleton,animation,emma);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final status
        run: echo 'DEPLOY PASS - Olivia V8 singleton stable, mouth swaps on direct visual events, A-O active, Emma/core unchanged'
