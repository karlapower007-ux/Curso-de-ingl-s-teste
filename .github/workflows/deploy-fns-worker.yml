name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install

      - name: Protect Emma core and validate multi-core source
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v6.js
          node --check src/strict-output-v7.js
          node --check public/app.js
          node --check public/avatar-core.js
          node -e "const c=require('./src/avatar-config.json'); if(!c.avatars.olivia||c.avatars.olivia.voice.turbines.length!==15) process.exit(1);"
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' public/index.html
          grep -q 'avatar-multicore-v11' public/avatar.html
          grep -q 'avatar-core.js?v=11-multicore' public/avatar.html
          ! grep -q 'app.js' public/avatar.html
          ! grep -q 'olivia-v11-singleton' public/avatar.html
          grep -q 'run_worker_first": true' wrangler.jsonc
          grep -q "path==='/avatar/runtime-config'" src/strict-output-v7.js
          grep -q "path==='/avatar/chat'" src/strict-output-v7.js
          grep -q "path==='/avatar/tts'" src/strict-output-v7.js
          echo 'CORE LOCK + MULTI-CORE SOURCE PASS'

      - name: Validate turbines A-O
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('src/avatar-config.json','utf8')).avatars.olivia;
          const back=fs.readFileSync('src/strict-output-v7.js','utf8');
          if(cfg.voice.turbines.map(x=>x.id).join('')!=='ABCDEFGHIJKLMNO')throw new Error('A-O config mismatch');
          for(const letter of 'ABCDEFGHIJKLMNO')if(!back.includes(letter+':{speaker:'))throw new Error('backend turbine missing '+letter);
          if(!back.includes("@cf/deepgram/aura-2-es"))throw new Error('Aura-2 Spanish missing');
          if(!back.includes("encoding:'linear16',container:'wav'"))throw new Error('Hi-Fi path missing');
          console.log('MULTI-CORE + TURBINES A-O PASS');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-multicore-v11-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA production multi-core isolation and real Olivia voice
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'

          curl --compressed --fail --silent --show-error "$BASE/" -o default.html
          grep -q 'app.js?v=14' default.html
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' default.html

          curl --compressed --fail --silent --show-error -D avatar.headers "$BASE/?avatar=olivia&qa=multicore" -o avatar.html
          grep -q 'avatar-multicore-v11' avatar.html
          grep -q 'avatar-core.js?v=11-multicore' avatar.html
          ! grep -q 'app.js' avatar.html
          ! grep -q 'olivia-v11-singleton' avatar.html
          grep -iq '^x-fns-entry-point: avatar:olivia' avatar.headers
          grep -iq '^x-fns-avatar-core: FNS-AVATAR-MULTICORE-V11' avatar.headers

          curl --compressed --fail --silent --show-error "$BASE/avatar/runtime-config?avatar=olivia" -o config.json
          node - <<'NODE'
          const c=require('./config.json').avatar;
          if(c.id!=='olivia')throw new Error('wrong avatar');
          if(c.voice.turbines.map(x=>x.id).join('')!=='ABCDEFGHIJKLMNO')throw new Error('wrong turbines');
          if(!c.images.idle||!c.images.listening||!c.images.talking)throw new Error('missing images');
          console.log('RUNTIME CONFIG PASS');
          NODE

          curl --compressed --fail --silent --show-error --max-time 15 -D avatar-tts.headers -o avatar-tts.audio \
            -H 'Content-Type: application/json' \
            -d '{"avatar":"olivia","text":"Hola. Esta es una prueba del núcleo independiente.","voice_turbine":"A"}' \
            "$BASE/avatar/tts"
          test -s avatar-tts.audio
          grep -iq '^x-fns-avatar-core: FNS-AVATAR-MULTICORE-V11' avatar-tts.headers
          grep -iq '^x-fns-avatar-id: olivia' avatar-tts.headers
          grep -iq '^x-fns-voice-turbine: A' avatar-tts.headers

          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            await page.goto('https://fns-stt.karlapower007.workers.dev/?avatar=olivia&qa=browser',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>window.FNS_AVATAR_CORE?.health?.().avatar==='olivia',{timeout:30000});
            await page.waitForSelector('#avatarImage',{timeout:30000});
            const isolated=await page.evaluate(()=>({health:window.FNS_AVATAR_CORE.health(),hasAppJs:!!document.querySelector('script[src*="app.js"]'),hasOldV11:!!document.querySelector('script[src*="olivia-v11-singleton"]'),root:document.querySelector('main')?.id}));
            if(isolated.hasAppJs||isolated.hasOldV11||isolated.root!=='avatarApp'||!isolated.health.rootOnly)throw new Error('Isolation failed '+JSON.stringify(isolated));
            await page.click('#voiceBtn');
            const seen=[];const started=Date.now();
            while(Date.now()-started<8000){
              await new Promise(r=>setTimeout(r,100));
              const h=await page.evaluate(()=>window.FNS_AVATAR_CORE.health());seen.push(h);
              if(seen.some(x=>x.mode==='talking'&&x.stats.mouthFrames>=3))break;
            }
            if(!seen.some(x=>x.mode==='talking'))throw new Error('Real voice never entered talking '+JSON.stringify(seen.slice(-8)));
            if(Math.max(...seen.map(x=>x.stats.mouthFrames||0))<3)throw new Error('Mouth frames did not move '+JSON.stringify(seen.slice(-8)));
            const frames=new Set(seen.filter(x=>x.mode==='talking').map(x=>x.frame));
            if(frames.size<2)throw new Error('Mouth did not alternate PNG frames '+JSON.stringify([...frames]));
            await page.goto('https://fns-stt.karlapower007.workers.dev/',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>!!window.FNS_EMMA_PNGTUBER,{timeout:30000});
            const emma=await page.evaluate(()=>({pngtuber:!!window.FNS_EMMA_PNGTUBER,strict:!!window.FNS_EMMA_STRICT_OUTPUT,hasAppJs:!!document.querySelector('script[src*="app.js"]')}));
            if(!emma.pngtuber||!emma.strict||!emma.hasAppJs)throw new Error('Emma default route changed '+JSON.stringify(emma));
            console.log('PRODUCTION MULTI-CORE VISUAL + REAL VOICE PASS',isolated,seen.slice(-1)[0],emma);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final status
        run: echo 'DEPLOY PASS - dynamic avatar router + isolated root + config factory; Olivia independent; Emma/core unchanged'
