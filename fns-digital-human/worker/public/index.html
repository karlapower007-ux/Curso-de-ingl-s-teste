<!-- FNS FINAL FIX: MOTOR PNGTUBER DA EMMA (inalterado) -->
<script>
    (function() {
        const BASE_PATH = './assets/';
        const CACHE_BUST = '?v=pngtuber-final-20260917';
        const IMG_FECHADA = BASE_PATH + 'emma-fechada.png' + CACHE_BUST;
        const IMG_FALANDO = BASE_PATH + 'emma-falando.png' + CACHE_BUST;
        const IMG_ABERTA  = BASE_PATH + 'emma-aberta.png' + CACHE_BUST;

        const p1 = new Image(); p1.src = IMG_FECHADA;
        const p2 = new Image(); p2.src = IMG_FALANDO;
        const p3 = new Image(); p3.src = IMG_ABERTA;

        function emmaAvatar() {
            return document.querySelector('.human-avatar:not([data-teacher="olivia"])');
        }

        function limparLegado(avatarContainer) {
            document.getElementById('fns-pseudo-killer')?.remove();
            document.getElementById('fns-override-v19')?.remove();
            document.getElementById('fns-nova-boca-v19')?.remove();

            avatarContainer.querySelectorAll(
                '.avatar-mouth-motion, .avatar-fx-layer, .avatar-webgl-layer, .avatar-camera-vignette'
            ).forEach(function(node) { node.remove(); });

            avatarContainer.dataset.expressionRig = 'pngtuber-final';
            avatarContainer.dataset.avatarVisualMode = 'image-swapping';
        }

        function loopPNGTuber() {
            const avatarContainer = emmaAvatar();

            if (avatarContainer) {
                limparLegado(avatarContainer);

                const targetElement = avatarContainer.querySelector('img') || avatarContainer;
                const styles = getComputedStyle(avatarContainer);
                const mouthOpen = parseFloat(styles.getPropertyValue('--mouth-open')) || 0;

                let targetSrc = IMG_FECHADA;
                let state = 'closed';

                if (mouthOpen >= 0.15 && mouthOpen < 0.60) {
                    targetSrc = IMG_FALANDO;
                    state = 'talking';
                } else if (mouthOpen >= 0.60) {
                    targetSrc = IMG_ABERTA;
                    state = 'open';
                }

                avatarContainer.dataset.pngtuberState = state;
                avatarContainer.dataset.pngtuberLevel = Math.max(0, Math.min(1, mouthOpen)).toFixed(3);

                if (targetElement.tagName === 'IMG') {
                    const expected = targetSrc.replace('./', '');
                    if (!targetElement.src.includes(expected)) {
                        targetElement.src = targetSrc;
                    }
                } else {
                    const currentBg = targetElement.style.backgroundImage;
                    const expected = targetSrc.replace('./', '');
                    if (!currentBg.includes(expected)) {
                        targetElement.style.backgroundImage = `url('${targetSrc}')`;
                    }
                }
            }

            requestAnimationFrame(loopPNGTuber);
        }

        window.FNS_EMMA_PNGTUBER = {
            frames: {closed: IMG_FECHADA, talking: IMG_FALANDO, open: IMG_ABERTA},
            thresholds: {talking: 0.15, open: 0.60},
            getState: function() {
                const face = emmaAvatar();
                return face ? {
                    state: face.dataset.pngtuberState || 'closed',
                    level: parseFloat(getComputedStyle(face).getPropertyValue('--mouth-open')) || 0,
                    src: face.querySelector('img')?.src || ''
                } : null;
            }
        };

        requestAnimationFrame(loopPNGTuber);
    })();
</script>
