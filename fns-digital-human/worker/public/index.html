  <meta http-equiv="Expires" content="0">
  <script>
  (()=>{try{
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister().catch(()=>{}))).catch(()=>{});}
    if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>/fns|emma|avatar|visual|static/i.test(k)).map(k=>caches.delete(k)))).catch(()=>{});}
    console.warn('[FNS TURBINE v18] bootstrap cache bypass ativo');
  }catch(e){console.warn('[FNS TURBINE v18] bootstrap warning',e)}})();
  </script>

<!-- FNS FIX DEFINITIVO: INJEÇÃO INLINE A 60FPS (CAVIDADE ANATÔMICA) --> 
<script> 
    (function() { 
        // 1. INJETA CSS SÓ PARA MATAR OS PSEUDO-ELEMENTOS (O Risco Duplo) 
        let styleTag = document.getElementById('fns-pseudo-killer'); 
        if (!styleTag) { 
            styleTag = document.createElement('style'); 
            styleTag.id = 'fns-pseudo-killer'; 
            styleTag.innerHTML = ` 
                html body .human-avatar .avatar-mouth-motion::after,  
                html body .human-avatar .avatar-mouth-motion::before {  
                    display: none !important;  
                } 
            `; 
            document.head.appendChild(styleTag); 
        } 
 
        // 2. MOTOR DE SOBREPOSIÇÃO (ESMAGA O CORE E FORÇA A ESTÉTICA 3D) 
        function nukeCoreStyles() { 
            // Caça fantasmas residuais (Remove lixo de versões antigas) 
            const ghostStyle = document.getElementById('fns-override-v19'); 
            if (ghostStyle) ghostStyle.remove(); 
            const ghostMouth = document.getElementById('fns-nova-boca-v19'); 
            if (ghostMouth) ghostMouth.remove(); 
 
            const mouth = document.querySelector('.human-avatar .avatar-mouth-motion'); 
             
            if (mouth) { 
                // Força o elemento a existir e aparecer 
                mouth.style.setProperty('display', 'block', 'important'); 
                mouth.style.setProperty('visibility', 'visible', 'important'); 
                mouth.style.setProperty('opacity', '1', 'important'); 
                 
                // AS NOVAS MEDIDAS REDUZIDAS (Encaixe perfeito dentro dos lábios naturais) 
                mouth.style.setProperty('width', '10.5%', 'important');  
                mouth.style.setProperty('height', '7px', 'important');  
                mouth.style.setProperty('left', '50%', 'important'); 
                mouth.style.setProperty('top', '58.2%', 'important'); 
                 
                // Cavidade anatômica: Dentes brancos/translúcidos e fundo ultra-escuro 
                mouth.style.setProperty('background', 'linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(220,220,220,0.5) 12%, #140205 15%, #3a0a14 100%)', 'important'); 
                 
                // Formato de "U" (Reto nos dentes, curvo embaixo) 
                mouth.style.setProperty('border-radius', '10% 10% 50px 50px', 'important'); 
                 
                // Sombra interna profunda sem criar bordas duras 
                mouth.style.setProperty('box-shadow', 'inset 0px 3px 4px rgba(0, 0, 0, 0.85)', 'important'); 
                mouth.style.setProperty('border', 'none', 'important'); 
 
                // A TRAVA ANTI-RISCO (Impede a boca de fechar 100% durante a fala) 
                if (mouth.style.transform) { 
                    if (mouth.style.transform.includes('scale(0)')) { 
                        mouth.style.transform = mouth.style.transform.replace('scale(0)', 'scale(1)'); 
                    } 
                    const currentTransform = mouth.style.transform; 
                    mouth.style.transform = currentTransform 
                        .replace(/scaleY\([^)]+\)/, function(match) { 
                            const val = parseFloat(match.replace(/[^\d.]/g, '')); 
                            return 'scaleY(' + Math.max(0.40, val) + ')';  
                        }) 
                        .replace(/scaleX\([^)]+\)/, 'scaleX(1.05)'); 
                } 
            } 
             
            // Roda infinitamente acompanhando o framerate da tela 
            requestAnimationFrame(nukeCoreStyles); 
        } 
         
        requestAnimationFrame(nukeCoreStyles); 
    })(); 
</script>
</body></html>
