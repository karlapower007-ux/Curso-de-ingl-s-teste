name: Probe automatic Workers Builds token

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths: ['.github/workflows/probe-build-token-auto.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - name: Probe server-generated build token support
        shell: bash
        run: |
          set +e
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST             "$api/builds/tokens"             -H "Authorization: Bearer $CF_TOKEN"             -H 'Content-Type: application/json'             --data '{"build_token_name":"Consciencia Fabiano Native Auto"}')
          jq '{success,errors,result:{build_token_uuid:.result.build_token_uuid,build_token_name:.result.build_token_name,owner_type:.result.owner_type}}' /tmp/out.json
          echo "AUTO_BUILD_TOKEN_HTTP=$code"

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/probe-build-token-auto.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish automatic build token probe"
          git push origin HEAD:consciencia-cloudflare-native-v1
