name: QA Fabiano backend
on:
  push:
    branches: [avatar-fabiano-production]
    paths:
      - 'avatar-fabiano/**'
      - 'render.yaml'
      - '.github/workflows/qa-fabiano-backend.yml'
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile avatar-fabiano/main.py
      - name: Wait for Render auto-deploy
        run: |
          set +e
          URL='https://avatar-fabiano-api.onrender.com/health'
          for i in $(seq 1 12); do
            echo "=== probe $i ==="
            body=$(curl -sS --max-time 30 "$URL" || true)
            echo "$body"
            if echo "$body" | grep -q '"versao":"3.2.0"'; then
              echo "RENDER_3_2_ACTIVE=yes"
              exit 0
            fi
            sleep 15
          done
          echo "RENDER_3_2_ACTIVE=no"
          exit 0
