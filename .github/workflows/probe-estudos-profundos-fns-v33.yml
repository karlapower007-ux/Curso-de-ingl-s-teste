name: Probe Estudos Profundos FNS v33

on:
  push:
    branches:
      - estudos-profundos-fns-v33-golden-20260920
    paths:
      - ".github/workflows/probe-estudos-profundos-fns-v33.yml"
      - "estudos-profundos-fns-v33/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe live ChatGPT Site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          BASE="https://estudos-profundos-fns.karlapower007.chatgpt.site"

          for ROUTE in "/" "/fale-com-o-fabiano" "/admin/fabiano"; do
            SAFE="$(printf '%s' "$ROUTE" | sed 's#^/$#home#; s#^/##; s#/#-#g')"
            [ -n "$SAFE" ] || SAFE="home"
            CODE="$(curl -L --compressed --silent --show-error --max-time 30               -D "probe/$SAFE.headers" -o "probe/$SAFE.html"               -w '%{http_code}' "$BASE$ROUTE" || true)"
            echo "PROBE_ROUTE=$ROUTE HTTP=$CODE BYTES=$(wc -c < "probe/$SAFE.html" 2>/dev/null || echo 0)"
            echo "--- TITLE/MARKERS $ROUTE ---"
            grep -Eio '<title>[^<]*</title>|Fale com o Fabiano|Estudos Profundos FNS|__NEXT_DATA__|/_next/[^" ]+|/assets/[^" ]+' "probe/$SAFE.html" | head -n 80 || true
            echo "--- HEADERS $ROUTE ---"
            sed -n '1,40p' "probe/$SAFE.headers" || true
          done

          echo "--- HOME ASSET URLS ---"
          grep -Eo '(src|href)="[^"]+"' probe/home.html | sed 's/^[^=]*="//; s/"$//' | head -n 120 || true

      - name: Inspect published JS bundles and API contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://estudos-profundos-fns.karlapower007.chatgpt.site"
          mkdir -p probe/assets

          for PAGE in probe/fale-com-o-fabiano.html probe/admin-fabiano.html; do
            [ -f "$PAGE" ] || continue
            grep -Eo '(/_next/static/chunks/[^"\\ ]+\.js)' "$PAGE" | sort -u
          done > probe/chunk-paths.txt

          while IFS= read -r ASSET; do
            [ -n "$ASSET" ] || continue
            NAME="$(basename "$ASSET")"
            curl -L --compressed --fail --silent --show-error --max-time 30               "$BASE$ASSET" -o "probe/assets/$NAME" || true
            curl -L --compressed --silent --show-error --max-time 20               "$BASE$ASSET.map" -o "probe/assets/$NAME.map" || true
          done < probe/chunk-paths.txt

          echo "--- API/ROUTE STRINGS ---"
          grep -RahoE '(/api/[A-Za-z0-9_?&=./:-]+|/admin/[A-Za-z0-9_?&=./:-]+|/fale-com-o-fabiano|indexedDB|OPFS|navigator\.storage|embedd[a-zA-Z_-]*|vector[a-zA-Z_-]*|chunk[a-zA-Z_-]*|map.?reduce|source[a-zA-Z_-]*|citation[a-zA-Z_-]*|groq|supabase|D1|R2)' probe/assets             | sort -u | head -n 500 || true

          echo "--- FABIANO BUNDLE CONTEXT ---"
          for FILE in probe/assets/*fabiano-conversation*.js; do
            [ -f "$FILE" ] || continue
            node - "$FILE" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2], s=fs.readFileSync(p,'utf8');
          const needles=['/api/','fetch(','indexedDB','OPFS','navigator.storage','embedding','vector','chunk','source','citation','map','reduce','audio','speechSynthesis','localStorage'];
          for(const n of needles){
            let i=s.indexOf(n);
            if(i>=0) console.log('\n### '+n+'\n'+s.slice(Math.max(0,i-900),Math.min(s.length,i+2400)));
          }
          NODE
          done

          echo "--- ADMIN BUNDLE CONTEXT ---"
          for FILE in probe/assets/*admin-panel*.js; do
            [ -f "$FILE" ] || continue
            node - "$FILE" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2], s=fs.readFileSync(p,'utf8');
          const needles=['/api/','fetch(','upload','pdf','chunk','embedding','vector','index','reindex','delete','library','document'];
          for(const n of needles){
            let i=s.indexOf(n);
            if(i>=0) console.log('\n### '+n+'\n'+s.slice(Math.max(0,i-900),Math.min(s.length,i+2600)));
          }
          NODE
          done

      - name: Test live FNS v33 API behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://estudos-profundos-fns.karlapower007.chatgpt.site"
          mkdir -p probe/api

          echo "--- PUBLIC ASK ---"
          ASK_CODE="$(curl --compressed --silent --show-error --max-time 45             -o probe/api/ask.json -w '%{http_code}'             -H 'Content-Type: application/json'             -d '{"question":"Qual é o propósito desta biblioteca? Responda apenas com base nas fontes disponíveis.","history":[]}'             "$BASE/api/fabiano/ask" || true)"
          echo "ASK_HTTP=$ASK_CODE BYTES=$(wc -c < probe/api/ask.json 2>/dev/null || echo 0)"
          node - <<'NODE'
          const fs=require('fs');
          const p='probe/api/ask.json';
          if(!fs.existsSync(p)) process.exit(0);
          const raw=fs.readFileSync(p,'utf8');
          try{
            const j=JSON.parse(raw);
            console.log(JSON.stringify({
              ok:j.ok,
              keys:Object.keys(j),
              answer:typeof j.answer==='string'?j.answer.slice(0,1800):j.answer,
              source_count:Array.isArray(j.sources)?j.sources.length:null,
              sources:Array.isArray(j.sources)?j.sources.slice(0,12):j.sources,
              diagnostics:j.diagnostics||j.meta||null,
              error:j.error||j.message||null
            },null,2));
          }catch{ console.log(raw.slice(0,2200)); }
          NODE

          echo "--- ADMIN AUTH BOUNDARIES ---"
          for ROUTE in documents chunks export uploads index-job; do
            CODE="$(curl --compressed --silent --show-error --max-time 20               -o "probe/api/$ROUTE.json" -w '%{http_code}'               "$BASE/api/fabiano/admin/$ROUTE" || true)"
            echo "ADMIN_ROUTE=$ROUTE HTTP=$CODE BODY=$(head -c 500 "probe/api/$ROUTE.json" 2>/dev/null | tr '\n' ' ')"
          done

          echo "--- STATIC FALLBACK ASSETS ---"
          for ROUTE in /fabiano-sw.js /avatar_idle.png /avatar_listening.png /avatar_speaking.png; do
            CODE="$(curl -L --compressed --silent --show-error --max-time 20               -o /dev/null -w '%{http_code}' "$BASE$ROUTE" || true)"
            echo "ASSET=$ROUTE HTTP=$CODE"
          done

          echo "--- EXACT FNS ADMIN CLIENT CONTRACT ---"
          for FILE in probe/assets/*admin-panel*.js; do
            [ -f "$FILE" ] || continue
            node - "$FILE" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2], src=fs.readFileSync(p,'utf8');
          const needles=[
            '/api/fabiano/admin/documents',
            '/api/fabiano/admin/chunks',
            '/api/fabiano/admin/export',
            '/api/fabiano/admin/index-job',
            '/api/fabiano/admin/uploads'
          ];
          for(const n of needles){
            const i=src.indexOf(n);
            console.log('\n### '+n);
            console.log(i<0?'NOT_FOUND':src.slice(Math.max(0,i-2600),Math.min(src.length,i+5200)));
          }
          NODE
          done

      - name: Locate FNS admin route implementations in published bundles
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const dir='probe/assets';
          const files=fs.readdirSync(dir).filter(x=>x.endsWith('.js'));
          const needles=[
            '/api/fabiano/admin/documents',
            '/api/fabiano/admin/chunks',
            '/api/fabiano/admin/export',
            '/api/fabiano/admin/index-job',
            '/api/fabiano/admin/uploads',
            '/api/fabiano/ask'
          ];
          for(const needle of needles){
            console.log('\n===== '+needle+' =====');
            let any=false;
            for(const name of files){
              const p=path.join(dir,name), src=fs.readFileSync(p,'utf8');
              let i=src.indexOf(needle);
              if(i<0) continue;
              any=true;
              console.log('\nFILE='+name);
              console.log(src.slice(Math.max(0,i-3500),Math.min(src.length,i+7000)));
            }
            if(!any) console.log('NOT_FOUND_IN_DOWNLOADED_BUNDLES');
          }
          NODE

      - name: Exercise public RAG with several evidence questions
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://estudos-profundos-fns.karlapower007.chatgpt.site"
          node - <<'NODE'
          const questions=[
            "O que a biblioteca contém sobre Joseph Smith?",
            "Explique Doutrina e Convênios 129 com base nos documentos da biblioteca.",
            "Quais fontes da biblioteca tratam da Restauração?"
          ];
          const base="https://estudos-profundos-fns.karlapower007.chatgpt.site";
          for(const q of questions){
            const res=await fetch(base+"/api/fabiano/ask",{
              method:"POST",
              headers:{"content-type":"application/json"},
              body:JSON.stringify({question:q,history:[]})
            });
            const raw=await res.text();
            let j={}; try{j=JSON.parse(raw)}catch{}
            console.log(JSON.stringify({
              q,http:res.status,
              answer:String(j.answer||raw).slice(0,1200),
              source_count:Array.isArray(j.sources)?j.sources.length:null,
              sources:Array.isArray(j.sources)?j.sources.slice(0,8):null
            }));
          }
          NODE

      - name: Discover native ChatGPT Sites project metadata
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const roots=['probe/fale-com-o-fabiano.html','probe/admin-fabiano.html'];
          if(fs.existsSync('probe/assets')){
            for(const name of fs.readdirSync('probe/assets').filter(x=>x.endsWith('.js')||x.endsWith('.map'))){
              roots.push(path.join('probe/assets',name));
            }
          }
          const regexes=[
            /appgprj_[A-Za-z0-9_-]+/g,
            /project[_-]?id["':= ]+([A-Za-z0-9_-]+)/gi,
            /source[_-]?version(?:[_-]?number)?["':= ]+([0-9]+)/gi,
            /projection[_-]?revision["':= ]+([0-9]+)/gi,
            /deployment[_-]?id["':= ]+([A-Za-z0-9_-]+)/gi
          ];
          const hits=new Set();
          for(const p of roots){
            if(!fs.existsSync(p)) continue;
            const src=fs.readFileSync(p,'utf8');
            for(const re of regexes){
              for(const m of src.matchAll(re)) hits.add(m[0]);
            }
          }
          console.log('PROJECT_METADATA_HITS='+JSON.stringify([...hits].slice(0,200)));

          const needles=['appgprj_','project_id','projectId','source_version','sourceVersion','projection_revision','projectionRevision','chatgpt.com','/edit','site-controls'];
          for(const p of roots){
            if(!fs.existsSync(p)) continue;
            const src=fs.readFileSync(p,'utf8');
            for(const n of needles){
              const i=src.indexOf(n);
              if(i>=0){
                console.log('\nFILE='+p+' NEEDLE='+n);
                console.log(src.slice(Math.max(0,i-1400),Math.min(src.length,i+3000)));
              }
            }
          }
          NODE

      - name: Inspect lazy FNS PDF admin panel bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://estudos-profundos-fns.karlapower007.chatgpt.site"
          FILE="probe/assets/fabiano-admin-panel-DAzPOv0O.js"
          curl -L --compressed --fail --silent --show-error --max-time 30             "$BASE/_next/static/chunks/fabiano-admin-panel-DAzPOv0O.js" -o "$FILE"

          echo "--- FNS ADMIN PANEL API AND STORAGE CONTRACT ---"
          node - "$FILE" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2], src=fs.readFileSync(p,'utf8');
          const needles=[
            '/api/fabiano/admin/documents',
            '/api/fabiano/admin/chunks',
            '/api/fabiano/admin/export',
            '/api/fabiano/admin/index-job',
            '/api/fabiano/admin/uploads',
            'pdf.js','pdfjs','PDF','embedding','vector','chunk',
            'indexedDB','navigator.storage','FileReader','crypto.subtle',
            'reindex','delete','DELETE','POST','PUT'
          ];
          console.log('BYTES='+src.length);
          for(const n of needles){
            let from=0,count=0;
            while(count<3){
              const i=src.indexOf(n,from);
              if(i<0) break;
              console.log('\n### '+n+' #'+(count+1));
              console.log(src.slice(Math.max(0,i-2200),Math.min(src.length,i+5200)));
              from=i+n.length; count++;
            }
          }
          NODE

      - name: Inspect ChatGPT Sites control surface
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://estudos-profundos-fns.karlapower007.chatgpt.site"
          FILE="probe/assets/site-controls-CPf82N9q.js"
          curl -L --compressed --fail --silent --show-error --max-time 30             "$BASE/_next/static/chunks/site-controls-CPf82N9q.js" -o "$FILE"
          node - "$FILE" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2], src=fs.readFileSync(p,'utf8');
          console.log("SITE_CONTROLS_BYTES="+src.length);
          const needles=[
            'edit','publish','project','appgprj','chatgpt.com','openai.com',
            'postMessage','window.parent','window.open','owner','site-controls',
            '/api/','fetch(','deployment'
          ];
          for(const n of needles){
            let i=src.indexOf(n), count=0;
            while(i>=0 && count<5){
              console.log('\n### '+n+' #'+(count+1));
              console.log(src.slice(Math.max(0,i-1800),Math.min(src.length,i+4200)));
              i=src.indexOf(n,i+n.length); count++;
            }
          }
          NODE

      - name: Audit publisher metadata and auth routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://estudos-profundos-fns.karlapower007.chatgpt.site"
          mkdir -p probe/publisher

          echo "--- DEPLOYMENT-ID RUNTIME CHUNK ---"
          curl -L --compressed --silent --show-error --fail             "$BASE/_next/static/chunks/deployment-id-DFhHa9wO.js"             -o probe/publisher/deployment-id.js
          cat probe/publisher/deployment-id.js

          echo "--- SITE-CONTROLS FULL CHUNK ---"
          curl -L --compressed --silent --show-error --fail             "$BASE/_next/static/chunks/site-controls-CPf82N9q.js"             -o probe/publisher/site-controls.js
          cat probe/publisher/site-controls.js

          echo "--- RESPONSE HEADERS ---"
          for ROUTE in "/fale-com-o-fabiano" "/api/fabiano/ask" "/admin" "/api/admin/chatgpt-login" "/api/admin/login"; do
            SAFE="$(echo "$ROUTE" | sed 's#^/##; s#/#-#g')"
            [ -n "$SAFE" ] || SAFE=root
            curl --compressed --silent --show-error --max-time 20               -D "probe/publisher/$SAFE.headers" -o /dev/null "$BASE$ROUTE" || true
            echo "### $ROUTE"
            cat "probe/publisher/$SAFE.headers" || true
          done

          echo "--- OPTIONS / METHOD DISCOVERY ---"
          for ROUTE in             "/api/fabiano/admin/documents"             "/api/fabiano/admin/chunks"             "/api/fabiano/admin/export"             "/api/fabiano/admin/uploads"             "/api/fabiano/admin/index-job"             "/api/admin/chatgpt-login"             "/api/admin/login"; do
            SAFE="$(echo "$ROUTE" | sed 's#^/##; s#/#-#g')"
            CODE="$(curl --compressed --silent --show-error --max-time 20               -X OPTIONS -D "probe/publisher/$SAFE.options.headers"               -o "probe/publisher/$SAFE.options.body" -w '%{http_code}' "$BASE$ROUTE" || true)"
            echo "OPTIONS $ROUTE HTTP=$CODE"
            grep -Ei '^(allow|access-control-allow-|location|x-|server|content-type):'               "probe/publisher/$SAFE.options.headers" || true
            head -c 600 "probe/publisher/$SAFE.options.body" 2>/dev/null || true
            echo
          done

          echo "--- AUTH ENDPOINT VALIDATION (NO CREDENTIALS) ---"
          for ROUTE in "/api/admin/chatgpt-login" "/api/admin/login"; do
            SAFE="$(echo "$ROUTE" | sed 's#^/##; s#/#-#g')"
            CODE="$(curl --compressed --silent --show-error --max-time 20               -H 'content-type: application/json' -d '{}'               -D "probe/publisher/$SAFE.post.headers"               -o "probe/publisher/$SAFE.post.body" -w '%{http_code}' "$BASE$ROUTE" || true)"
            echo "POST $ROUTE HTTP=$CODE BODY=$(head -c 1000 "probe/publisher/$SAFE.post.body" 2>/dev/null | tr '\n' ' ')"
          done

          echo "--- CANDIDATE SITE META ENDPOINTS ---"
          for ROUTE in             "/manifest.json" "/site.webmanifest" "/_next/static/build-manifest.json"             "/_next/build-manifest.json" "/.well-known/openai-site"             "/.well-known/chatgpt-site" "/api/site" "/api/site/meta" "/api/deployment"             "/api/version" "/api/health" "/health" "/__meta" "/__deployment"; do
            SAFE="$(echo "$ROUTE" | sed 's#^/##; s#/#-#g')"
            CODE="$(curl --compressed --silent --show-error --max-time 15               -o "probe/publisher/meta-$SAFE.body" -w '%{http_code}' "$BASE$ROUTE" || true)"
            echo "META $ROUTE HTTP=$CODE BODY=$(head -c 400 "probe/publisher/meta-$SAFE.body" 2>/dev/null | tr '\n' ' ')"
          done

          echo "--- ADMIN PAGE AUTH CONTRACT ---"
          curl -L --compressed --silent --show-error --max-time 20 "$BASE/admin"             -o probe/publisher/admin.html || true
          grep -Eio 'ChatGPT|entrar|login|senha|PIN|autor|/api/admin/[A-Za-z0-9_?&=./:-]+'             probe/publisher/admin.html | sort -u | head -n 200 || true

      - name: Audit repository deploy integrations with GitHub token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p probe/github-integration
          endpoints=(
            "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100"
            "repos/$GITHUB_REPOSITORY/actions/workflows/360999688/runs?per_page=100"
            "repos/$GITHUB_REPOSITORY/deployments?per_page=100"
            "repos/$GITHUB_REPOSITORY/environments?per_page=100"
            "repos/$GITHUB_REPOSITORY/hooks?per_page=100"
            "repos/$GITHUB_REPOSITORY/pages"
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          )
          for ENDPOINT in "${endpoints[@]}"; do
            SAFE="$(echo "$ENDPOINT" | sed 's#[/?&=]#-#g')"
            echo "### GH_API $ENDPOINT"
            if gh api "$ENDPOINT" > "probe/github-integration/$SAFE.json" 2> "probe/github-integration/$SAFE.err"; then
              echo "GH_API_OK"
              jq 'if type=="array" then .[0:100] else . end' "probe/github-integration/$SAFE.json" > "probe/github-integration/$SAFE.pretty.json" || true
              cat "probe/github-integration/$SAFE.pretty.json"
            else
              echo "GH_API_DENIED"
              cat "probe/github-integration/$SAFE.err"
            fi
          done

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: estudos-profundos-fns-v33-probe
          path: probe/
          retention-days: 7
