name: Inspect Autonomous Fabiano Release

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/release-status-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "LATEST_RELEASES"
          gh run list --repo "$GITHUB_REPOSITORY"             --workflow "Autonomous Cloudflare Native Release"             --branch "consciencia-cloudflare-native-v1"             --limit 5             --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY"             --workflow "Autonomous Cloudflare Native Release"             --branch "consciencia-cloudflare-native-v1"             --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          echo "LATEST_RUN_ID=$RUN_ID"
          if [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,url,jobs
            STATUS="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
            if [ "$STATUS" = "completed" ]; then
              echo "LATEST_RELEASE_LOG_TAIL"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log | tail -n 220
            fi

          echo "CURRENT_R2_LIBRARY_MANIFEST"
          curl -fsS -A 'curl/8.5.0' --max-time 20 \
            "https://consciencia-fabiano.focoeepoder2.workers.dev/api/v1/r2/library-manifest" \
            | jq '{ok,generation,total_chunks,total_books,vector_count,source,authoritative,updated_at}' || true
          echo "CURRENT_RAG_PROBE"
          curl -sS -A 'curl/8.5.0' --max-time 25 \
            -H 'Content-Type: application/json' \
            --data '{"question":"Jesus Cristo convênio"}' \
            "https://consciencia-fabiano.focoeepoder2.workers.dev/api/rag/search" \
            | jq '{ok,match_count:(.matches|if type=="array" then length else 0 end),provider,reason}' || true

          echo "LATEST_LIBRARY_RECOVERY"
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "Recover Consciência Fabiano V8 Library Merge" \
            --limit 10 \
            --json databaseId,status,conclusion,headBranch,headSha,createdAt,updatedAt,url,displayTitle
          RECOVERY_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "Recover Consciência Fabiano V8 Library Merge" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          echo "LATEST_RECOVERY_RUN_ID=$RECOVERY_RUN_ID"
          if [ -n "$RECOVERY_RUN_ID" ]; then
            gh run view "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,url,jobs
            RECOVERY_STATUS="$(gh run view "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
            if [ "$RECOVERY_STATUS" = "completed" ]; then
              echo "LATEST_RECOVERY_LOG_TAIL"
              gh run view "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --log | tail -n 320
            fi
          fi
          fi
