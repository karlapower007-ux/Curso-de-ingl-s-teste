    if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>/fns|emma|avatar|visual|static/i.test(k)).map(k=>caches.delete(k)))).catch(()=>{});}

<!-- FNS FIX DEFINITIVO: ESTÉTICA 3D + TRAVA ANTI-RISCO + CAÇA-FANTASMAS --> 
<style id="fns-smile-proportions"> 
    /* 1. GEOMETRIA 3D E CURVATURA NATURAL (O SORRISO) */ 
    html body .human-avatar .avatar-mouth-motion { 
        display: block !important; 
        visibility: visible !important; 
        opacity: 1 !important; 
         
        width: 12.8% !important; /* Encaixe anatômico perfeito no rosto */ 
        height: 12px !important; /* Altura mínima para o efeito 3D não sumir */ 
        left: 50% !important; 
        top: 58.1% !important; 
         
        /* Dentes no topo, cavidade escura no meio, língua embaixo */ 
        background: linear-gradient(180deg, #ffffff 0%, #e8e3dc 22%, #2b080d 45%, #9e334a 100%) !important; 
         
        /* Curva em U suave (cantos para cima, centro para baixo) */ 
        border-radius: 15% 15% 70% 70% / 30% 30% 90% 90% !important; 
         
        /* Ilusão 3D de cavidade realística (sombra interna) */ 
        box-shadow: inset 0px 4px 6px rgba(0, 0, 0, 0.6) !important; 
        border: none !important; 
    } 
 
    /* 2. ANIQUILA O RISCO DUPLO FEIO */ 
    html body .human-avatar .avatar-mouth-motion::after, 
    html body .human-avatar .avatar-mouth-motion::before { 
        display: none !important; 
    } 
</style> 
 
<script> 
    /* 3. MOTOR DE BLINDAGEM E TRAVA MATEMÁTICA */ 
    (function() { 
        function forceCorrectionAndCleanup() { 
            // Garante que o lixo invisível da v19 continue morto 
            const ghostStyle = document.getElementById('fns-override-v19'); 
            if (ghostStyle) ghostStyle.remove(); 
             
            const ghostMouth = document.getElementById('fns-nova-boca-v19'); 
            if (ghostMouth) ghostMouth.remove(); 
 
            // Intercepta e corrige a boca em tempo real a 60fps 
            const mouth = document.querySelector('.human-avatar .avatar-mouth-motion'); 
            if (mouth && mouth.style.transform) { 
                // Ressuscita se o core tentar dar scale(0) 
                if (mouth.style.transform.includes('scale(0)')) { 
                    mouth.style.transform = mouth.style.transform.replace('scale(0)', 'scale(1)'); 
                } 
 
                // TRAVA ANTI-RISCO: Proíbe o sistema de esmagar a altura para menos de 0.40 
                const currentTransform = mouth.style.transform; 
                mouth.style.transform = currentTransform 
                    .replace(/scaleY\([^)]+\)/, function(match) { 
                        const val = parseFloat(match.replace(/[^\d.]/g, '')); 
                        return 'scaleY(' + Math.max(0.40, val) + ')';  
                    }) 
                    // Trava a proporção lateral para não deformar 
                    .replace(/scaleX\([^)]+\)/, 'scaleX(1.05)');  
            } 
             
            requestAnimationFrame(forceCorrectionAndCleanup); 
        } 
         
        requestAnimationFrame(forceCorrectionAndCleanup); 
    })(); 
</script>  
</body></html>
