name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA PT-BR roundtrip
        run: |
          sleep 4
          curl --fail --silent --show-error --retry 2 --retry-delay 2             https://fns-stt.karlapower007.workers.dev/qa/language             -o qa-language.json
          cat qa-language.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('qa-language.json','utf8')); if(!r.ok) throw new Error('QA endpoint failed'); if(!r.transcript_has_portuguese) throw new Error('Portuguese STT detection failed: '+JSON.stringify(r)); if(r.tts_language!=='pt-BR') throw new Error('PT-BR TTS routing failed: '+JSON.stringify(r)); console.log('QA PT-BR PASS', r);"
