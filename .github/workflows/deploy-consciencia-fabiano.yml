name: Validate Consciência Fabiano V10.1

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths:
      - 'consciencia-fabiano/**'
      - '.github/workflows/deploy-consciencia-fabiano.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consciencia-fabiano-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --ignore-scripts

      - name: Validate v10.1 without publishing
        run: |
          set -euo pipefail
          npm run check
          grep -q '10.1.0-private-egress-offline-online' src/index.js
          grep -q 'PRIVATE_EGRESS_LOCK = true' src/index.js
          ! grep -q 'https://api.cohere.com' src/index.js
          ! grep -q 'generativelanguage.googleapis.com' src/index.js
          ! grep -q 'openrouter.ai' src/index.js
          ! grep -q 'api.x.ai' src/index.js
          grep -q 'id="operationMode"' public/index.html
          grep -q 'id="prepareOfflineBtn"' public/index.html
          grep -q 'id="costGuardStatus"' public/index.html
          echo "VALIDATION_ONLY=pass"

      - name: Confirm this workflow cannot deploy
        run: |
          echo "DEPLOYMENT_DISABLED_HERE=true"
          echo "Authoritative production workflow: .github/workflows/v80-production-deploy.yml"
