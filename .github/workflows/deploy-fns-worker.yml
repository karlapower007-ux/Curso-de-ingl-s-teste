name: Deploy FNS Worker

on:
  push:
    branches: [fns-digital-human]
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install

      - name: Materialize frozen Olivia V16 avatar frames
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const name of ['fechada', 'falando', 'aberta']) {
            const src = `public/assets/olivia-${name}-v16.b64`;
            const dst = `public/assets/olivia-${name}-v16.jpg`;
            const raw = fs.readFileSync(src, 'utf8')
              .replace(/^data:image\/jpeg;base64,/i, '')
              .replace(/\s+/g, '');
            const buf = Buffer.from(raw, 'base64');
            fs.writeFileSync(dst, buf);
            console.log(`${name}: materialized ${buf.length} bytes`);
          }
          NODE
          for name in fechada falando aberta; do
            dst="public/assets/olivia-${name}-v16.jpg"
            fallback="public/assets/olivia-${name}-v15.jpg"
            if ! file "$dst" | grep -q JPEG; then
              echo "V16 $name source invalid; using protected V15 JPEG fallback"
              cp "$fallback" "$dst"
            fi
            file "$dst" | grep -q JPEG
            test -s "$dst"
          done
          echo 'FROZEN OLIVIA VISUAL MATERIALIZATION PASS'

      - name: Protect frozen visual/core + validate Olivia V17 behavior
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v7.js
          node --check src/strict-output-v16.js
          node --check src/strict-output-v17.js
          node --check public/app.js
          node --check public/avatar-core.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q '"main": "src/strict-output-v17.js"' wrangler.jsonc
          grep -q "language:'es-ES'" src/strict-output-v7.js
          grep -q "languageLabel:'Español'" src/strict-output-v7.js
          grep -q "subtitle:'Profesora de español'" src/strict-output-v7.js
          grep -q 'olivia-fechada-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-falando-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-aberta-v16.jpg' src/strict-output-v16.js
          grep -q 'FNS-OLIVIA-V17-DYNAMIC-CHAT' src/strict-output-v17.js
          grep -q 'Array.isArray(body?.messages)' src/strict-output-v17.js
          grep -q 'Array.isArray(body?.history)' src/strict-output-v17.js
          grep -q 'static_fallback:false' src/strict-output-v17.js
          ! grep -q 'Claro. Sigamos en español. Cuéntame un poco más sobre eso.' src/strict-output-v17.js
          echo 'FROZEN VISUAL + CORE LOCK + OLIVIA V17 SOURCE PASS'

      - name: V17 dynamic chat contract — fake AI only
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v17.js';
          const seen=[];
          const env={
            AI:{
              async run(model,input){
                seen.push({model,messages:structuredClone(input.messages)});
                const last=[...input.messages].reverse().find(x=>x.role==='user')?.content||'';
                if(/te amo mucho/i.test(last)) return {response:'Gracias por decírmelo. Me alegra hablar contigo. ¿Cómo estás hoy?'};
                return {response:'¡Hola! Me alegra verte. ¿Cómo estás hoy?'};
              }
            }
          };
          const first=new Request('https://qa.local/chat',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({teacher:'Olivia',level:'A1',message:'Hola',history:[]})
          });
          const r1=await worker.fetch(first,env,{});
          const j1=await r1.json();
          if(!r1.ok||!/Hola/i.test(j1.reply||'')||j1.static_fallback!==false) throw new Error('V17 first turn failed '+JSON.stringify(j1));

          const second=new Request('https://qa.local/chat',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
              teacher:'Olivia',level:'A1',message:'Te amo mucho',
              messages:[
                {role:'user',content:'Hola'},
                {role:'assistant',content:j1.reply}
              ]
            })
          });
          const r2=await worker.fetch(second,env,{});
          const j2=await r2.json();
          if(!r2.ok||!/Gracias/i.test(j2.reply||'')||j2.reply===j1.reply) throw new Error('V17 contextual turn failed '+JSON.stringify(j2));
          const finalMessages=seen.at(-1)?.messages||[];
          if(!finalMessages.some(x=>x.role==='user'&&x.content==='Hola')) throw new Error('prior user turn missing');
          if(!finalMessages.some(x=>x.role==='assistant'&&x.content===j1.reply)) throw new Error('prior assistant turn missing');
          if(!finalMessages.some(x=>x.role==='user'&&x.content==='Te amo mucho')) throw new Error('current user turn missing');
          console.log('V17 DYNAMIC CHAT PASS — full context delivered, distinct contextual replies, no canned fallback');
          NODE

      - name: Local mock contract — never touch Workers AI
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v17.js';
          const env = new Proxy({}, { get(){ throw new Error('AI/env access forbidden in QA mock'); } });
          for (const path of ['/tts','/chat','/stt']) {
            const req = new Request('https://qa.local'+path, {
              method:'POST',
              headers:{'Content-Type':'application/json','X-FNS-QA-Mock':'1'},
              body:JSON.stringify({teacher:'Olivia',text:'Hola'})
            });
            const res = await worker.fetch(req, env, {});
            if (!res.ok || res.headers.get('X-FNS-QA-Mock') !== '1') throw new Error('mock leak '+path);
          }
          console.log('MOCK QA PASS — 0 Workers AI requests');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v17-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production HTML/assets smoke — frozen visuals, no AI endpoints
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'
          curl --compressed --fail --silent --show-error "$BASE/?avatar=olivia&v=16&qa=visual-only" -o olivia-v16.html
          grep -q 'olivia-fechada-v16.jpg' olivia-v16.html
          grep -q 'olivia-falando-v16.jpg' olivia-v16.html
          grep -q 'olivia-aberta-v16.jpg' olivia-v16.html
          grep -q 'es-ES' olivia-v16.html
          grep -q 'Profesora de español' olivia-v16.html
          for f in olivia-fechada-v16.jpg olivia-falando-v16.jpg olivia-aberta-v16.jpg; do
            curl --compressed --fail --silent --show-error -o "$f" "$BASE/assets/$f?v=16"
            file "$f" | grep -q JPEG
          done
          echo 'PRODUCTION FROZEN V16 VISUAL PASS — NO TTS/STT/CHAT CALLED'

      - name: Pixel-visible browser QA — frozen V16 screenshot, zero AI calls
        run: |
          npm install --no-save puppeteer-core@24.18.0 pngjs@7.0.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const {PNG}=require('pngjs');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            let blockedAI=0;
            await page.setRequestInterception(true);
            page.on('request',req=>{
              const p=new URL(req.url()).pathname;
              if(['/tts','/stt','/chat'].includes(p)){blockedAI++;return req.abort('blockedbyclient');}
              req.continue();
            });
            await page.goto('https://fns-stt.karlapower007.workers.dev/?avatar=olivia&v=16&qa=pixels',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>{
              const i=document.getElementById('olivia-avatar-img');
              return i&&i.complete&&i.naturalWidth>0&&i.naturalHeight>0;
            },{timeout:30000});
            const result=await page.evaluate(()=>{
              const img=document.getElementById('olivia-avatar-img');
              const rect=img.getBoundingClientRect();
              return {
                panel:document.getElementById('panel-language')?.textContent?.trim(),
                subtitle:document.getElementById('avatar-subtitle')?.textContent?.trim(),
                src:img.currentSrc||img.src,
                natural:[img.naturalWidth,img.naturalHeight],
                rect:[rect.width,rect.height],
                display:getComputedStyle(img).display,
                visibility:getComputedStyle(img).visibility,
                opacity:getComputedStyle(img).opacity
              };
            });
            if(result.panel!=='Español · A1')throw new Error('language leak '+JSON.stringify(result));
            if(!/español/i.test(result.subtitle||''))throw new Error('subtitle leak '+JSON.stringify(result));
            if(!result.src.includes('olivia-fechada-v16.jpg'))throw new Error('wrong frame source '+JSON.stringify(result));
            if(result.natural[0]!==256||result.natural[1]!==256)throw new Error('unexpected generated frame dimensions '+JSON.stringify(result));
            if(result.rect[0]<100||result.rect[1]<100||result.display==='none'||result.visibility==='hidden'||Number(result.opacity)<0.9)throw new Error('avatar geometry hidden '+JSON.stringify(result));
            if(blockedAI!==0)throw new Error('page attempted AI endpoints during visual QA: '+blockedAI);

            const element=await page.$('#olivia-avatar-img');
            const rendered=await element.screenshot({encoding:'binary'});
            const png=PNG.sync.read(rendered);
            let nonBlack=0,bright=0,min=765,max=0;
            for(let i=0;i<png.data.length;i+=4){
              const sum=png.data[i]+png.data[i+1]+png.data[i+2];
              if(sum>30)nonBlack++;
              if(sum>180)bright++;
              if(sum<min)min=sum;
              if(sum>max)max=sum;
            }
            const total=png.width*png.height;
            const pixels={nonBlack,bright,dynamicRange:max-min,total,nonBlackRatio:nonBlack/total,brightRatio:bright/total};
            if(pixels.nonBlackRatio<0.35||pixels.brightRatio<0.10||pixels.dynamicRange<120)throw new Error('avatar rendered black/blank '+JSON.stringify({result,pixels}));
            await page.screenshot({path:'olivia-v17-visible-frozen-v16.png',fullPage:true});
            console.log('OLIVIA V17 FROZEN VISUAL PIXEL QA PASS',result,pixels);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload frozen visual proof
        uses: actions/upload-artifact@v4
        with:
          name: olivia-v17-frozen-v16-visual-proof
          path: fns-digital-human/worker/olivia-v17-visible-frozen-v16.png
          retention-days: 30

      - name: Final status
        run: echo 'DEPLOY V17 PASS — dynamic contextual chat only; V16 visual/HTML/CSS/assets frozen; Emma/core unchanged'
