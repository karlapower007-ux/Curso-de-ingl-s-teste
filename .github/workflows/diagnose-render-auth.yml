name: Diagnose Render Auth

on:
  push:
    branches: [avatar-fabiano-production]
    paths:
      - '.github/workflows/diagnose-render-auth.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Report deploy capability
        shell: bash
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then echo "HAS_RENDER_DEPLOY_HOOK=yes"; else echo "HAS_RENDER_DEPLOY_HOOK=no"; fi
          if [ -n "${RENDER_API_KEY:-}" ]; then echo "HAS_RENDER_API_KEY=yes"; else echo "HAS_RENDER_API_KEY=no"; fi
          if [ -n "${RENDER_SERVICE_ID:-}" ]; then echo "HAS_RENDER_SERVICE_ID=yes"; else echo "HAS_RENDER_SERVICE_ID=no"; fi
