name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Static JS syntax checks
        run: |
          node --check src/index.js
          node --check public/app.js
          node --check public/emma-static.js

      - name: QA turn state machine
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('public/app.js','utf8');
          const fail=m=>{throw new Error(m)};

          for(const token of [
            "FLOW_STATES=Object.freeze",
            "IDLE:'idle'",
            "LISTENING:'listening'",
            "PROCESSING:'processing'",
            "SPEAKING:'speaking'",
            "let isSpeaking=false",
            "let isRecording=false",
            "let isProcessing=false",
            "mic.disabled=busy",
            "audio.onended=()=>finish(true)",
            "setFlowState(FLOW_STATES.SPEAKING",
            "setFlowState(FLOW_STATES.IDLE"
          ]) if(!app.includes(token)) fail('Missing state-machine invariant: '+token);

          if(app.includes('startShadowBrowserSTT')) fail('Shadow SpeechRecognition must not coexist with MediaRecorder');
          if(app.includes('useBrowserSttFallback(')) fail('STT fallback must not auto-open Web Speech');
          if(app.includes('startShadowBrowserSTT();')) fail('MediaRecorder still starts browser STT');
          if(!app.includes("if(isSpeaking||isProcessing)return;")) fail('Mic has no speaking/processing guard');
          if(!app.includes('pollinationsBrowserReply')) fail('Direct browser Pollinations fallback missing');
          if(!app.includes('llm7BrowserReply')) fail('Direct browser LLM7 emergency fallback missing');
          if(!app.includes("'https://api.llm7.io/v1/chat/completions'")) fail('Browser LLM7 endpoint missing');
          if(!app.includes("model:'codestral-latest'")) fail('Browser LLM7 turbo model missing');
          if(!app.includes('browserSttPreferred||neuralQuotaExhausted')) fail('Known emergency mode still wastes a Cloudflare chat round-trip');
          if(!app.includes("'https://text.pollinations.ai/'")) fail('Pollinations browser endpoint missing');
          if(!app.includes("enterQuotaRestMode({preserveFlow:true})")) fail('Emergency brain can still unlock microphone early');

          const remote=app.slice(app.indexOf('async function remoteSpeak'),app.indexOf('async function unlockVoice'));
          if(remote.includes('stopRemoteVoice();')) fail('remoteSpeak must not destroy an active audio element before playback');
          if(!remote.includes('audio.onended=()=>finish(true)')) fail('Audio completion is not gated on onended');
          if(!remote.includes('return await new Promise')) fail('Speech lifecycle is not awaited');

          const browser=app.slice(app.indexOf('function startBrowserOnlySTT'),app.indexOf('function nextUtcMidnightMs'));
          const starts=(browser.match(/\.start\(\)/g)||[]).length;
          if(starts!==1) fail('Browser STT must have exactly one explicit start call, found '+starts);

          console.log('QA TURN STATE PASS: one ear at a time; mic locked during processing/speaking; audio releases only on ended');
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA resilient multilingual TTS
        run: |
          sleep 5
          test_tts () {
            NAME="$1"
            TEXT="$2"

            HTTP_CODE=$(curl --silent --show-error \
              -D "$NAME.headers" \
              -o "$NAME.body" \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data "$(node -e 'console.log(JSON.stringify({text:process.argv[1],teacher:"Emma"}))' "$TEXT")" \
              "https://fns-stt.karlapower007.workers.dev/tts")

            ENGINE=$(tr -d '\r' < "$NAME.headers" | awk -F': ' 'tolower($1)=="x-fns-voice-engine"{print $2}' | tail -1)
            TYPE=$(tr -d '\r' < "$NAME.headers" | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -1)
            SIZE=$(wc -c < "$NAME.body")

            echo "$NAME http=$HTTP_CODE engine=$ENGINE type=$TYPE bytes=$SIZE"

            if [ "$HTTP_CODE" = "200" ]; then
              if [ "$SIZE" -lt 1000 ]; then
                echo "$NAME returned too little audio: $SIZE bytes"
                exit 1
              fi
              case "$TYPE" in
                audio/*|application/octet-stream*) ;;
                *) echo "$NAME invalid audio content-type: $TYPE"; exit 1 ;;
              esac
              return
            fi

            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('$NAME.body','utf8')); if(!(r.quota_exhausted===true || r.code==='FNS_DAILY_NEURON_QUOTA')) throw new Error('Unexpected TTS failure: '+JSON.stringify(r)); console.log('Graceful quota response accepted for $NAME');"
          }

          test_tts pt "Olá Emma, boa noite. Você consegue me entender perfeitamente em português?"
          test_tts en "Now let's continue in English. Correct my mistakes."
          test_tts es "Ahora quiero hablar contigo en español."
          test_tts mixed "Emma, explique em português a diferença entre I have been e I was."

      - name: QA Emma visual layering
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('public/app.js','utf8');
          const css=fs.readFileSync('public/emma-static.css','utf8');
          const rig=fs.readFileSync('public/emma-static.js','utf8');

          const fail=(m)=>{throw new Error(m)};
          const markup=app.slice(app.indexOf('function avatarVisualMarkup'),app.indexOf('let activeTeacher'));
          if(!markup.includes('avatar-photo-base')) fail('Base portrait layer missing');
          if(markup.includes('avatar-photo-jaw')) fail('Duplicate jaw image layer still present');
          if(markup.includes('avatar-eye-layer')) fail('Duplicate eye image layer still present');
          if(!markup.includes('data-avatar-ready')) fail('Portrait preload state missing');
          if(!markup.includes('avatar-mouth-motion')) fail('Single smooth mouth overlay missing');
          if(markup.includes('avatar-mouth-cavity') || markup.includes('avatar-lip ')) fail('Legacy multi-layer mouth still present');
          if(/canvas|getContext\s*\(/i.test(markup+css)) fail('Canvas/pixel mouth manipulation must not be used');
          if(!css.includes('.avatar-fx-layer')) fail('Transparent FX layer missing');
          if(!css.includes('background:transparent')) fail('FX layer is not transparent');
          if(!rig.includes('portrait.complete&&portrait.naturalWidth>0')) fail('Rig does not wait for portrait load');
          if(!app.includes('createMediaElementSource(audio)')) fail('Audio analyser lip-sync missing');
          if(!app.includes('getByteTimeDomainData(samples)')) fail('Smooth RMS lip-sync missing');
          if(!app.includes("audio.crossOrigin='anonymous'")) fail('Cross-origin audio flag missing');
          if(!app.includes('startSimulatedLipSync')) fail('Mobile simulated mouth fallback missing');
          if(!app.includes('avatar-mouth-simulated')) fail('Mobile mouth fallback state missing');
          if(!css.includes('@keyframes emmaMouthFallback')) fail('Mobile mouth fallback CSS missing');
          if(!app.includes("portrait:'/emma.jpg'")) fail('Emma is not wired to the static JPEG asset');
          if(!fs.existsSync('public/emma.jpg')) fail('public/emma.jpg missing');
          const jpg=fs.readFileSync('public/emma.jpg');
          if(jpg.length<10000 || jpg[0]!==0xff || jpg[1]!==0xd8) fail('Emma JPEG asset is invalid');
          if(!app.includes('window.SpeechRecognition || window.webkitSpeechRecognition')) fail('Browser STT fallback missing');
          if(!app.includes('isSttBackendFailure')) fail('STT backend fallback detector missing');
          if(!app.includes('status===502')) fail('HTTP 502 STT fallback missing');
          if(!app.includes('browserSttPreferred')) fail('Persistent browser STT emergency mode missing');
          if(app.includes('startShadowBrowserSTT')) fail('Shadow browser STT race returned');
          console.log('QA EMMA VISUAL PASS: real JPEG + fixed portrait + transparent overlays + preload gate + audio analyser + browser STT fallback');
          NODE

      - name: QA supercascade and quota guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const worker=fs.readFileSync('src/index.js','utf8');
          const app=fs.readFileSync('public/app.js','utf8');

          const fail=m=>{throw new Error(m)};
          if(!worker.includes('X-FNS-TTS-Cascade-Size')) fail('Cascade telemetry missing');
          if(!worker.includes('runPublicTtsCascade("en"')) fail('English cascade not wired');
          if(!worker.includes('runPublicTtsCascade("es"')) fail('Spanish cascade not wired');

          const fnStart=worker.indexOf('function publicTtsEngines');
          const esBranch=worker.indexOf('if (language === "es")',fnStart);
          const esReturn=worker.indexOf('return [',esBranch);
          const esEnd=worker.indexOf('];',esReturn)+2;
          const enReturn=worker.indexOf('return [',esEnd);
          const enEnd=worker.indexOf('];',enReturn)+2;
          const esBlock=worker.slice(esReturn,esEnd);
          const enBlock=worker.slice(enReturn,enEnd);
          const enIds=(enBlock.match(/\{id:"[^"]+"/g)||[]);
          const esIds=(esBlock.match(/\{id:"[^"]+"/g)||[]);
          if(enIds.length!==10) fail('English cascade must have exactly 10 engines: '+enIds.length);
          if(esIds.length!==10) fail('Spanish cascade must have exactly 10 engines: '+esIds.length);
          const id=s=>s.match(/"([^"]+)"/)?.[1]||'';
          const enNames=enIds.map(id), esNames=esIds.map(id);
          if(enNames[0]!=='aura-1'||enNames[1]!=='google-translate-tts-en') fail('English fast path must be Aura then Google: '+enNames.join(','));
          if(esNames[0]!=='aura-2-es'||esNames[1]!=='google-translate-tts-es') fail('Spanish fast path must be Aura then Google: '+esNames.join(','));
          if(enNames.slice(2,7).some(x=>x.startsWith('hf-'))) fail('English HF engine found before slot 8: '+enNames.join(','));
          if(esNames.slice(2,7).some(x=>x.startsWith('hf-'))) fail('Spanish HF engine found before slot 8: '+esNames.join(','));
          if(enNames.slice(7).some(x=>!x.startsWith('hf-'))) fail('English slots 8-10 must be HF-only: '+enNames.join(','));
          if(esNames.slice(7).some(x=>!x.startsWith('hf-'))) fail('Spanish slots 8-10 must be HF-only: '+esNames.join(','));

          if(!app.includes('enterQuotaRestMode')) fail('Frontend quota rest mode missing');
          if(!app.includes('mic.disabled=busy')) fail('Microphone busy lock missing');
          if(!app.includes("browserSttPreferred?'🎤 Falar (navegador)'")) fail('Emergency browser microphone label missing');
          if(app.includes("mic.disabled=true;mic.textContent='🎤 Limite diário atingido'")) fail('Legacy quota microphone shutdown still present');
          if(!app.includes('QUOTA_NOTICE_TEXT')) fail('Friendly quota notice missing');
          if(worker.includes('llm7FastFallback')) fail('Cloudflare Worker must not call LLM7; browser owns the keyless fallback');
          if(worker.includes('api.llm7.io/v1/chat/completions')) fail('Worker still contains a direct LLM7 dependency');
          if(!app.includes('llm7BrowserReply')) fail('Browser LLM7 fallback missing');
          if(worker.includes('hf-zacheus-qwen3-4b-last-resort')) fail('HF chat cold-start fallback still present');
          if(/className\s*=\s*['"]avatar-face/.test(app)) fail('Avatar class replacement can still erase human-avatar state');

          console.log('QA SUPER-CASCADE PASS: EN='+enIds.length+' ES='+esIds.length+' visual/quota guard active');
          NODE

      - name: QA production portrait and brain fallback
        run: |
          curl --fail --silent --show-error \
            -D emma.headers \
            -o emma.jpg \
            "https://fns-stt.karlapower007.workers.dev/emma.jpg"
          EMMA_SIZE=$(wc -c < emma.jpg)
          EMMA_TYPE=$(tr -d '\r' < emma.headers | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -1)
          echo "emma.jpg type=$EMMA_TYPE bytes=$EMMA_SIZE"
          test "$EMMA_SIZE" -gt 10000
          case "$EMMA_TYPE" in
            image/jpeg*|image/jpg*) ;;
            *) echo "Invalid Emma content type: $EMMA_TYPE"; exit 1 ;;
          esac

          # Pollinations remains first browser attempt, but its anonymous budget is external.
          POLL_CODE=$(curl --silent --show-error --max-time 8 \
            -D poll.headers \
            -o poll.txt \
            -w "%{http_code}" \
            -H "Origin: https://fns-stt.karlapower007.workers.dev" \
            -H "Accept: text/plain,*/*" \
            "https://text.pollinations.ai/Reply%20briefly%3A%20Emma%20ready" || true)
          POLL_CORS=$(tr -d '\r' < poll.headers 2>/dev/null | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}' | tail -1)
          echo "Pollinations http=$POLL_CODE cors=$POLL_CORS"
          if [ -f poll.txt ] && [ "$POLL_CODE" = "200" ] && ! grep -Eqi 'api key|raise the key budget|unauthorized|forbidden|quota exceeded|rate.?limit' poll.txt; then
            echo "QA POLLINATIONS BEST-EFFORT PASS"
          else
            echo "QA POLLINATIONS DEGRADED: browser LLM7 takes over immediately"
          fi

          # Simulate the browser CORS preflight required by JSON POST.
          LLM7_OPTIONS_CODE=$(curl --silent --show-error --max-time 8 \
            -D llm7-options.headers \
            -o /dev/null \
            -w "%{http_code}" \
            -X OPTIONS \
            -H "Origin: https://fns-stt.karlapower007.workers.dev" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "https://api.llm7.io/v1/chat/completions" || true)
          LLM7_OPTIONS_CORS=$(tr -d '\r' < llm7-options.headers 2>/dev/null | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}' | tail -1)
          LLM7_ALLOW_METHODS=$(tr -d '\r' < llm7-options.headers 2>/dev/null | awk -F': ' 'tolower($1)=="access-control-allow-methods"{print $2}' | tail -1)
          LLM7_ALLOW_HEADERS=$(tr -d '\r' < llm7-options.headers 2>/dev/null | awk -F': ' 'tolower($1)=="access-control-allow-headers"{print $2}' | tail -1)
          echo "LLM7 preflight http=$LLM7_OPTIONS_CODE cors=$LLM7_OPTIONS_CORS methods=$LLM7_ALLOW_METHODS headers=$LLM7_ALLOW_HEADERS"
          case "$LLM7_OPTIONS_CODE" in 200|204) ;; *) echo "LLM7 browser preflight failed"; exit 1 ;; esac
          case "$LLM7_OPTIONS_CORS" in "*"|"https://fns-stt.karlapower007.workers.dev") ;; *) echo "LLM7 preflight CORS denied: $LLM7_OPTIONS_CORS"; exit 1 ;; esac
          echo "$LLM7_ALLOW_METHODS" | grep -Eqi 'POST' || { echo "LLM7 preflight did not allow POST"; exit 1; }
          echo "$LLM7_ALLOW_HEADERS" | grep -Eqi 'content-type|\*' || { echo "LLM7 preflight did not allow content-type"; exit 1; }

          LLM7_CODE=$(curl --silent --show-error --max-time 8 \
            -D llm7.headers \
            -o llm7.json \
            -w "%{http_code}" \
            -X POST \
            -H "Origin: https://fns-stt.karlapower007.workers.dev" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"model":"codestral-latest","messages":[{"role":"user","content":"Reply exactly: Emma ready"}],"max_tokens":40,"temperature":0.2,"stream":false}' \
            "https://api.llm7.io/v1/chat/completions" || true)
          LLM7_CORS=$(tr -d '\r' < llm7.headers 2>/dev/null | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}' | tail -1)
          echo "LLM7 browser POST http=$LLM7_CODE cors=$LLM7_CORS"
          head -c 500 llm7.json 2>/dev/null || true
          test "$LLM7_CODE" = "200"
          case "$LLM7_CORS" in "*"|"https://fns-stt.karlapower007.workers.dev") ;; *) echo "LLM7 response CORS denied: $LLM7_CORS"; exit 1 ;; esac
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('llm7.json','utf8'));
          const reply=String(r?.choices?.[0]?.message?.content||r?.choices?.[0]?.text||'').trim();
          if(!reply) throw new Error('Browser LLM7 keyless probe returned no reply: '+JSON.stringify(r));
          if(/api key|unauthorized|forbidden|quota exceeded|rate.?limit|missing_api_key/i.test(reply)){
            throw new Error('Browser LLM7 keyless probe returned auth/quota text: '+reply);
          }
          console.log('QA LLM7 BROWSER CORS PASS');
          NODE

          CHAT_CODE=$(curl --silent --show-error --max-time 4 \
            -D chat.headers \
            -o chat.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"message":"Hello Emma.","teacher":"Emma","level":"A1","accent":"American","force_public":true}' \
            "https://fns-stt.karlapower007.workers.dev/chat")
          cat chat.json
          export CHAT_CODE
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('chat.json','utf8'));
          const code=process.env.CHAT_CODE;
          if(code!=='503') throw new Error('Forced public handoff must be immediate HTTP 503, got '+code+' '+JSON.stringify(r));
          if(r.code!=='FNS_BROWSER_PUBLIC_BRAIN'||r.browser_fallback!==true||r.forced_public!==true){
            throw new Error('Browser public-brain handoff missing: '+JSON.stringify(r));
          }
          console.log('QA BRAIN HANDOFF PASS: Worker exits immediately; browser owns Pollinations -> LLM7');
          NODE

