name: Configure Workers Builds by API

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths: ['.github/workflows/configure-workers-builds-api.yml']

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - name: Configure repository connection and production trigger
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")

          echo "1) Resolve existing Worker tag"
          curl -fsS "$api/workers/scripts" "${auth[@]}" > /tmp/scripts.json
          TAG=$(jq -r '.result[] | select(.id=="consciencia-fabiano") | .tag // empty' /tmp/scripts.json | head -1)
          test -n "$TAG"
          echo "WORKER_TAG_FOUND=yes"

          echo "2) Create/update GitHub repo connection"
          jq -n '{
            provider_type:"github",
            provider_account_id:"327710431",
            provider_account_name:"karlapower007-ux",
            repo_id:"1365062581",
            repo_name:"Curso-de-ingl-s-teste"
          }' > /tmp/connection-body.json
          curl -sS -X PUT "$api/builds/repos/connections" "${auth[@]}"             --data @/tmp/connection-body.json > /tmp/connection.json
          jq '{success,errors,result:{repo_connection_uuid:.result.repo_connection_uuid,provider_type:.result.provider_type,provider_account_name:.result.provider_account_name,repo_name:.result.repo_name}}' /tmp/connection.json
          jq -e '.success==true' /tmp/connection.json >/dev/null
          CONN=$(jq -r '.result.repo_connection_uuid' /tmp/connection.json)

          echo "3) Check existing build token"
          curl -fsS "$api/builds/tokens" "${auth[@]}" > /tmp/tokens.json
          BT=$(jq -r '.result[0].build_token_uuid // empty' /tmp/tokens.json)
          if [ -n "$BT" ]; then
            echo "BUILD_TOKEN_FOUND=yes"
          else
            echo "BUILD_TOKEN_FOUND=no"
          fi

          echo "4) Check production trigger"
          curl -fsS "$api/builds/workers/$TAG/triggers" "${auth[@]}" > /tmp/triggers.json
          TRIGGER=$(jq -r '.result[]? | select((.branch_includes // []) | index("consciencia-cloudflare-native-v1")) | .trigger_uuid // empty' /tmp/triggers.json | head -1)

          if [ -z "$TRIGGER" ]; then
            jq -n               --arg tag "$TAG"               --arg conn "$CONN"               --arg bt "$BT"               '{
                external_script_id:$tag,
                repo_connection_uuid:$conn,
                trigger_name:"Consciência Fabiano Native V1",
                build_command:"npm run build",
                deploy_command:"npm run cf:deploy",
                root_directory:"consciencia-fabiano",
                branch_includes:["consciencia-cloudflare-native-v1"],
                branch_excludes:[],
                path_includes:["*"],
                path_excludes:[],
                build_caching_enabled:true
              } + (if ($bt|length)>0 then {build_token_uuid:$bt} else {} end)'               > /tmp/trigger-body.json
            curl -sS -X POST "$api/builds/triggers" "${auth[@]}"               --data @/tmp/trigger-body.json > /tmp/trigger-create.json
            jq '{success,errors,result:{trigger_uuid:.result.trigger_uuid,trigger_name:.result.trigger_name,build_token_uuid:.result.build_token_uuid}}' /tmp/trigger-create.json
            jq -e '.success==true' /tmp/trigger-create.json >/dev/null
            TRIGGER=$(jq -r '.result.trigger_uuid' /tmp/trigger-create.json)
          else
            echo "PRODUCTION_TRIGGER_FOUND=yes"
          fi

          echo "5) Trigger build"
          curl -sS -X POST "$api/builds/triggers/$TRIGGER/builds" "${auth[@]}"             --data '{"branch":"consciencia-cloudflare-native-v1"}' > /tmp/build.json
          jq '{success,errors,result:{build_uuid:.result.build_uuid,created_on:.result.created_on}}' /tmp/build.json
          jq -e '.success==true' /tmp/build.json >/dev/null
          echo "WORKERS_BUILD_STARTED=yes"

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/configure-workers-builds-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Workers Builds API configuration"
          git push origin HEAD:consciencia-cloudflare-native-v1
