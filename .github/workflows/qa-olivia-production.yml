name: QA Olivia V15 Quota-Safe Gate

on:
  push:
    branches: [fns-digital-human]
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  qa-olivia-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Core blindagem + V15 source
        run: |
          set -euo pipefail
          node --check src/strict-output-v15.js
          node --check src/strict-output-v7.js
          node --check src/strict-output.js
          node --check src/index.js
          node --check public/app.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q '"main": "src/strict-output-v15.js"' wrangler.jsonc
          grep -q "language:'es-ES'" src/strict-output-v7.js
          grep -q "languageLabel:'Español'" src/strict-output-v7.js
          grep -q "subtitle:'Profesora de español'" src/strict-output-v7.js
          grep -q 'olivia-fechada-v15.jpg' src/strict-output-v15.js
          grep -q 'olivia-falando-v15.jpg' src/strict-output-v15.js
          grep -q 'olivia-aberta-v15.jpg' src/strict-output-v15.js
          file public/assets/olivia-fechada-v15.jpg | grep -q JPEG
          file public/assets/olivia-falando-v15.jpg | grep -q JPEG
          file public/assets/olivia-aberta-v15.jpg | grep -q JPEG
          echo 'V15 SOURCE + SPANISH + IMAGE ASSETS PASS'
      - name: Local mock QA — zero Workers AI calls
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v15.js';
          const env = new Proxy({}, {get(){ throw new Error('QA tried to touch production env/AI'); }});
          for (const path of ['/tts','/chat','/stt']) {
            const req = new Request('https://qa.local'+path, {
              method:'POST',
              headers:{'Content-Type':'application/json','X-FNS-QA-Mock':'1'},
              body:JSON.stringify({teacher:'Olivia',text:'Hola'})
            });
            const res = await worker.fetch(req, env, {});
            if (!res.ok) throw new Error(path+' mock failed '+res.status);
            if (res.headers.get('X-FNS-QA-Mock') !== '1') throw new Error(path+' escaped mock boundary');
          }
          console.log('LOCAL MOCK PASS — Workers AI was never invoked');
          NODE
      - name: Turbine registry
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const back=fs.readFileSync('src/strict-output-v7.js','utf8');
          for(const letter of 'ABCDEFGHIJKLMNO') if(!back.includes(letter+':{speaker:')) throw new Error('missing '+letter);
          if(!back.includes("@cf/deepgram/aura-2-es")) throw new Error('Aura-2 Spanish missing');
          console.log('A-O PASS');
          NODE
      - name: Bundle gate only
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v15-gate
      - name: Final gate
        run: echo 'OLIVIA V15 QUOTA-SAFE SOURCE GATE PASS'
