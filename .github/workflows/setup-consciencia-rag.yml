name: Setup Consciência persistent RAG
on:
  push:
    branches: [consciencia-do-fabiano]
    paths: ['.github/workflows/setup-consciencia-rag.yml']
jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Probe persistent storage permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== VECTORIZE ==="
          npx wrangler vectorize get consciencia-fabiano-rag
          echo "vectorize_get_exit=$?"
          echo "=== R2 LIST ==="
          npx wrangler r2 bucket list --json
          echo "r2_list_exit=$?"
          echo "=== R2 CREATE ==="
          npx wrangler r2 bucket create consciencia-fabiano-pdfs
          echo "r2_create_exit=$?"
          echo "=== D1 LIST ==="
          npx wrangler d1 list --json
          echo "d1_list_exit=$?"
          echo "=== D1 CREATE ==="
          npx wrangler d1 create consciencia-fabiano-rag-db
          echo "d1_create_exit=$?"
