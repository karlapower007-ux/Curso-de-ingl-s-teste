name: QA Cloudflare Native RAG

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths:
      - 'consciencia-fabiano/**'
      - '.github/workflows/qa-cloudflare-native-rag.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax and architecture checks
        run: |
          npm run check
          grep -q '@cf/baai/bge-m3' src/index.js
          grep -q 'env.AI.toMarkdown' src/index.js
          grep -q 'class LibraryDO' src/index.js
          grep -q 'env.LIBRARY' src/index.js
          grep -q '@cf/openai/whisper-large-v3-turbo' src/index.js
          grep -q '@cf/myshell-ai/melotts' src/index.js
          grep -q 'durable_objects' wrangler.jsonc
          grep -q 'new_sqlite_classes' wrangler.jsonc
          ! grep -q 'onrender.com' src/index.js
          ! grep -q 'env.PDFS' src/index.js
          ! grep -q 'env.VECTORIZE' src/index.js
          ! grep -q 'env.DB' src/index.js
          bash -n scripts/autonomous-release.sh
          grep -q '"cf:deploy"' package.json
          grep -q 'durable-object-sqlite' src/index.js
          grep -q 'conversation_messages' src/index.js
          grep -q '/api/memory' src/index.js
          grep -q 'X-FNS-Memory-Key' public/app.js
          grep -q 'syncPersistentHistory' public/app.js
