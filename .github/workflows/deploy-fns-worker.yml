name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Static JS syntax checks
        run: |
          node --check src/index.js
          node --check public/app.js
          node --check public/emma-static.js

      - name: QA turn state machine
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('public/app.js','utf8');
          const fail=m=>{throw new Error(m)};

          for(const token of [
            "FLOW_STATES=Object.freeze",
            "IDLE:'idle'",
            "LISTENING:'listening'",
            "PROCESSING:'processing'",
            "SPEAKING:'speaking'",
            "let isSpeaking=false",
            "let isRecording=false",
            "let isProcessing=false",
            "mic.disabled=busy",
            "audio.onended=()=>finish(true)",
            "setFlowState(FLOW_STATES.SPEAKING",
            "setFlowState(FLOW_STATES.IDLE"
          ]) if(!app.includes(token)) fail('Missing state-machine invariant: '+token);

          if(app.includes('startShadowBrowserSTT')) fail('Shadow SpeechRecognition must not coexist with MediaRecorder');
          if(app.includes('useBrowserSttFallback(')) fail('STT fallback must not auto-open Web Speech');
          if(app.includes('startShadowBrowserSTT();')) fail('MediaRecorder still starts browser STT');
          if(!app.includes("if(isSpeaking||isProcessing)return;")) fail('Mic has no speaking/processing guard');
          if(!app.includes('pollinationsBrowserReply')) fail('Direct browser Pollinations fallback missing');
          if(!app.includes('llm7BrowserReply')) fail('Direct browser LLM7 emergency fallback missing');
          if(!app.includes("'https://api.llm7.io/v1/chat/completions'")) fail('Browser LLM7 endpoint missing');
          if(!app.includes("model:'codestral-latest'")) fail('Browser LLM7 turbo model missing');
          if(!app.includes('browserSttPreferred||neuralQuotaExhausted')) fail('Known emergency mode still wastes a Cloudflare chat round-trip');
          if(!app.includes("'https://text.pollinations.ai/'")) fail('Pollinations browser endpoint missing');
          if(!app.includes("enterQuotaRestMode({preserveFlow:true})")) fail('Emergency brain can still unlock microphone early');

          const remote=app.slice(app.indexOf('async function remoteSpeak'),app.indexOf('async function unlockVoice'));
          if(remote.includes('stopRemoteVoice();')) fail('remoteSpeak must not destroy an active audio element before playback');
          if(!remote.includes('audio.onended=()=>finish(true)')) fail('Audio completion is not gated on onended');
          if(!remote.includes('return await new Promise')) fail('Speech lifecycle is not awaited');

          const browser=app.slice(app.indexOf('function startBrowserOnlySTT'),app.indexOf('function nextUtcMidnightMs'));
          const starts=(browser.match(/\.start\(\)/g)||[]).length;
          if(starts!==1) fail('Browser STT must have exactly one explicit start call, found '+starts);

          console.log('QA TURN STATE PASS: one ear at a time; mic locked during processing/speaking; audio releases only on ended');
          NODE

      - name: QA Phase 2 memory and listening window
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const app=fs.readFileSync('public/app.js','utf8');
          const worker=fs.readFileSync('src/index.js','utf8');
          const stable=cp.execFileSync('git',['show','93187821bcd8a01e1875219cbeb3ba818f73c5b4:fns-digital-human/worker/public/app.js'],{encoding:'utf8'});
          const fail=m=>{throw new Error(m)};

          // Memory A/B/C/D
          for(const token of [
            'loadRemoteSessionMemory',
            'saveRemoteSessionMemory',
            'caches.default',
            'session_id',
            'mergeMemoryHistory'
          ]) if(!worker.includes(token)) fail('Plan A remote memory missing: '+token);

          for(const token of [
            'localStorage',
            'sessionStorage',
            'readBrowserMemory',
            'rememberExchange',
            'memorySessionId',
            'history:memoryBefore'
          ]) if(!app.includes(token)) fail('Plan B browser memory missing: '+token);

          if(!app.includes('pollinationsBrowserReply(text,history=readBrowserMemory())')) fail('Plan C Pollinations history missing');
          if(!app.includes('llm7BrowserReply(text,history=readBrowserMemory()')) fail('Plan C LLM7 history missing');
          if(!app.includes('teacherReply(text,history=readBrowserMemory())')) fail('Plan D local memory missing');
          if(!app.includes('previousUserMemory(history)')) fail('Plan D previous interaction lookup missing');

          // Listening-only permitted changes.
          if(!app.includes('r.continuous=true;')) fail('Browser STT longer listening mode missing');
          if(!app.includes('recordingTimer=setTimeout(()=>stopRecordingAndSend(),45000);')) fail('MediaRecorder 45s window missing');

          // Absolute state-machine and microphone safety lock against stable 93187821.
          const section=(src,a,b)=>{
            const s=src.indexOf(a),e=src.indexOf(b,s);
            if(s<0||e<0)fail('Cannot extract protected section '+a);
            return src.slice(s,e);
          };
          const extractFunction=(src,name)=>{
            const markers=['function '+name+'(', 'async function '+name+'('];
            let s=-1;
            for(const marker of markers){s=src.indexOf(marker);if(s>=0)break;}
            if(s<0)fail('Cannot find protected function '+name);
            const open=src.indexOf('{',s);
            let depth=0,quote='',escape=false;
            for(let i=open;i<src.length;i++){
              const ch=src[i];
              if(quote){
                if(escape){escape=false;continue;}
                if(ch==='\\'){escape=true;continue;}
                if(ch===quote)quote='';
                continue;
              }
              if(ch==="'"||ch==='"'||ch==='`'){quote=ch;continue;}
              if(ch==='{')depth++;
              else if(ch==='}'&&--depth===0)return src.slice(s,i+1);
            }
            fail('Cannot close protected function '+name);
          };

          if(section(app,'const FLOW_STATES=Object.freeze','function browserSpeechCtor')!==section(stable,'const FLOW_STATES=Object.freeze','function browserSpeechCtor')){
            fail('Protected state machine changed');
          }
          for(const name of ['toggleRecognition','stopRecognition','stopRecordingAndSend','remoteSpeak']){
            if(extractFunction(app,name)!==extractFunction(stable,name)) fail('Protected microphone/turn function changed: '+name);
          }

          // startBrowserOnlySTT/startRecording may differ only in the two approved timing parameters.
          const normalizeListening=s=>s
            .replace('r.continuous=true;','r.continuous=false;')
            .replace('recordingTimer=setTimeout(()=>stopRecordingAndSend(),45000);','recordingTimer=setTimeout(()=>stopRecordingAndSend(),20000);');

          if(normalizeListening(extractFunction(app,'startBrowserOnlySTT'))!==extractFunction(stable,'startBrowserOnlySTT')){
            fail('Browser LISTENING function changed beyond approved timing');
          }

          const recording=extractFunction(app,'startRecording');
          for(const token of [
            "if(flowState!==FLOW_STATES.IDLE || isSpeaking || isProcessing)return;",
            "listeningEngine='media';",
            "setFlowState(FLOW_STATES.LISTENING,{status:'Abrindo microfone'});",
            "recordingTimer=setTimeout(()=>stopRecordingAndSend(),45000);",
            "recorder.start(250);"
          ]) if(!recording.includes(token)) fail('Protected MediaRecorder invariant missing: '+token);
          if((recording.match(/new MediaRecorder/g)||[]).length!==2) fail('Unexpected MediaRecorder construction shape');
          if(recording.includes('startShadowBrowserSTT')) fail('Shadow browser STT race returned');

          console.log('QA PHASE 2 PASS: memory A/B/C/D active; turn machine stable; desktop capture hardened only inside LISTENING');
          NODE

      - name: QA chat dedupe and AvatarManager v3
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('public/app.js','utf8');
          const worker=fs.readFileSync('src/index.js','utf8');
          const avatar=fs.readFileSync('public/emma-static.js','utf8');
          const css=fs.readFileSync('public/emma-static.css','utf8');
          const fail=m=>{throw new Error(m)};

          if(!app.includes("dataset.fnsMessageKey")) fail('Chat visual dedupe guard missing');
          if(!app.includes('const FNS_MEMORY_MAX_MESSAGES=20')) fail('Browser memory was not expanded to 20 messages');
          if(!worker.includes('const FNS_MEMORY_MAX_MESSAGES=20')) fail('Worker memory was not expanded to 20 messages');
          if(!worker.includes('Math.abs(item.ts-prior.ts)<15000')) fail('Remote/client near-duplicate memory collapse missing');

          for(const token of ['class AvatarManager','class AvatarWatchdog','avatar-webgl-layer','readState()','readMouth()','webglcontextlost','scheduleRecovery','static selfTest()']){
            if(!avatar.includes(token)) fail('AvatarManager requirement missing: '+token);
          }
          for(const forbidden of ['MediaRecorder','SpeechRecognition','webkitSpeechRecognition','.play(','.pause(','stopRecognition','setFlowState(']){
            if(avatar.includes(forbidden)) fail('Avatar visual layer illegally controls core flow: '+forbidden);
          }
          if(!avatar.includes("for(let turn=0;turn<20;turn++)")) fail('20-turn visual self-test missing');
          if(!css.includes('Emma AvatarManager v3')) fail('Avatar WebGL CSS missing');
          if(!css.includes('.avatar-webgl-layer.avatar-webgl-failed{display:none!important}')) fail('2D fallback visibility rule missing');
          console.log('QA AVATAR V3 PASS: watchdog/fallback isolated from audio and turn core; 20-turn visual self-test present');
          NODE

      - name: QA desktop microphone and mouth alignment
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('public/app.js','utf8');
          const css=fs.readFileSync('public/emma-static.css','utf8');
          const fail=m=>{throw new Error(m)};

          for(const token of [
            'echoCancellation:true',
            'noiseSuppression:true',
            'autoGainControl:true',
            'channelCount:1',
            "'audio/webm;codecs=opus','audio/webm','audio/mp4'",
            'startBrowserFallbackOnce',
            "blob.size<1200",
            "Whisper sem fala"
          ]) if(!app.includes(token)) fail('Desktop mic hardening missing: '+token);

          const helper=app.slice(app.indexOf('function startBrowserFallbackOnce'),app.indexOf('async function startRecording'));
          if(!helper.includes("flowState!==FLOW_STATES.IDLE") || !helper.includes("startBrowserOnlySTT()")) fail('One-shot browser fallback guard missing');
          if(helper.includes('setInterval')) fail('Fallback must never loop');

          if(!css.includes('top:60.0%;')) fail('Desktop mouth was not lowered');
          if(!css.includes('top:59.6%!important;')) fail('Mobile mouth alignment missing');
          if(!app.includes("Math.min(1,(rms-.008)/.075)")) fail('Maximum analyser mouth opening missing');
          if(!css.includes("var(--mouth-open,0) * 4.95")) fail('Full CSS mouth opening missing');
          if(!css.includes("scaleY(4.95)")) fail('Full simulated mouth fallback missing');
          if(!css.includes('.avatar-mouth-motion::before')) fail('Visible teeth layer missing');
          if(!css.includes('#fffefa')) fail('Teeth fill missing');
          if(!css.includes('Emma sharp portrait mode v2')) fail('Sharp portrait mode v2 missing');
          if(!css.includes("content:url('/emma.jpg?v=valid4')!important")) fail('Restored portrait cache-bust missing');
          console.log('QA DESKTOP MIC/MOUTH PASS: mouth lowered; PC capture constraints + MIME fallback + one-shot browser STT active');
          NODE

      - name: Guard visual-only patch
        run: |
          APP_HASH=$(git hash-object public/app.js)
          WORKER_HASH=$(git hash-object src/index.js)
          echo "app.js blob=$APP_HASH"
          echo "src/index.js blob=$WORKER_HASH"
          test "$APP_HASH" = "eeb5cd55cedc63091cd7a4155482d2073eb0ee76"
          test "$WORKER_HASH" = "e9fc92b68dde633a9b82273fba77943064f7e767"
          echo "QA VISUAL-ONLY PASS: audio, microphone, STT, TTS, memory, fallbacks and turn logic unchanged"

      - name: QA Emma JPEG integrity
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('public/emma.jpg');
          const fail=m=>{throw new Error(m)};
          if(b.length<10000)fail('Emma JPEG unexpectedly small: '+b.length);
          if(b[0]!==0xff||b[1]!==0xd8)fail('Emma JPEG missing SOI');
          if(b[b.length-2]!==0xff||b[b.length-1]!==0xd9)fail('Emma JPEG missing EOI');
          let i=2,w=0,h=0;
          const sof=new Set([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf]);
          while(i+9<b.length){
            if(b[i]!==0xff){i++;continue}
            while(i<b.length&&b[i]===0xff)i++;
            const marker=b[i++];
            if(marker===0xd8||marker===0xd9)continue;
            if(i+1>=b.length)break;
            const len=(b[i]<<8)|b[i+1];
            if(len<2||i+len>b.length)break;
            if(sof.has(marker)){h=(b[i+3]<<8)|b[i+4];w=(b[i+5]<<8)|b[i+6];break}
            i+=len;
          }
          if(w<500||h<600)fail('Emma JPEG dimensions invalid: '+w+'x'+h);
          console.log('QA EMMA JPEG PASS: valid JPEG '+w+'x'+h+' bytes='+b.length);
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA resilient multilingual TTS
        run: |
          sleep 5
          test_tts () {
            NAME="$1"
            TEXT="$2"

            HTTP_CODE=$(curl --silent --show-error \
              -D "$NAME.headers" \
              -o "$NAME.body" \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data "$(node -e 'console.log(JSON.stringify({text:process.argv[1],teacher:"Emma"}))' "$TEXT")" \
              "https://fns-stt.karlapower007.workers.dev/tts")

            ENGINE=$(tr -d '\r' < "$NAME.headers" | awk -F': ' 'tolower($1)=="x-fns-voice-engine"{print $2}' | tail -1)
            TYPE=$(tr -d '\r' < "$NAME.headers" | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -1)
            SIZE=$(wc -c < "$NAME.body")

            echo "$NAME http=$HTTP_CODE engine=$ENGINE type=$TYPE bytes=$SIZE"

            if [ "$HTTP_CODE" = "200" ]; then
              if [ "$SIZE" -lt 1000 ]; then
                echo "$NAME returned too little audio: $SIZE bytes"
                exit 1
              fi
              case "$TYPE" in
                audio/*|application/octet-stream*) ;;
                *) echo "$NAME invalid audio content-type: $TYPE"; exit 1 ;;
              esac
              return
            fi

            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('$NAME.body','utf8')); if(!(r.quota_exhausted===true || r.code==='FNS_DAILY_NEURON_QUOTA')) throw new Error('Unexpected TTS failure: '+JSON.stringify(r)); console.log('Graceful quota response accepted for $NAME');"
          }

          test_tts pt "Olá Emma, boa noite. Você consegue me entender perfeitamente em português?"
          test_tts en "Now let's continue in English. Correct my mistakes."
          test_tts es "Ahora quiero hablar contigo en español."
          test_tts mixed "Emma, explique em português a diferença entre I have been e I was."

      - name: QA Emma visual layering
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('public/app.js','utf8');
          const css=fs.readFileSync('public/emma-static.css','utf8');
          const rig=fs.readFileSync('public/emma-static.js','utf8');

          const fail=(m)=>{throw new Error(m)};
          const markup=app.slice(app.indexOf('function avatarVisualMarkup'),app.indexOf('let activeTeacher'));
          if(!markup.includes('avatar-photo-base')) fail('Base portrait layer missing');
          if(markup.includes('avatar-photo-jaw')) fail('Duplicate jaw image layer still present');
          if(markup.includes('avatar-eye-layer')) fail('Duplicate eye image layer still present');
          if(!markup.includes('data-avatar-ready')) fail('Portrait preload state missing');
          if(!markup.includes('avatar-mouth-motion')) fail('Single smooth mouth overlay missing');
          if(markup.includes('avatar-mouth-cavity') || markup.includes('avatar-lip ')) fail('Legacy multi-layer mouth still present');
          if(/canvas|getContext\s*\(/i.test(markup+css)) fail('Canvas/pixel mouth manipulation must not be used');
          if(!css.includes('.avatar-fx-layer')) fail('Transparent FX layer missing');
          if(!css.includes('background:transparent')) fail('FX layer is not transparent');
          if(!rig.includes('portrait.complete&&portrait.naturalWidth>0')) fail('Rig does not wait for portrait load');
          if(!app.includes('createMediaElementSource(audio)')) fail('Audio analyser lip-sync missing');
          if(!app.includes('getByteTimeDomainData(samples)')) fail('Smooth RMS lip-sync missing');
          if(!app.includes("audio.crossOrigin='anonymous'")) fail('Cross-origin audio flag missing');
          if(!app.includes('startSimulatedLipSync')) fail('Mobile simulated mouth fallback missing');
          if(!app.includes('avatar-mouth-simulated')) fail('Mobile mouth fallback state missing');
          if(!css.includes('@keyframes emmaMouthFallback')) fail('Mobile mouth fallback CSS missing');
          if(!app.includes("portrait:'/emma.jpg'")) fail('Emma is not wired to the static JPEG asset');
          if(!fs.existsSync('public/emma.jpg')) fail('public/emma.jpg missing');
          const jpg=fs.readFileSync('public/emma.jpg');
          if(jpg.length<10000 || jpg[0]!==0xff || jpg[1]!==0xd8) fail('Emma JPEG asset is invalid');
          if(!app.includes('window.SpeechRecognition || window.webkitSpeechRecognition')) fail('Browser STT fallback missing');
          if(!app.includes('isSttBackendFailure')) fail('STT backend fallback detector missing');
          if(!app.includes('status===502')) fail('HTTP 502 STT fallback missing');
          if(!app.includes('browserSttPreferred')) fail('Persistent browser STT emergency mode missing');
          if(app.includes('startShadowBrowserSTT')) fail('Shadow browser STT race returned');
          console.log('QA EMMA VISUAL PASS: real JPEG + fixed portrait + transparent overlays + preload gate + audio analyser + browser STT fallback');
          NODE

      - name: QA supercascade and quota guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const worker=fs.readFileSync('src/index.js','utf8');
          const app=fs.readFileSync('public/app.js','utf8');

          const fail=m=>{throw new Error(m)};
          if(!worker.includes('X-FNS-TTS-Cascade-Size')) fail('Cascade telemetry missing');
          if(!worker.includes('runPublicTtsCascade("en"')) fail('English cascade not wired');
          if(!worker.includes('runPublicTtsCascade("es"')) fail('Spanish cascade not wired');

          const fnStart=worker.indexOf('function publicTtsEngines');
          const esBranch=worker.indexOf('if (language === "es")',fnStart);
          const esReturn=worker.indexOf('return [',esBranch);
          const esEnd=worker.indexOf('];',esReturn)+2;
          const enReturn=worker.indexOf('return [',esEnd);
          const enEnd=worker.indexOf('];',enReturn)+2;
          const esBlock=worker.slice(esReturn,esEnd);
          const enBlock=worker.slice(enReturn,enEnd);
          const enIds=(enBlock.match(/\{id:"[^"]+"/g)||[]);
          const esIds=(esBlock.match(/\{id:"[^"]+"/g)||[]);
          if(enIds.length!==10) fail('English cascade must have exactly 10 engines: '+enIds.length);
          if(esIds.length!==10) fail('Spanish cascade must have exactly 10 engines: '+esIds.length);
          const id=s=>s.match(/"([^"]+)"/)?.[1]||'';
          const enNames=enIds.map(id), esNames=esIds.map(id);
          if(enNames[0]!=='aura-1'||enNames[1]!=='google-translate-tts-en') fail('English fast path must be Aura then Google: '+enNames.join(','));
          if(esNames[0]!=='aura-2-es'||esNames[1]!=='google-translate-tts-es') fail('Spanish fast path must be Aura then Google: '+esNames.join(','));
          if(enNames.slice(2,7).some(x=>x.startsWith('hf-'))) fail('English HF engine found before slot 8: '+enNames.join(','));
          if(esNames.slice(2,7).some(x=>x.startsWith('hf-'))) fail('Spanish HF engine found before slot 8: '+esNames.join(','));
          if(enNames.slice(7).some(x=>!x.startsWith('hf-'))) fail('English slots 8-10 must be HF-only: '+enNames.join(','));
          if(esNames.slice(7).some(x=>!x.startsWith('hf-'))) fail('Spanish slots 8-10 must be HF-only: '+esNames.join(','));

          if(!app.includes('enterQuotaRestMode')) fail('Frontend quota rest mode missing');
          if(!app.includes('mic.disabled=busy')) fail('Microphone busy lock missing');
          if(!app.includes("browserSttPreferred?'🎤 Falar (navegador)'")) fail('Emergency browser microphone label missing');
          if(app.includes("mic.disabled=true;mic.textContent='🎤 Limite diário atingido'")) fail('Legacy quota microphone shutdown still present');
          if(!app.includes('QUOTA_NOTICE_TEXT')) fail('Friendly quota notice missing');
          if(worker.includes('llm7FastFallback')) fail('Cloudflare Worker must not call LLM7; browser owns the keyless fallback');
          if(worker.includes('api.llm7.io/v1/chat/completions')) fail('Worker still contains a direct LLM7 dependency');
          if(!app.includes('llm7BrowserReply')) fail('Browser LLM7 fallback missing');
          if(worker.includes('hf-zacheus-qwen3-4b-last-resort')) fail('HF chat cold-start fallback still present');
          if(/className\s*=\s*['"]avatar-face/.test(app)) fail('Avatar class replacement can still erase human-avatar state');

          console.log('QA SUPER-CASCADE PASS: EN='+enIds.length+' ES='+esIds.length+' visual/quota guard active');
          NODE

      - name: QA Phase 2 production memory
        run: |
          curl --fail --silent --show-error -o phase2-app.js "https://fns-stt.karlapower007.workers.dev/app.js"
          curl --fail --silent --show-error -o phase2-health.json "https://fns-stt.karlapower007.workers.dev/health"
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('phase2-app.js','utf8');
          const health=JSON.parse(fs.readFileSync('phase2-health.json','utf8'));
          for(const token of ['readBrowserMemory','rememberExchange','history:memoryBefore','r.continuous=true','45000']){
            if(!app.includes(token)) throw new Error('Production Phase 2 frontend missing: '+token);
          }
          if(health.version!=='2026-09-16.22-avatar-layer-memory-plus') throw new Error('Wrong production health version: '+health.version);
          console.log('QA PHASE 2 PRODUCTION PASS: browser memory + extended LISTENING + memory-aware Worker deployed');
          NODE

      - name: QA AvatarManager v3 production
        run: |
          curl --fail --silent --show-error -o avatar-prod.js "https://fns-stt.karlapower007.workers.dev/emma-static.js"
          curl --fail --silent --show-error -o app-prod.js "https://fns-stt.karlapower007.workers.dev/app.js"
          node - <<'NODE'
          const fs=require('fs');
          const avatar=fs.readFileSync('avatar-prod.js','utf8');
          const app=fs.readFileSync('app-prod.js','utf8');
          for(const token of ['class AvatarManager','class AvatarWatchdog','webglcontextlost','scheduleRecovery','for(let turn=0;turn<20;turn++)']){
            if(!avatar.includes(token)) throw new Error('Production AvatarManager missing: '+token);
          }
          if(!app.includes('dataset.fnsMessageKey')) throw new Error('Production chat dedupe guard missing');
          if(!app.includes('const FNS_MEMORY_MAX_MESSAGES=20')) throw new Error('Production memory+ frontend missing');
          console.log('QA AVATAR V3 PRODUCTION PASS: visual layer + chat dedupe + memory+ deployed');
          NODE

      - name: QA desktop microphone and mouth production
        run: |
          curl --fail --silent --show-error -o desktop-app.js "https://fns-stt.karlapower007.workers.dev/app.js"
          curl --fail --silent --show-error -o desktop-emma.css "https://fns-stt.karlapower007.workers.dev/emma-static.css"
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('desktop-app.js','utf8');
          const css=fs.readFileSync('desktop-emma.css','utf8');
          for(const token of ['echoCancellation:true','noiseSuppression:true','autoGainControl:true','channelCount:1','startBrowserFallbackOnce']){
            if(!app.includes(token)) throw new Error('Production desktop mic fix missing: '+token);
          }
          if(!css.includes('top:60.0%;')) throw new Error('Production mouth alignment missing');
          if(!app.includes("Math.min(1,(rms-.008)/.075)")) throw new Error('Production analyser mouth opening gain missing');
