name: Native Consciência Fabiano Admin Auth

on:
  push:
    branches: [consciencia-fabiano-fabiano-cloudflare]
    paths:
      - 'consciencia-fabiano/src/index.js'
      - 'consciencia-fabiano/public/app.js'
      - 'consciencia-fabiano/wrangler.jsonc'
      - 'consciencia-fabiano/scripts/configure-access.mjs'
      - '.github/workflows/lock-consciencia-fabiano-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-admin-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FABIANO_CLOUDFLARE_API_TOKEN: ${{ secrets.FABIANO_CLOUDFLARE_API_TOKEN }}
      FABIANO_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FABIANO_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.FABIANO_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FABIANO_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-fabiano-fabiano-cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: consciencia-fabiano
        run: npm install
      - name: Deploy native admin authentication
        working-directory: consciencia-fabiano
        run: npx wrangler deploy
      - name: Remove legacy Access and verify native lock
        working-directory: consciencia-fabiano
        run: node scripts/configure-access.mjs
