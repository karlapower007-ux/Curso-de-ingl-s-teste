name: Deploy FNS Worker

on:
  push:
    branches: [fns-digital-human]
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install

      - name: Materialize Olivia V16 avatar frames
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const names = ['fechada', 'falando', 'aberta'];
          const hashes = [];
          for (const name of names) {
            const src = `public/assets/olivia-${name}-v16.b64`;
            const dst = `public/assets/olivia-${name}-v16.jpg`;
            let raw = fs.readFileSync(src, 'utf8')
              .replace(/^data:image\/jpeg;base64,/i, '')
              .replace(/\s+/g, '');
            if (!raw || raw.length < 1000) throw new Error(`Base64 source too small: ${src}`);
            const buf = Buffer.from(raw, 'base64');
            if (buf.length < 4000) throw new Error(`Decoded JPEG too small: ${dst} (${buf.length})`);
            if (buf[0] !== 0xff || buf[1] !== 0xd8 || buf.at(-2) !== 0xff || buf.at(-1) !== 0xd9) {
              throw new Error(`Invalid JPEG markers: ${dst}`);
            }
            fs.writeFileSync(dst, buf);
            const hash = crypto.createHash('sha256').update(buf).digest('hex');
            hashes.push(hash);
            console.log(`${name}: ${buf.length} bytes sha256=${hash}`);
          }
          if (new Set(hashes).size !== 3) throw new Error('Olivia V16 frames are not three distinct images');
          NODE
          file public/assets/olivia-fechada-v16.jpg | grep -q JPEG
          file public/assets/olivia-falando-v16.jpg | grep -q JPEG
          file public/assets/olivia-aberta-v16.jpg | grep -q JPEG
          test -s public/assets/olivia-fechada-v16.jpg
          test -s public/assets/olivia-falando-v16.jpg
          test -s public/assets/olivia-aberta-v16.jpg
          echo 'OLIVIA V16 MATERIALIZATION PASS'

      - name: Protect Emma core + validate Olivia V16
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v7.js
          node --check src/strict-output-v16.js
          node --check public/app.js
          node --check public/avatar-core.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q '"main": "src/strict-output-v16.js"' wrangler.jsonc
          grep -q "language:'es-ES'" src/strict-output-v7.js
          grep -q "languageLabel:'Español'" src/strict-output-v7.js
          grep -q "subtitle:'Profesora de español'" src/strict-output-v7.js
          grep -q 'X-FNS-QA-Mock' src/strict-output-v16.js
          grep -q 'olivia-fechada-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-falando-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-aberta-v16.jpg' src/strict-output-v16.js
          echo 'CORE LOCK + OLIVIA V16 SOURCE PASS'

      - name: Local mock contract — never touch Workers AI
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v16.js';
          const env = new Proxy({}, { get(){ throw new Error('AI/env access forbidden in QA mock'); } });
          for (const path of ['/tts','/chat','/stt']) {
            const req = new Request('https://qa.local'+path, {
              method:'POST',
              headers:{'Content-Type':'application/json','X-FNS-QA-Mock':'1'},
              body:JSON.stringify({teacher:'Olivia',text:'Hola'})
            });
            const res = await worker.fetch(req, env, {});
            if (!res.ok || res.headers.get('X-FNS-QA-Mock') !== '1') throw new Error('mock leak '+path);
          }
          console.log('MOCK QA PASS — 0 Workers AI requests');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v16-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production HTML/assets smoke — no AI endpoints
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'
          curl --compressed --fail --silent --show-error "$BASE/?avatar=olivia&v=16&qa=visual-only" -o olivia-v16.html
          grep -q 'olivia-fechada-v16.jpg' olivia-v16.html
          grep -q 'olivia-falando-v16.jpg' olivia-v16.html
          grep -q 'olivia-aberta-v16.jpg' olivia-v16.html
          grep -q 'es-ES' olivia-v16.html
          grep -q 'Profesora de español' olivia-v16.html
          for f in olivia-fechada-v16.jpg olivia-falando-v16.jpg olivia-aberta-v16.jpg; do
            curl --compressed --fail --silent --show-error -o "$f" "$BASE/assets/$f?v=16"
            file "$f" | grep -q JPEG
          done
          echo 'PRODUCTION V16 HTML + GENERATED IMAGE ASSETS PASS — NO TTS/STT/CHAT CALLED'

      - name: Pixel-visible browser QA — screenshot pixels, zero AI calls
        run: |
          npm install --no-save puppeteer-core@24.18.0 pngjs@7.0.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const {PNG}=require('pngjs');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            let blockedAI=0;
            await page.setRequestInterception(true);
            page.on('request',req=>{
              const p=new URL(req.url()).pathname;
              if(['/tts','/stt','/chat'].includes(p)){blockedAI++;return req.abort('blockedbyclient');}
              req.continue();
            });
            await page.goto('https://fns-stt.karlapower007.workers.dev/?avatar=olivia&v=16&qa=pixels',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>{
              const i=document.getElementById('olivia-avatar-img');
              return i&&i.complete&&i.naturalWidth>0&&i.naturalHeight>0;
            },{timeout:30000});
            const result=await page.evaluate(()=>{
              const img=document.getElementById('olivia-avatar-img');
              const rect=img.getBoundingClientRect();
              return {
                panel:document.getElementById('panel-language')?.textContent?.trim(),
                subtitle:document.getElementById('avatar-subtitle')?.textContent?.trim(),
                src:img.currentSrc||img.src,
                natural:[img.naturalWidth,img.naturalHeight],
                rect:[rect.width,rect.height],
                display:getComputedStyle(img).display,
                visibility:getComputedStyle(img).visibility,
                opacity:getComputedStyle(img).opacity
              };
            });
            if(result.panel!=='Español · A1')throw new Error('language leak '+JSON.stringify(result));
            if(!/español/i.test(result.subtitle||''))throw new Error('subtitle leak '+JSON.stringify(result));
            if(!result.src.includes('olivia-fechada-v16.jpg'))throw new Error('wrong frame source '+JSON.stringify(result));
            if(result.natural[0]!==256||result.natural[1]!==256)throw new Error('unexpected generated frame dimensions '+JSON.stringify(result));
            if(result.rect[0]<100||result.rect[1]<100||result.display==='none'||result.visibility==='hidden'||Number(result.opacity)<0.9)throw new Error('avatar geometry hidden '+JSON.stringify(result));
            if(blockedAI!==0)throw new Error('page attempted AI endpoints during visual QA: '+blockedAI);

            const element=await page.$('#olivia-avatar-img');
            const rendered=await element.screenshot({encoding:'binary'});
            const png=PNG.sync.read(rendered);
            let nonBlack=0,bright=0,min=765,max=0;
            for(let i=0;i<png.data.length;i+=4){
              const sum=png.data[i]+png.data[i+1]+png.data[i+2];
              if(sum>30)nonBlack++;
              if(sum>180)bright++;
              if(sum<min)min=sum;
              if(sum>max)max=sum;
            }
            const total=png.width*png.height;
            const pixels={nonBlack,bright,dynamicRange:max-min,total,nonBlackRatio:nonBlack/total,brightRatio:bright/total};
            if(pixels.nonBlackRatio<0.35||pixels.brightRatio<0.10||pixels.dynamicRange<120)throw new Error('avatar rendered black/blank '+JSON.stringify({result,pixels}));
            await page.screenshot({path:'olivia-v16-visible.png',fullPage:true});
            console.log('OLIVIA V16 PIXEL QA PASS',result,pixels);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload V16 proof
        uses: actions/upload-artifact@v4
        with:
          name: olivia-v16-visible-proof
          path: fns-digital-human/worker/olivia-v16-visible.png
          retention-days: 30

      - name: Final status
        run: echo 'DEPLOY V16 PASS — generated Olivia frames, Spanish profile, visible avatar pixels, quota-safe mock QA; Emma core unchanged'
