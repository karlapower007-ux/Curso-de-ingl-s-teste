name: Deploy Cloudflare Native Consciência v1

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Guard native resources
        run: |
          set -euo pipefail
          npm run check
          ! grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc
          ! grep -q 'onrender.com' src/index.js
          grep -q '"binding": "PDFS"' wrangler.jsonc
          grep -q '"binding": "VECTORIZE"' wrangler.jsonc
          grep -q '"binding": "DB"' wrangler.jsonc

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Production smoke
        run: |
          set -euo pipefail
          BASE='https://consciencia-fabiano.karlapower007.workers.dev'
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$BASE/health" | tee /tmp/health.json
          jq -e '.ok == true and .architecture == "cloudflare-native" and .render_dependency == false' /tmp/health.json
          curl -fsS "$BASE/" | grep -q 'Consciência do Fabiano'
