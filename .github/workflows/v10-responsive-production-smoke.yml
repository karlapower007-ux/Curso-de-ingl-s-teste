name: V10.1 Responsive Offline Production Smoke

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths:
      - "consciencia-fabiano/public/index.html"
      - "consciencia-fabiano/public/app.js"
      - "consciencia-fabiano/public/style.css"
      - "consciencia-fabiano/public/sw-v3.js"
      - ".github/workflows/v10-responsive-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-1-responsive-production-smoke
  cancel-in-progress: true

jobs:
  browser-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser driver only
        working-directory: consciencia-fabiano
        run: npm install --no-save --ignore-scripts playwright-core

      - name: Validate 360 390 412 and desktop plus offline reload
        working-directory: consciencia-fabiano
        shell: bash
        run: |
          set -euo pipefail
          cat > .v10-responsive-smoke.mjs <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright-core";

          const base="https://consciencia-fabiano.focoeepoder2.workers.dev";
          const candidates=[
            process.env.CHROME_PATH,
            "/usr/bin/google-chrome",
            "/usr/bin/google-chrome-stable",
            "/usr/bin/chromium",
            "/usr/bin/chromium-browser"
          ].filter(Boolean);
          const executablePath=candidates.find(p=>fs.existsSync(p));
          if(!executablePath) throw new Error("Chrome/Chromium não encontrado no runner.");

          const browser=await chromium.launch({headless:true,executablePath,args:["--no-sandbox"]});
          const report=[];
          try{
            for(const width of [360,390,412,1366]){
              const context=await browser.newContext({viewport:{width,height:width<600?800:900}});
              const page=await context.newPage();
              const pageErrors=[];
              page.on("pageerror",e=>pageErrors.push(String(e)));
              await page.goto(base+"/?responsive_smoke="+width+"-"+Date.now(),{
                waitUntil:"domcontentloaded",timeout:45000
              });
              await page.locator("#questionInput").waitFor({state:"visible",timeout:10000});
              await page.locator("#dictionaryTab").waitFor({state:"visible",timeout:10000});
              await page.waitForFunction(()=>{
                const tab=document.querySelector("#dictionaryTab");
                const chat=document.querySelector("#chatTab");
                return typeof tab?.onclick==="function" && typeof chat?.onclick==="function";
              },null,{timeout:15000});
              const layout=await page.evaluate(()=>({
                innerWidth:window.innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                questionVisible:!!document.querySelector("#questionInput")?.getClientRects().length,
                sendVisible:!!document.querySelector("#sendBtn")?.getClientRects().length,
                dictionaryVisible:!!document.querySelector("#dictionaryTab")?.getClientRects().length,
                conceptSurfacePresent:!!document.querySelector("#dictionaryConcept"),
                conceptBackfillStatusPresent:!!document.querySelector("#conceptIndexStatus"),
                version:(document.body.innerText.match(/v10\.1[^\n]*/i)||[""])[0]
              }));
              if(layout.scrollWidth>layout.innerWidth+2) throw new Error("Overflow horizontal em "+width+": "+JSON.stringify(layout));
              if(!layout.questionVisible||!layout.sendVisible||!layout.dictionaryVisible) throw new Error("Controle principal oculto em "+width+": "+JSON.stringify(layout));
              if(!layout.conceptSurfacePresent||!layout.conceptBackfillStatusPresent) throw new Error("Superfície conceitual ausente em "+width+": "+JSON.stringify(layout));
              if(pageErrors.length) throw new Error("Page errors em "+width+": "+pageErrors.join(" | "));

              await page.locator("#dictionaryTab").click();
              await page.locator("#dictionaryPanel").waitFor({state:"visible",timeout:10000});
              await page.locator("#dictionaryInput").waitFor({state:"visible",timeout:10000});
              if(await page.locator("#dictionaryConcept").count()!==1) throw new Error("Card conceitual ausente em "+width);
              await page.locator("#chatTab").click();
              await page.locator("#chatPanel").waitFor({state:"visible",timeout:10000});
              await page.locator("#operationMode").waitFor({state:"visible",timeout:5000});
              const modes=await page.locator("#operationMode option").allTextContents();

              await page.locator("#settingsTab").click();
              await page.locator("#settingsPanel").waitFor({state:"visible",timeout:10000});
              await page.locator("#settingsOperationMode").waitFor({state:"visible",timeout:10000});
              const settingsModes=await page.locator("#settingsOperationMode option").allTextContents();
              if(!settingsModes.some(x=>x.includes("100% offline"))||!settingsModes.some(x=>x.includes("Online"))) {
                throw new Error("Modos offline/online ausentes em Configurações em "+width);
              }
              await page.locator("#chatTab").click();
              await page.locator("#chatPanel").waitFor({state:"visible",timeout:10000});
              if(!modes.some(x=>x.includes("100% offline"))||!modes.some(x=>x.includes("Online"))) {
                throw new Error("Modos offline/online ausentes em "+width);
              }

              // Canonical local-first proof at every supported viewport. Seed only
              // this isolated browser profile; production PDFs/R2/DO are untouched.
              const seeded=await page.evaluate(async()=>{
                const engine=await import("/rag-cascade.js?v=10.1.1");
                await engine.ready;
                const result=await engine.persistExtracted({
                  content_sha256:"qa-canonical-alias-"+window.innerWidth,
                  filename:"QA canônico local",
                  title:"QA canônico local",
                  pages:[
                    {page:1,text:"Adam conversou com Michael sobre sua missão."},
                    {page:2,text:"Adão aparece novamente neste registro."},
                    {page:3,text:"The Second Anointing is discussed in this passage."},
                    {page:4,text:"Tithing is described as a covenant practice."},
                    {page:5,text:"Heavenly Father bestowed the Melchizedek Priesthood in this synthetic QA paragraph."},
                    {page:6,text:"The plan of salvation includes premortal life and exaltation in this synthetic QA paragraph."},
                    {page:7,text:"Joseph Smith described the First Vision in this synthetic QA paragraph."},
                    {page:8,text:"Baptism and the sacrament are named together in this synthetic QA paragraph."}
                  ]
                });
                return result;
              });
              if(Number(seeded?.count||0)!==8) throw new Error("Falha ao semear QA local em "+width+": "+JSON.stringify(seeded));

              await page.locator("#chatTab").click();
              await page.locator("#operationMode").selectOption("offline");
              await page.waitForFunction(()=>localStorage.getItem("fns_operating_mode_v10")==="offline",null,{timeout:5000});
              const apiRequests=[];
              const captureApi=req=>{try{if(new URL(req.url()).pathname.startsWith("/api/"))apiRequests.push(req.url());}catch{}};
              page.on("request",captureApi);

              await page.locator("#dictionaryTab").click();
              const canonical=[
                {query:"Adão",minTotal:2,concept:"Adão",mustContain:"Adam",related:"Miguel"},
                {query:"Miguel",minTotal:1,concept:"Miguel",mustContain:"Michael"},
                {query:"Segunda Unção",minTotal:1,concept:"Segunda Unção",mustContain:"Second Anointing"},
                {query:"Dízimo",minTotal:1,concept:"Dízimo",mustContain:"dízimo"},
                {query:"Pai Celestial",minTotal:1,concept:"Pai Celestial",mustContain:"Pai Celestial"},
                {query:"Sacerdócio de Melquisedeque",minTotal:1,concept:"Sacerdócio de Melquisedeque",mustContain:"Sacerdócio de Melquisedeque"},
                {query:"Plano de Salvação e Vida Pré-Mortal",minTotal:1,conceptParts:["Plano de Salvação","Vida Pré-Mortal"],mustContain:"plan of salvation",mustContainAlso:"premortal life",compound:true},
                {query:"Batismo e Sacramento",minTotal:1,conceptParts:["Batismo","Sacramento"],mustContain:"Batismo",mustContainAlso:"Sacramento",compound:true}
              ];
              const canonicalReport=[];
              for(const test of canonical){
                await page.locator("#dictionaryInput").fill(test.query);
                await page.locator("#dictionarySearchBtn").click();
                await page.waitForFunction(
                  ()=> {
                    const status=(document.querySelector("#dictionaryStatus")?.textContent||"").trim();
                    const button=document.querySelector("#dictionarySearchBtn");
                    return button?.disabled===false &&
                      status.length>0 &&
                      !/Busca strict AND local em toda a biblioteca/i.test(status);
                  },
                  null,{timeout:30000}
                );
                const state=await page.evaluate(()=>({
                  status:document.querySelector("#dictionaryStatus")?.textContent||"",
                  pageInfo:document.querySelector("#dictionaryPageInfo")?.textContent||"",
                  concept:document.querySelector("#dictionaryConcept")?.textContent||"",
                  results:[...document.querySelectorAll(".dictionary-result-text")].map(x=>x.textContent||"")
                }));
                const totalMatch=state.pageInfo.match(/•\s*(\d+)\s*ocorrência/i);
                const total=Number(totalMatch?.[1]||0);
                if(total<test.minTotal) throw new Error("Alias offline não expandiu "+test.query+" em "+width+": "+JSON.stringify(state));
                const foldConcept=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
                const conceptFold=foldConcept(state.concept);
                if(test.conceptParts){
                  if(!test.conceptParts.every(part=>conceptFold.includes(foldConcept(part)))) throw new Error("Componentes canônicos ausentes para "+test.query+" em "+width+": "+JSON.stringify(state));
                }else if(!conceptFold.includes(foldConcept(test.concept))) throw new Error("Conceito canônico ausente para "+test.query+" em "+width+": "+JSON.stringify(state));
                if(!state.results.some(x=>x.toLowerCase().includes(test.mustContain.toLowerCase()))) throw new Error("Equivalência bilíngue ausente para "+test.query+" em "+width+": "+JSON.stringify(state));
                if(test.mustContainAlso && !state.results.some(x=>x.toLowerCase().includes(test.mustContain.toLowerCase())&&x.toLowerCase().includes(test.mustContainAlso.toLowerCase()))) {
                  throw new Error("AND composto não manteve os conceitos no mesmo parágrafo para "+test.query+" em "+width+": "+JSON.stringify(state));
                }
                if(test.compound){
                  const fold=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
                  const groups=test.query.startsWith("Plano")
                    ? [["plano de salvacao","plan of salvation"],["vida pre mortal","vida pre-mortal","premortal life","pre-mortal life"]]
                    : [["batismo","baptism"],["sacramento","sacrament"]];
                  for(const row of state.results){
                    const f=fold(row);
                    if(!groups.every(g=>g.some(a=>f.includes(fold(a))))) throw new Error("Resultado OR indevido em busca composta "+test.query+" / "+width+": "+row);
                  }
                }
                if(test.related && !conceptFold.includes(foldConcept(test.related))) throw new Error("Relação conceitual offline ausente para "+test.query+" em "+width+": "+JSON.stringify(state));
                canonicalReport.push({query:test.query,total,concept:state.concept,results:state.results.length,compound:Boolean(test.compound)});
              }
              page.off("request",captureApi);
              if(apiRequests.length) throw new Error("Busca canônica offline tentou acessar API em "+width+": "+JSON.stringify(apiRequests));

              report.push({width,layout,modes,canonical:canonicalReport});
              await context.close();
            }

            // Shell/PWA offline proof on a mobile viewport.
            const context=await browser.newContext({viewport:{width:390,height:800},serviceWorkers:"allow"});
            const page=await context.newPage();
            await page.goto(base+"/?offline_shell_prime="+Date.now(),{waitUntil:"networkidle",timeout:60000});
            await page.evaluate(async()=>{
              if(!("serviceWorker" in navigator)) throw new Error("Service Worker indisponível");
              await navigator.serviceWorker.ready;
            });
            await page.locator("#operationMode").selectOption("offline");
            await page.waitForTimeout(1200);
            await context.setOffline(true);
            await page.reload({waitUntil:"domcontentloaded",timeout:20000});
            await page.locator("#questionInput").waitFor({state:"visible",timeout:8000});
            const offlineState=await page.evaluate(async()=>({
              navigatorOnline:navigator.onLine,
              mode:localStorage.getItem("fns_operating_mode_v10"),
              width:window.innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              title:document.title,
              apiProbe:await (async()=>{
                try{
                  const r=await fetch("/api/status?offline_probe="+Date.now(),{cache:"no-store"});
                  const body=await r.json().catch(()=>({}));
                  return {resolved:true,status:r.status,type:r.type,code:String(body?.code||""),offline:body?.offline===true};
                }catch(error){
                  return {resolved:false,error:String(error)};
                }
              })()
            }));
            if(offlineState.mode!=="offline") throw new Error("Modo offline não persistiu: "+JSON.stringify(offlineState));
            const blockedByServiceWorker=offlineState.apiProbe?.resolved===true && offlineState.apiProbe?.status===503 && offlineState.apiProbe?.code==="OFFLINE_ONLY" && offlineState.apiProbe?.offline===true;
            const blockedByNetwork=offlineState.apiProbe?.resolved===false;
            if(!blockedByServiceWorker && !blockedByNetwork) throw new Error("Uma chamada /api conseguiu sair durante o modo offline: "+JSON.stringify(offlineState));
            if(offlineState.scrollWidth>offlineState.width+2) throw new Error("Overflow no reload offline: "+JSON.stringify(offlineState));
            report.push({offline_shell_reload:offlineState});
            await context.close();

            console.log("V10_1_RESPONSIVE_OFFLINE_BROWSER=pass");
            console.log(JSON.stringify(report));
          } finally {
            await browser.close();
          }
          NODE
          node .v10-responsive-smoke.mjs
          rm -f .v10-responsive-smoke.mjs
