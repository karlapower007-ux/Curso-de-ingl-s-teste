name: Probe Cloudflare token delegation

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths: ['.github/workflows/probe-cloudflare-token-delegation.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - name: Probe token-management permissions safely
        shell: bash
        run: |
          set +e
          probe() {
            label="$1"; url="$2"
            code=$(curl -sS -o /tmp/cf.json -w '%{http_code}' "$url"               -H "Authorization: Bearer $CF_TOKEN"               -H 'Content-Type: application/json')
            success=$(jq -r '.success // false' /tmp/cf.json 2>/dev/null)
            err=$(jq -r '.errors[0].code // 0' /tmp/cf.json 2>/dev/null)
            count=$(jq -r 'if (.result|type)=="array" then (.result|length) else 0 end' /tmp/cf.json 2>/dev/null)
            echo "$label http=$code success=$success count=$count error_code=$err"
          }
          probe "user_tokens" "https://api.cloudflare.com/client/v4/user/tokens?per_page=5"
          probe "permission_groups" "https://api.cloudflare.com/client/v4/user/tokens/permission_groups?per_page=100"

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/probe-cloudflare-token-delegation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Cloudflare token delegation probe"
          git push origin HEAD:consciencia-cloudflare-native-v1
