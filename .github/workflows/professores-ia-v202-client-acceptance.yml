name: Professores IA v2.0.2 real Windows client acceptance
on:
  push:
    branches: [professores-ia-v202-client-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare actual installer and guest tests
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          mkdir -p storage shared oem
          unzip -q qa/Professores_IA_v2.0.2_FORBIDDEN_FIX.zip -d oem
          echo 'e88a737fd6f6a15490a00f6e7b8b7363d9427ad107b73114470d492b36f6408a  oem/Professores_IA_v2.0.2_FORBIDDEN_FIX_Setup.exe' | sha256sum -c -
          cat > oem/install.bat <<'BAT'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\OEM\acceptance.ps1 > C:\OEM\guest-test.log 2>&1
          exit /b %ERRORLEVEL%
          BAT
          cat > oem/acceptance.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $out='C:\QAResults'
          New-Item -ItemType Directory -Force $out | Out-Null
          $result=[ordered]@{schema=4;version='2.0.2';pass=$false;checks=[ordered]@{};error=$null}
          try {
            $os=Get-CimInstance Win32_OperatingSystem
            $cs=Get-CimInstance Win32_ComputerSystem
            $root=Join-Path $env:LOCALAPPDATA 'ProfessoresIA'
            $desktop=[Environment]::GetFolderPath('Desktop')
            $result.os=$os|Select-Object Caption,Version,BuildNumber,OSArchitecture,ProductType
            $result.checks.client_x64=($os.ProductType -eq 1 -and $cs.SystemType -eq 'x64-based PC' -and $os.Caption -match 'Windows (10|11)')
            $present=@('node.exe','npm.cmd','python.exe','python3.exe','pip.exe','pip3.exe','py.exe') | Where-Object {Get-Command $_ -ErrorAction SilentlyContinue}
            $result.checks.no_developer_tools=(@($present).Count -eq 0)
            $result.checks.no_prior_install=(!(Test-Path $root))
            $result.checks.no_prior_data=(!(Test-Path (Join-Path $env:APPDATA 'ProfessoresIA')))
            $result.checks.no_prior_shortcut=(!(Test-Path (Join-Path $desktop 'Professores IA.lnk')))
            if($result.checks.Values -contains $false){throw 'Clean client baseline failed'}
            $setup='C:\OEM\Professores_IA_v2.0.2_FORBIDDEN_FIX_Setup.exe'
            $result.setup_sha256=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
            $proc=Start-Process -FilePath $setup -PassThru
            $acceptancePath=Join-Path $root 'evidence\acceptance-schema4.json'
            $deadline=(Get-Date).AddMinutes(8)
            while(!(Test-Path $acceptancePath) -and (Get-Date) -lt $deadline){Start-Sleep -Seconds 2}
            if(!(Test-Path $acceptancePath)){throw 'Installer produced no schema 4 evidence'}
            Start-Sleep -Seconds 3
            Copy-Item $acceptancePath (Join-Path $out 'installer-acceptance-schema4.json')
            $acceptance=Get-Content $acceptancePath -Raw | ConvertFrom-Json
            $result.checks.installer_schema4=($acceptance.schema -eq 4 -and $acceptance.pass -eq $true)
            $result.installer_checks=$acceptance.checks
            $page=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/' -TimeoutSec 20
            $result.checks.root_http200=($page.StatusCode -eq 200 -and $page.Content -match 'Professores IA')
            $js=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/static/app.js' -TimeoutSec 20
            $result.checks.app_js_http200=($js.StatusCode -eq 200 -and $js.RawContentLength -gt 1000)
            $health=Invoke-RestMethod 'http://127.0.0.1:8789/api/health' -TimeoutSec 20
            $health | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $out 'health.json') -Encoding UTF8
            $result.checks.health_ok=($health.ok -eq $true)
            $result.checks.desktop_shortcut=(Test-Path (Join-Path $desktop 'Professores IA.lnk'))
            $result.pass=($result.checks.Values -notcontains $false)
          } catch { $result.error=$_.Exception.Message }
          finally {
            $result | ConvertTo-Json -Depth 15 | Set-Content (Join-Path $out 'independent-acceptance.json') -Encoding UTF8
            if(Test-Path (Join-Path $env:LOCALAPPDATA 'ProfessoresIA\evidence')){
              Copy-Item (Join-Path $env:LOCALAPPDATA 'ProfessoresIA\evidence\*') $out -Recurse -Force
            }
            $deadline=(Get-Date).AddMinutes(2)
            while(!(Test-Path 'Z:\') -and (Get-Date) -lt $deadline){Start-Sleep -Seconds 2}
            if(Test-Path 'Z:\'){
              Copy-Item "$out\*" 'Z:\' -Recurse -Force
              Set-Content 'Z:\QA_DONE.txt' 'DONE' -Encoding ASCII
            }
            shutdown.exe /s /t 10 /f
          }
          PS1
      - name: Execute installer inside clean Windows 10 x64 client
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name professores-acceptance --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN --cap-add NET_RAW -e VERSION=ltsc10 -e RAM_SIZE=6G -e CPU_CORES=4 -e DISK_SIZE=28G -e USERNAME=QA -e PASSWORD='QaPass!234' -e REGION=en-US -e KEYBOARD=en-US -e LOG=Y -e SHUTDOWN=Y -v "$PWD/storage:/storage" -v "$PWD/shared:/shared" -v "$PWD/oem:/oem" --stop-timeout 120 dockurr/windows@sha256:0cff9eb0e7aee9953e55bc682852ca4fdca233145a58ae1ec94f0b0c01a2ed30
          deadline=$((SECONDS+1500))
          while ((SECONDS < deadline)); do
            if [ -f shared/QA_DONE.txt ]; then break; fi
            if ! docker ps --format '{{.Names}}' | grep -qx professores-acceptance; then
              docker logs professores-acceptance
              exit 42
            fi
            sleep 10
          done
          test -f shared/QA_DONE.txt
          cat shared/independent-acceptance.json
          python3 - <<'PY'
          import json
          with open('shared/independent-acceptance.json', encoding='utf-8-sig') as f:
              result=json.load(f)
          assert result['schema']==4 and result['pass'] is True, result
          assert all(value is True for value in result['checks'].values()), result
          PY
      - name: Save diagnostics
        if: always()
        shell: bash
        run: |
          docker logs professores-acceptance > shared/container.log 2>&1 || true
          docker stop -t 120 professores-acceptance || true
      - name: Upload actual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professores-ia-v202-windows-client-evidence
          path: shared/
          if-no-files-found: error
          retention-days: 7
