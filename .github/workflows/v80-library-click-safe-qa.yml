name: V8 Library Click Safe QA

on:
  push:
    branches:
      - "ops-v80-final-ui-qa-20260921"
    paths:
      - ".github/workflows/v80-library-click-safe-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-click:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Exercise production Library on desktop and mobile
        shell: bash
        run: |
          cat > ./library-click-safe.mjs <<'EOF'
          import { chromium } from "playwright";
          const BASE="https://consciencia-fabiano.focoeepoder2.workers.dev";
          const appText=await (await fetch(BASE+"/app.js?qa="+Date.now())).text();
          const passwordMatch=appText.match(/const\s+LOCAL_ADMIN_PASSWORD\s*=\s*["']([^"']+)["']/);
          if(!passwordMatch) throw new Error("public local Library unlock contract not found");
          const localUnlock=passwordMatch[1];

          const browser=await chromium.launch({headless:true});
          const results=[];
          try{
            for(const profile of [
              {name:"desktop",viewport:{width:1440,height:900},isMobile:false},
              {name:"mobile",viewport:{width:390,height:844},isMobile:true}
            ]){
              const context=await browser.newContext({viewport:profile.viewport,isMobile:profile.isMobile});
              const page=await context.newPage();
              const errors=[];
              page.on("pageerror",e=>errors.push("pageerror:"+String(e.message||e)));
              page.on("dialog",async d=>{
                if(d.type()==="prompt") await d.accept(localUnlock);
                else await d.dismiss();
              });
              await page.goto(BASE+"/?library-safe-qa="+Date.now(),{waitUntil:"domcontentloaded",timeout:60000});
              await page.waitForFunction(()=>typeof document.querySelector("#libraryTab")?.onclick==="function",{timeout:30000});
              await page.locator("#libraryTab").click({timeout:15000});
              await page.locator("#libraryPanel").waitFor({state:"visible",timeout:20000});
              await page.waitForFunction(()=>document.querySelectorAll("#booksList .book").length>=8,{timeout:60000});
              const state=await page.evaluate(()=>({
                panelVisible:!document.querySelector("#libraryPanel")?.classList.contains("hidden"),
                tabActive:document.querySelector("#libraryTab")?.classList.contains("active")===true,
                rows:[...document.querySelectorAll("#booksList .book")].map(x=>x.querySelector("strong")?.textContent?.trim()||"").filter(Boolean),
                status:document.querySelector("#adminStatus")?.textContent?.trim()||"",
                width:innerWidth,
                scrollWidth:document.documentElement.scrollWidth
              }));
              const ok=state.panelVisible && state.tabActive && state.rows.length>=8 && state.scrollWidth<=state.width+8;
              results.push({name:profile.name,ok,visible_documents:state.rows.length,status:state.status,horizontal_overflow_px:Math.max(0,state.scrollWidth-state.width),page_errors:errors});
              await context.close();
            }
          }finally{
            await browser.close();
          }
          const report={ok:results.every(x=>x.ok),results};
          console.log("V80_LIBRARY_CLICK_SAFE_QA="+JSON.stringify(report));
          if(!report.ok) process.exit(1);
          EOF
          node ./library-click-safe.mjs
