name: Deploy FNS Worker

on:
  push:
    branches: [fns-digital-human]
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install

      - name: Protect Emma core + validate Olivia V15
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v7.js
          node --check src/strict-output-v15.js
          node --check public/app.js
          node --check public/avatar-core.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q '"main": "src/strict-output-v15.js"' wrangler.jsonc
          grep -q "language:'es-ES'" src/strict-output-v7.js
          grep -q "languageLabel:'Español'" src/strict-output-v7.js
          grep -q "subtitle:'Profesora de español'" src/strict-output-v7.js
          grep -q 'X-FNS-QA-Mock' src/strict-output-v15.js
          file public/assets/olivia-fechada-v15.jpg | grep -q JPEG
          file public/assets/olivia-falando-v15.jpg | grep -q JPEG
          file public/assets/olivia-aberta-v15.jpg | grep -q JPEG
          echo 'CORE LOCK + OLIVIA V15 SOURCE PASS'

      - name: Local mock contract — never touch Workers AI
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v15.js';
          const env = new Proxy({}, { get(){ throw new Error('AI/env access forbidden in QA mock'); } });
          for (const path of ['/tts','/chat','/stt']) {
            const req = new Request('https://qa.local'+path, {
              method:'POST',
              headers:{'Content-Type':'application/json','X-FNS-QA-Mock':'1'},
              body:JSON.stringify({teacher:'Olivia',text:'Hola'})
            });
            const res = await worker.fetch(req, env, {});
            if (!res.ok || res.headers.get('X-FNS-QA-Mock') !== '1') throw new Error('mock leak '+path);
          }
          console.log('MOCK QA PASS — 0 Workers AI requests');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v15-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production HTML/assets smoke — no AI endpoints
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'
          curl --compressed --fail --silent --show-error "$BASE/?avatar=olivia&v=15&qa=visual-only" -o olivia-v15.html
          grep -q 'olivia-fechada-v15.jpg' olivia-v15.html
          grep -q 'olivia-falando-v15.jpg' olivia-v15.html
          grep -q 'olivia-aberta-v15.jpg' olivia-v15.html
          grep -q 'es-ES' olivia-v15.html
          grep -q 'Profesora de español' olivia-v15.html
          for f in olivia-fechada-v15.jpg olivia-falando-v15.jpg olivia-aberta-v15.jpg; do
            curl --compressed --fail --silent --show-error -o "$f" "$BASE/assets/$f?v=15"
            file "$f" | grep -q JPEG
          done
          echo 'PRODUCTION V15 HTML + IMAGE ASSETS PASS — NO TTS/STT/CHAT CALLED'

      - name: Pixel-visible browser QA — block all AI routes
        run: |
          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            let blockedAI=0;
            await page.setRequestInterception(true);
            page.on('request',req=>{
              const p=new URL(req.url()).pathname;
              if(['/tts','/stt','/chat'].includes(p)){blockedAI++;return req.abort('blockedbyclient');}
              req.continue();
            });
            await page.goto('https://fns-stt.karlapower007.workers.dev/?avatar=olivia&v=15&qa=pixels',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>{
              const i=document.getElementById('olivia-avatar-img');
              return i&&i.complete&&i.naturalWidth>0&&i.naturalHeight>0;
            },{timeout:30000});
            const result=await page.evaluate(()=>{
              const img=document.getElementById('olivia-avatar-img');
              const panel=document.getElementById('panel-language')?.textContent?.trim();
              const subtitle=document.getElementById('avatar-subtitle')?.textContent?.trim();
              const rect=img.getBoundingClientRect();
              const c=document.createElement('canvas'); c.width=64;c.height=64;
              const x=c.getContext('2d',{willReadFrequently:true});
              x.drawImage(img,0,0,64,64);
              const d=x.getImageData(0,0,64,64).data;
              let nonBlack=0, bright=0, min=765, max=0;
              for(let i=0;i<d.length;i+=4){
                const sum=d[i]+d[i+1]+d[i+2];
                if(sum>30)nonBlack++;
                if(sum>180)bright++;
                if(sum<min)min=sum;if(sum>max)max=sum;
              }
              return {panel,subtitle,src:img.currentSrc||img.src,natural:[img.naturalWidth,img.naturalHeight],rect:[rect.width,rect.height],nonBlack,bright,dynamicRange:max-min};
            });
            if(result.panel!=='Español · A1')throw new Error('language leak '+JSON.stringify(result));
            if(!/español/i.test(result.subtitle||''))throw new Error('subtitle leak '+JSON.stringify(result));
            if(!result.src.includes('olivia-fechada-v15.jpg'))throw new Error('wrong frame source '+JSON.stringify(result));
            if(result.rect[0]<100||result.rect[1]<100)throw new Error('avatar geometry hidden '+JSON.stringify(result));
            if(result.nonBlack<1500||result.bright<500||result.dynamicRange<120)throw new Error('avatar decoded but visually black/blank '+JSON.stringify(result));
            if(blockedAI!==0)throw new Error('page attempted AI endpoints during visual QA: '+blockedAI);
            await page.screenshot({path:'olivia-v15-visible.png',fullPage:true});
            console.log('OLIVIA V15 PIXEL QA PASS',result);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload V15 proof
        uses: actions/upload-artifact@v4
        with:
          name: olivia-v15-visible-proof
          path: fns-digital-human/worker/olivia-v15-visible.png
          retention-days: 30

      - name: Final status
        run: echo 'DEPLOY V15 PASS — Spanish profile, visible avatar pixels, quota-safe mock QA; Emma core unchanged'
