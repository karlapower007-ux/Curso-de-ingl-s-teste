name: V8 App Shell Binding Diagnostic

on:
  push:
    branches:
      - "ops-v80-final-ui-qa-20260921"
    paths:
      - ".github/workflows/v80-app-shell-binding-diag.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - shell: bash
        run: |
          cat > ./diag.mjs <<'EOF'
          import { chromium } from "playwright";
          const BASE="https://consciencia-fabiano.focoeepoder2.workers.dev";
          const browser=await chromium.launch({headless:true});
          try{
            for(const profile of [
              {name:"desktop",viewport:{width:1440,height:900}},
              {name:"mobile",viewport:{width:390,height:844}}
            ]){
              const context=await browser.newContext({viewport:profile.viewport});
              const page=await context.newPage();
              const pageErrors=[];
              const consoleErrors=[];
              const responses=[];
              page.on("pageerror",e=>pageErrors.push(String(e.message||e)));
              page.on("console",m=>{ if(m.type()==="error") consoleErrors.push(m.text()); });
              page.on("response",r=>{
                const u=new URL(r.url());
                if(/\/(?:app\.js|style\.css|health\/deploy)$/.test(u.pathname)) responses.push({path:u.pathname,status:r.status()});
              });
              const nav=await page.goto(BASE+"/?binding-diag="+Date.now(),{waitUntil:"domcontentloaded",timeout:60000});
              await page.waitForTimeout(8000);
              const state=await page.evaluate(()=>({
                readyState:document.readyState,
                libraryExists:!!document.querySelector("#libraryTab"),
                libraryOnclick:typeof document.querySelector("#libraryTab")?.onclick,
                sendOnclick:typeof document.querySelector("#sendBtn")?.onclick,
                chatOnclick:typeof document.querySelector("#chatTab")?.onclick,
                appScripts:[...document.scripts].map(s=>s.src).filter(Boolean).filter(x=>x.includes("/app.js")),
                allScripts:[...document.scripts].map(s=>s.src||"[inline]")
              }));
              console.log("BINDING_DIAG="+JSON.stringify({name:profile.name,navStatus:nav?.status(),state,pageErrors,consoleErrors,responses}));
              await context.close();
            }
          } finally { await browser.close(); }
          EOF
          node ./diag.mjs
