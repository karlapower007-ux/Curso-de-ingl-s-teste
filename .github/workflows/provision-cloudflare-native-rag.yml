name: Provision Cloudflare Native RAG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Create or reuse R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list | grep -q 'consciencia-fabiano-pdfs'; then
            echo "R2_EXISTS=yes"
          else
            npx wrangler r2 bucket create consciencia-fabiano-pdfs
          fi

      - name: Create or reuse Vectorize index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler vectorize get consciencia-fabiano-rag >/tmp/vectorize.json 2>&1; then
            cat /tmp/vectorize.json
          else
            npx wrangler vectorize create consciencia-fabiano-rag --dimensions=1024 --metric=cosine
          fi

      - name: Create or reuse D1 and patch database id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="consciencia-fabiano-rag-db") | (.uuid // .id)' | head -1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            npx wrangler d1 create consciencia-fabiano-rag-db --json > /tmp/d1-create.json
            cat /tmp/d1-create.json
            DB_ID=$(jq -r '.uuid // .id // .database_id // .d1_databases[0].database_id // empty' /tmp/d1-create.json | head -1)
          fi
          test -n "$DB_ID"
          python3 - "$DB_ID" <<'PY'
          import json,sys
          from pathlib import Path
          db_id=sys.argv[1]
          p=Path("wrangler.jsonc")
          data=json.loads(p.read_text())
          data["d1_databases"][0]["database_id"]=db_id
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          echo "D1_DATABASE_ID=$DB_ID"

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute consciencia-fabiano-rag-db --remote --file=./migrations/0001_init.sql

      - name: Validate native build
        run: |
          npm run check
          grep -q '"binding": "PDFS"' wrangler.jsonc
          grep -q '"binding": "VECTORIZE"' wrangler.jsonc
          grep -q '"binding": "DB"' wrangler.jsonc
          ! grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc
          ! grep -q 'onrender.com' src/index.js
          npx wrangler deploy --dry-run --outdir /tmp/native-rag-dist

      - name: Commit real D1 binding
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consciencia-fabiano/wrangler.jsonc
          git diff --cached --quiet || git commit -m "Bind provisioned Cloudflare Native RAG resources"
          git push origin HEAD:consciencia-cloudflare-native-v1
