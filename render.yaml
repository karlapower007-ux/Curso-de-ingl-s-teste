services:
  - type: web
    name: avatar-fabiano-api
    runtime: python
    plan: free
    rootDir: avatar-fabiano
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIM
        value: "768"
      - key: TTS_VOICE
        value: pt-BR-AntonioNeural
      - key: AUTO_INDEX_ON_STARTUP
        value: "1"
