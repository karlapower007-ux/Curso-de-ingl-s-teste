name: Deploy Consciência do Fabiano

on:
  push:
    branches: [consciencia-do-fabiano]
    paths:
      - 'consciencia-fabiano/**'
      - '.github/workflows/deploy-consciencia-fabiano.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build third Fabiano frame
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          a=Image.open('public/fabiano-fechado.png').convert('RGBA')
          b=Image.open('public/fabiano-aberto.png').convert('RGBA').resize(a.size)
          Image.blend(a,b,0.48).save('public/fabiano-falando.png',optimize=True)
          PY

      - name: Validate
        run: |
          npm run check
          test -s public/fabiano-fechado.png
          test -s public/fabiano-falando.png
          test -s public/fabiano-aberto.png
          grep -q 'Consciência do Fabiano' public/index.html
          grep -q 'avatar-fabiano-api.onrender.com' src/index.js
          grep -q 'id="questionInput"' public/index.html
          grep -q 'id="micBtn"' public/index.html
          grep -q 'id="sendBtn"' public/index.html
          grep -q 'id="autoSendVoice"' public/index.html
          grep -q 'sendQuestion' public/app.js
          npx wrangler deploy --dry-run --outdir /tmp/consciencia-dist

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke production
        run: |
          set -euo pipefail
          BASE='https://consciencia-fabiano.karlapower007.workers.dev'
          sleep 3
          curl --retry 8 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$BASE/" | grep -q 'Consciência do Fabiano'
          curl --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$BASE/health" | grep -q '"ok":true'
          code=$(curl -sS -o /tmp/status.json -w '%{http_code}' "$BASE/api/status")
          test "$code" = "200"
          grep -q '"ok":true' /tmp/status.json
          admin_code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' "$BASE/api/admin/livros")
          test "$admin_code" = "401"
          echo "KEYLESS CHAT + PROTECTED ADMIN PASS"
