name: V8 Exhaustive Production Acceptance

on:
  push:
    branches:
      - "ops-v80-exhaustive-production-qa-20260921"
    paths:
      - ".github/workflows/v80-exhaustive-production-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://consciencia-fabiano.focoeepoder2.workers.dev
      FNS_OWNER_TOKEN: ${{ secrets.FNS_OWNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for V8 exhaustive production health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            body="$(curl -fsS --max-time 15 "$BASE/health/deploy" || true)"
            if printf '%s' "$body" | jq -e '
              .ok == true
              and .version == "8.0.0-adaptive-20x20x20"
              and .exhaustive_full_text_contract == true
              and .full_text_streaming == true
              and .adaptive_continuation_enabled == true
              and .information_preservation_gate == true
              and .synthesis_principal_single_block_disabled == true
              and .memory_degraded_fallback == true
              and .r2_reconcile_degraded_fallback == true
            ' >/dev/null 2>&1; then
              echo "$body" > health.json
              echo "V8_EXHAUSTIVE_HEALTH_PASS=yes"
              exit 0
            fi
            sleep 5
          done
          echo "$body"
          exit 1

      - name: Verify memory and R2 reconcile endpoints
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FNS_OWNER_TOKEN"
          memory_key="v8-exhaustive-memory-test-20260921-000000000000"
          memory_code="$(curl -sS -o memory.json -w '%{http_code}' --max-time 30             -H "X-FNS-Memory-Key: $memory_key"             -H 'User-Agent: curl/8.5.0'             "$BASE/api/memory")"
          test "$memory_code" = "200"
          jq -e '.ok == true and (.degraded == true or .persistent == true)' memory.json >/dev/null
          echo "V8_MEMORY_ENDPOINT_PASS=yes"

          reconcile_code="$(curl -sS -o reconcile.json -w '%{http_code}' --max-time 30             -H "X-FNS-Owner-Token: $FNS_OWNER_TOKEN"             -H 'User-Agent: curl/8.5.0'             "$BASE/api/admin/r2-reconcile-state")"
          test "$reconcile_code" = "200"
          jq -e '.ok == true and ((.degraded != true) or (.code == "R2_RECONCILE_DURABLE_DEGRADED" and .safe_read_only_fallback == true))' reconcile.json >/dev/null
          echo "V8_R2_RECONCILE_STATE_PASS=yes"

      - name: Run deep exhaustive Adão query
        shell: bash
        run: |
          set -euo pipefail
          cat > deep-adao.mjs <<'EOF'
          import fs from 'node:fs/promises';
          const base=process.env.BASE;
          const memoryKey='v8-exhaustive-adao-memory-20260921-000000000000';
          const question='Adão — faça uma pesquisa profunda, exaustiva e enciclopédica usando toda evidência documental relevante recuperada. Desenvolva contexto doutrinário e histórico, autores e documentos, convergências, divergências, cronologia quando houver, detalhes complementares e pontos minoritários. Não reduza a resposta a uma síntese curta.';
          const response=await fetch(base+'/api/chat',{
            method:'POST',
            headers:{
              'Content-Type':'application/json',
              'Accept':'application/json',
              'X-FNS-Memory-Key':memoryKey,
              'User-Agent':'curl/8.5.0'
            },
            body:JSON.stringify({pergunta:question,memory_key:memoryKey,stream:false,deep_research:true}),
            signal:AbortSignal.timeout(900000)
          });
          const data=await response.json().catch(()=>({}));
          const full=String(data?.full_text || '');
          const resposta=String(data?.resposta || '');
          const fontes=Array.isArray(data?.fontes)?data.fontes:[];
          const paragraphs=full.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
          const inlineRefs=[...full.matchAll(/\[F\d{1,3}\]/g)].map(x=>x[0]);
          const sourceTitles=[...new Set(fontes.map(x=>String(x?.titulo||x?.arquivo||'').trim()).filter(Boolean))];
          const report={
            ok:response.ok && data?.ok===true,
            http_status:response.status,
            full_text_chars:full.length,
            resposta_alias_matches:full===resposta,
            contains_sintese_principal:/SÍNTESE PRINCIPAL/i.test(full),
            paragraphs:paragraphs.length,
            sources:fontes.length,
            distinct_source_titles:sourceTitles.length,
            source_titles:sourceTitles,
            inline_refs:inlineRefs.length,
            continuation_parts:Number(data?.continuation_parts||0),
            continuation_cursor:data?.continuation_cursor??null,
            evidence_groups_total:Number(data?.evidence_groups_total||0),
            evidence_groups_developed:Number(data?.evidence_groups_developed||0),
            evidence_coverage_percent:Number(data?.evidence_coverage_percent||0),
            information_preservation_gate:String(data?.information_preservation_gate||''),
            cognitive_mode:String(data?.cognitive_mode||''),
            provider:String(data?.provider||'')
          };
          await fs.writeFile('adao-response.json',JSON.stringify(data,null,2));
          await fs.writeFile('adao-acceptance.json',JSON.stringify(report,null,2));
          await fs.writeFile('adao-full-text.txt',full);
          console.log('ADAO_ACCEPTANCE='+JSON.stringify(report));
          if(!report.ok) process.exit(1);
          if(full.length<2000) process.exit(2);
          if(full!==resposta) process.exit(3);
          if(report.contains_sintese_principal) process.exit(4);
          if(paragraphs.length<6) process.exit(5);
          if(fontes.length<2 || sourceTitles.length<2) process.exit(6);
          if(inlineRefs.length<2) process.exit(7);
          if(report.evidence_groups_total<1) process.exit(8);
          if(report.evidence_groups_developed<1) process.exit(9);
          if(report.evidence_coverage_percent<=0) process.exit(10);
          if(!['pass','partial'].includes(report.information_preservation_gate)) process.exit(11);
          EOF
          node deep-adao.mjs

      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Verify full response visible on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > fulltext-ui.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const base=process.env.BASE;
          const full=(await fs.readFile('adao-full-text.txt','utf8')).trim();
          if(!full) throw new Error('missing full_text');
          const profiles=[
            {name:'desktop',viewport:{width:1440,height:900},isMobile:false},
            {name:'mobile',viewport:{width:390,height:844},isMobile:true}
          ];
          const browser=await chromium.launch({headless:true});
          const report=[];
          try{
            for(const p of profiles){
              const context=await browser.newContext({viewport:p.viewport,isMobile:p.isMobile});
              const page=await context.newPage();
              await page.addInitScript(({answer})=>{
                localStorage.setItem('consciencia_fabiano_history_v1',JSON.stringify([{
                  role:'assistant',content:answer,sources:[],fallback:false,ts:Date.now()
                }]));
              },{answer:full});
              const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
              if(!response?.ok()) throw new Error(p.name+' homepage HTTP '+response?.status());
              await page.locator('#messages .msg.assistant').last().waitFor({state:'visible',timeout:20000});
              await page.waitForTimeout(1200);
              const state=await page.locator('#messages .msg.assistant').last().evaluate(el=>{
                const body=el.querySelector('.markdown-body')||el.firstElementChild||el;
                const style=getComputedStyle(body);
                return {
                  chars:String(body.textContent||'').length,
                  scrollHeight:body.scrollHeight,
                  clientHeight:body.clientHeight,
                  maxHeight:style.maxHeight,
                  overflowY:style.overflowY,
                  lineClamp:style.webkitLineClamp||'none',
                  display:style.display
                };
              });
              const visible=await page.locator('#messages .msg.assistant').last().isVisible();
              const ratio=state.chars/Math.max(1,full.length);
              const ok=visible && ratio>0.55 && state.maxHeight==='none' && state.overflowY!=='hidden' && (state.lineClamp==='none'||state.lineClamp==='0');
              report.push({name:p.name,ok,visible,raw_chars:full.length,dom_chars:state.chars,dom_ratio:ratio,...state});
              await context.close();
            }
          }finally{await browser.close();}
          await fs.writeFile('fulltext-ui-acceptance.json',JSON.stringify(report,null,2));
          console.log('FULLTEXT_UI='+JSON.stringify(report));
          if(!report.every(x=>x.ok))process.exit(1);
          EOF
          node fulltext-ui.mjs

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-exhaustive-production-acceptance
          path: |
            health.json
            memory.json
            reconcile.json
            adao-acceptance.json
            adao-response.json
            adao-full-text.txt
            fulltext-ui-acceptance.json
          retention-days: 30
