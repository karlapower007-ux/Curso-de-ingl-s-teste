name: V8 Secondary Lexical Rescue QA

on:
  push:
    branches:
      - "fix-v80-secondary-lexical-rescue-20260921"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Architecture checks
        run: npm run check
      - name: Rescue contract checks
        run: |
          grep -q 'function secondaryLexicalRescueQueries' src/index.js
          grep -q 'lexical-rescue' src/index.js
          grep -q 'for(const rescueQuery of secondaryLexicalRescueQueries(question))' src/index.js
          node --check src/index.js
      - name: Frozen frontend guard
        run: |
          git diff --exit-code origin/consciencia-cloudflare-native-v1 -- public/index.html public/app.js public/style.css public/failover-v3.js public/sw-v3.js
