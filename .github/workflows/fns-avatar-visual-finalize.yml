name: FNS Avatar Fabiano Visual Finalizer

on:
  push:
    branches:
      - avatar-fabiano-production
    paths:
      - .github/workflows/fns-avatar-visual-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: avatar-fabiano-production
          fetch-depth: 0

      - name: Extract official avatars and finalize frontend
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          root = Path('avatar-fabiano/static')
          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')

          assets = {
              'AVATAR_PERFIL': root / 'avatar-fabiano-perfil.png',
              'AVATAR_DEBATENDO': root / 'avatar-fabiano-debatendo.png',
          }
          for constant, target in assets.items():
              pattern = re.compile(rf"const {constant}='data:image/png;base64,([^']+)';")
              match = pattern.search(index)
              if not match:
                  raise SystemExit(f'Embedded asset not found: {constant}')
              raw = base64.b64decode(match.group(1), validate=True)
              if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'Invalid PNG payload: {constant}')
              target.write_bytes(raw)
              index = pattern.sub(
                  f"const {constant}='/static/{target.name}';",
                  index,
                  count=1,
              )

          old_css = '.avatar-frame img{width:100%;height:100%;object-fit:cover;display:block}'
          new_css = '.avatar-frame img{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%;display:block;transition:opacity .16s ease,transform .16s ease;will-change:opacity,transform}.avatar-frame img.is-switching{opacity:.72;transform:scale(1.01)}'
          if old_css not in index:
              raise SystemExit('Expected avatar CSS block not found')
          index = index.replace(old_css, new_css, 1)

          tail = r'''const input=document.getElementById('perguntaInput'),respostaArea=document.getElementById('respostaArea'),audioPlayer=document.getElementById('audioPlayer'),sendBtn=document.getElementById('sendBtn'),avatarImg=document.getElementById('avatarImg'),statusText=document.getElementById('statusText'),fontesArea=document.getElementById('fontesArea'),fontesLista=document.getElementById('fontesLista');
let requestInFlight=false;
[AVATAR_PERFIL,AVATAR_DEBATENDO].forEach(src=>{const image=new Image();image.src=src});
function setAvatar(src){if(avatarImg.getAttribute('src')===src)return;avatarImg.classList.add('is-switching');avatarImg.src=src;const settle=()=>avatarImg.classList.remove('is-switching');if(avatarImg.complete)requestAnimationFrame(settle);else avatarImg.addEventListener('load',settle,{once:true})}
function notifyWidget(type){if(window.parent!==window)window.parent.postMessage({source:'fns-avatar-fabiano',type},'*')}
function setRequestState(active){requestInFlight=active;sendBtn.disabled=active;sendBtn.textContent=active?'Analisando...':'Iniciar Análise Crítica';if(active)statusText.textContent='Consultando a biblioteca...';setAvatar(active?AVATAR_DEBATENDO:AVATAR_PERFIL);notifyWidget(active?'request-start':'request-end')}
function renderSources(fontes){fontesLista.innerHTML='';if(!Array.isArray(fontes)||!fontes.length){fontesArea.style.display='none';return}for(const fonte of fontes){const item=document.createElement('div');item.className='source';const titulo=document.createElement('b');titulo.textContent=fonte.arquivo+(fonte.pagina?` — página ${fonte.pagina}`:'');const trecho=document.createElement('small');trecho.textContent=fonte.trecho||'';item.append(titulo,trecho);fontesLista.appendChild(item)}fontesArea.style.display='block'}
function buildAudioUrl(path){const url=new URL(path,API_URL);url.searchParams.set('_ts',String(Date.now()));return url.toString()}
async function enviarPergunta(){if(requestInFlight)return;const pergunta=input.value.trim();if(!pergunta)return;let finalStatus='Pronto para analisar';respostaArea.classList.remove('error');respostaArea.style.display='block';respostaArea.textContent='Consultando a biblioteca e estruturando a argumentação...';audioPlayer.pause();audioPlayer.removeAttribute('src');audioPlayer.load();audioPlayer.style.display='none';fontesArea.style.display='none';setRequestState(true);try{const response=await fetch(`${API_URL}/perguntar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pergunta})});let data={};try{data=await response.json()}catch(_e){}setRequestState(false);if(!response.ok)throw new Error(data.detail||`Falha HTTP ${response.status}`);respostaArea.textContent=data.resposta;renderSources(data.fontes);if(data.audio_url){audioPlayer.src=buildAudioUrl(data.audio_url);audioPlayer.load();audioPlayer.style.display='block';try{await audioPlayer.play()}catch(_e){}}finalStatus='Análise concluída'}catch(error){respostaArea.classList.add('error');respostaArea.textContent='Erro: '+error.message;finalStatus='Falha na análise'}finally{if(requestInFlight)setRequestState(false);statusText.textContent=finalStatus}}
sendBtn.addEventListener('click',enviarPergunta);input.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')enviarPergunta()});setAvatar(AVATAR_PERFIL);notifyWidget('request-end');'''

          tail_re = re.compile(
              r"const input=document\.getElementById\('perguntaInput'\).*?setAvatar\(AVATAR_PERFIL\);",
              re.S,
          )
          index, count = tail_re.subn(tail, index, count=1)
          if count != 1:
              raise SystemExit(f'Expected one application-script tail, replaced {count}')
          index_path.write_text(index, encoding='utf-8')

          widget = r'''(() => {
            if (window.__FNS_AVATAR_FABIANO_WIDGET__) return;
            window.__FNS_AVATAR_FABIANO_WIDGET__ = true;

            const API = 'https://avatar-fabiano-api.onrender.com';
            const API_ORIGIN = new URL(API).origin;
            const AVATAR_PERFIL = `${API}/static/avatar-fabiano-perfil.png`;
            const AVATAR_DEBATENDO = `${API}/static/avatar-fabiano-debatendo.png`;
            const STYLE_ID = 'fns-avatar-fabiano-widget-style';

            [AVATAR_PERFIL, AVATAR_DEBATENDO].forEach((src) => { const image = new Image(); image.src = src; });

            if (!document.getElementById(STYLE_ID)) {
              const style = document.createElement('style');
              style.id = STYLE_ID;
              style.textContent = `
                #fns-fabiano-launcher{position:fixed;right:22px;bottom:22px;z-index:2147483000;border:1px solid rgba(214,179,106,.65);background:#11151f;color:#f0d9a0;border-radius:999px;padding:7px 16px 7px 7px;font:700 14px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.38);cursor:pointer;display:flex;align-items:center;gap:10px;max-width:min(330px,calc(100vw - 24px))}
                #fns-fabiano-launcher-img{width:46px;height:46px;aspect-ratio:1/1;flex:0 0 46px;object-fit:cover;object-position:center;border-radius:50%;display:block;border:2px solid rgba(214,179,106,.72);transition:opacity .16s ease,transform .16s ease;will-change:opacity,transform}
                #fns-fabiano-launcher[data-avatar-state="debatendo"] #fns-fabiano-launcher-img{transform:scale(1.035)}
                #fns-fabiano-layer{position:fixed;inset:0;z-index:2147483001;background:rgba(2,4,8,.82);backdrop-filter:blur(5px);display:none;padding:18px}
                #fns-fabiano-layer[data-open="1"]{display:grid;place-items:center}
                #fns-fabiano-shell{width:min(1100px,100%);height:min(880px,94vh);background:#080a10;border:1px solid #343a48;border-radius:20px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.58);position:relative}
                #fns-fabiano-frame{width:100%;height:100%;border:0;background:#080a10}
                #fns-fabiano-close{position:absolute;right:12px;top:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid #444;background:rgba(8,10,16,.9);color:#fff;font:700 22px/1 system-ui;cursor:pointer}
                @media(max-width:700px){#fns-fabiano-launcher{right:12px;bottom:12px;padding:6px 13px 6px 6px}#fns-fabiano-launcher-img{width:40px;height:40px;flex-basis:40px;object-fit:cover;border-radius:50%}#fns-fabiano-layer{padding:0}#fns-fabiano-shell{width:100%;height:100vh;border-radius:0;border:0}}
              `;
              document.head.appendChild(style);
            }

            const launcher = document.createElement('button');
            launcher.id = 'fns-fabiano-launcher';
            launcher.type = 'button';
            launcher.dataset.avatarState = 'perfil';
            launcher.innerHTML = `<img id="fns-fabiano-launcher-img" src="${AVATAR_PERFIL}" alt=""><span>Avatar Fabiano • Livre Pensador</span>`;
            launcher.setAttribute('aria-haspopup', 'dialog');

            const layer = document.createElement('div');
            layer.id = 'fns-fabiano-layer';
            layer.setAttribute('role', 'dialog');
            layer.setAttribute('aria-modal', 'true');
            layer.setAttribute('aria-label', 'Avatar Fabiano — O Livre Pensador');
            layer.innerHTML = `<div id="fns-fabiano-shell"><button id="fns-fabiano-close" type="button" aria-label="Fechar">×</button><iframe id="fns-fabiano-frame" title="Avatar Fabiano — O Livre Pensador" src="${API}/" allow="autoplay"></iframe></div>`;

            const launcherImg = launcher.querySelector('#fns-fabiano-launcher-img');
            const frame = layer.querySelector('#fns-fabiano-frame');
            const setAvatarState = (state) => {
              const debating = state === 'debatendo';
              launcher.dataset.avatarState = debating ? 'debatendo' : 'perfil';
              const next = debating ? AVATAR_DEBATENDO : AVATAR_PERFIL;
              if (launcherImg.src !== next) launcherImg.src = next;
            };
            const open = () => { layer.dataset.open = '1'; document.documentElement.style.overflow = 'hidden'; };
            const close = () => { layer.dataset.open = '0'; document.documentElement.style.overflow = ''; setAvatarState('perfil'); launcher.focus(); };

            launcher.addEventListener('click', open);
            layer.addEventListener('click', (event) => { if (event.target === layer) close(); });
            layer.querySelector('#fns-fabiano-close').addEventListener('click', close);
            document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && layer.dataset.open === '1') close(); });
            frame.addEventListener('load', () => setAvatarState('perfil'));
            window.addEventListener('message', (event) => {
              if (event.origin !== API_ORIGIN || event.source !== frame.contentWindow) return;
              if (!event.data || event.data.source !== 'fns-avatar-fabiano') return;
              if (event.data.type === 'request-start') setAvatarState('debatendo');
              if (event.data.type === 'request-end') setAvatarState('perfil');
            });

            document.body.append(launcher, layer);
          })();
          '''
          (root / 'fns-avatar-widget.js').write_text(widget, encoding='utf-8')

          admin = r'''<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Admin — Avatar Fabiano</title>
            <style>
              *{box-sizing:border-box}body{font-family:Segoe UI,sans-serif;background:#0b0e14;color:#eee;margin:0;padding:24px}main{max-width:820px;margin:auto;display:grid;gap:18px}.card{background:#151a24;padding:24px;border-radius:16px;border:1px solid #303746}.admin-avatar{width:144px;height:144px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:3px solid #d6b36a;margin:0 auto 16px}.admin-avatar img{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%;display:block;transition:opacity .16s ease,transform .16s ease}.admin-avatar img.is-switching{opacity:.72;transform:scale(1.01)}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:9px;font:inherit}input,textarea{background:#202634;color:white;border:1px solid #414b60}textarea{min-height:96px;resize:vertical}button{border:0;background:#d6b36a;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}pre{white-space:pre-wrap;background:#0d1118;padding:14px;border-radius:10px;min-height:80px}small{color:#a9b0c0}audio{width:100%;margin-top:10px;display:none}.status{text-align:center;color:#f0d9a0;margin:0 0 8px}@media(max-width:700px){body{padding:12px}.card{padding:18px}.admin-avatar{width:120px;height:120px}.admin-avatar img{object-fit:cover;border-radius:50%}}
            </style>
          </head>
          <body><main>
            <section class="card">
              <div class="admin-avatar"><img id="adminAvatar" src="/static/avatar-fabiano-perfil.png" alt="Avatar Fabiano"></div>
              <p id="avatarStatus" class="status">Perfil — aguardando teste</p>
              <h1>Biblioteca do Avatar Fabiano</h1>
              <p>Envie um PDF para a memória vetorial. O token fica apenas nesta sessão do navegador.</p>
              <input id="token" type="password" placeholder="ADMIN_TOKEN">
              <input id="pdf" type="file" accept="application/pdf">
              <button id="upload" type="button">Enviar e indexar PDF</button>
              <button id="health" type="button">Ver status</button>
              <pre id="out">Pronto.</pre>
              <small>Não coloque o ADMIN_TOKEN no HTML nem no código do frontend.</small>
            </section>
            <section class="card">
              <h2>Validação visual /perguntar</h2>
              <p>Este teste usa o mesmo POST do usuário final: muda para “debatendo” no disparo e retorna ao “perfil” assim que a resposta HTTP termina.</p>
              <textarea id="testQuestion" placeholder="Digite uma pergunta curta para validar o fluxo..."></textarea>
              <button id="testAsk" type="button">Testar POST /perguntar</button>
              <pre id="testOut">Aguardando teste.</pre>
              <audio id="testAudio" controls></audio>
            </section>
          </main>
          <script>
            const AVATAR_PERFIL='/static/avatar-fabiano-perfil.png',AVATAR_DEBATENDO='/static/avatar-fabiano-debatendo.png';
            const out=document.getElementById('out'),adminAvatar=document.getElementById('adminAvatar'),avatarStatus=document.getElementById('avatarStatus'),testAudio=document.getElementById('testAudio'),testAsk=document.getElementById('testAsk'),testOut=document.getElementById('testOut');
            let requestInFlight=false;
            [AVATAR_PERFIL,AVATAR_DEBATENDO].forEach(src=>{const image=new Image();image.src=src});
            function setAvatar(src,label){if(adminAvatar.getAttribute('src')!==src){adminAvatar.classList.add('is-switching');adminAvatar.src=src;const settle=()=>adminAvatar.classList.remove('is-switching');if(adminAvatar.complete)requestAnimationFrame(settle);else adminAvatar.addEventListener('load',settle,{once:true})}avatarStatus.textContent=label}
            function setRequestState(active){requestInFlight=active;testAsk.disabled=active;setAvatar(active?AVATAR_DEBATENDO:AVATAR_PERFIL,active?'Debatendo — POST /perguntar em andamento':'Perfil — POST /perguntar concluído')}
            function buildAudioUrl(path){const url=new URL(path,location.origin);url.searchParams.set('_ts',String(Date.now()));return url.toString()}
            document.getElementById('health').onclick=async()=>{const r=await fetch('/health');out.textContent=JSON.stringify(await r.json(),null,2)};
            document.getElementById('upload').onclick=async()=>{const token=document.getElementById('token').value;const f=document.getElementById('pdf').files[0];if(!token||!f){out.textContent='Informe o token e escolha um PDF.';return}const fd=new FormData();fd.append('arquivo',f);out.textContent='Enviando e indexando...';const r=await fetch('/admin/upload-pdf',{method:'POST',headers:{'X-Admin-Token':token},body:fd});const d=await r.json();out.textContent=JSON.stringify(d,null,2)};
            testAsk.onclick=async()=>{if(requestInFlight)return;const pergunta=document.getElementById('testQuestion').value.trim();if(!pergunta){testOut.textContent='Digite uma pergunta para o teste.';return}testAudio.pause();testAudio.removeAttribute('src');testAudio.load();testAudio.style.display='none';testOut.textContent='POST em andamento...';setRequestState(true);try{const r=await fetch('/perguntar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pergunta})});let data={};try{data=await r.json()}catch(_e){}setRequestState(false);if(!r.ok)throw new Error(data.detail||`Falha HTTP ${r.status}`);testOut.textContent=data.resposta||'Resposta recebida.';if(data.audio_url){testAudio.src=buildAudioUrl(data.audio_url);testAudio.load();testAudio.style.display='block'}}catch(error){testOut.textContent='Erro: '+error.message}finally{if(requestInFlight)setRequestState(false)}};
            setAvatar(AVATAR_PERFIL,'Perfil — aguardando teste');
          </script>
          </body></html>
          '''
          (root / 'admin.html').write_text(admin, encoding='utf-8')
          PY

      - name: Validate visual contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('avatar-fabiano/static')
          index=(root/'index.html').read_text(encoding='utf-8')
          widget=(root/'fns-avatar-widget.js').read_text(encoding='utf-8')
          admin=(root/'admin.html').read_text(encoding='utf-8')
          for name in ('avatar-fabiano-perfil.png','avatar-fabiano-debatendo.png'):
              raw=(root/name).read_bytes()
              assert raw.startswith(b'\x89PNG\r\n\x1a\n'), name
          assert "AVATAR_PERFIL='/static/avatar-fabiano-perfil.png'" in index
          assert "AVATAR_DEBATENDO='/static/avatar-fabiano-debatendo.png'" in index
          assert 'object-fit:cover' in index and 'border-radius:50%' in index
          assert 'setRequestState(true)' in index and "fetch(`${API_URL}/perguntar`" in index and 'setRequestState(false)' in index
          assert "searchParams.set('_ts',String(Date.now()))" in index
          assert 'object-fit:cover' in widget and 'border-radius:50%' in widget
          assert "event.data.type === 'request-start'" in widget and "event.data.type === 'request-end'" in widget
          assert "fetch('/perguntar'" in admin and 'setRequestState(true)' in admin and 'setRequestState(false)' in admin
          assert "searchParams.set('_ts',String(Date.now()))" in admin
          print('Visual contract OK')
          PY
          node --check avatar-fabiano/static/fns-avatar-widget.js

      - name: Commit finalized visual module
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avatar-fabiano/static/index.html avatar-fabiano/static/admin.html avatar-fabiano/static/fns-avatar-widget.js avatar-fabiano/static/avatar-fabiano-perfil.png avatar-fabiano/static/avatar-fabiano-debatendo.png
          git diff --cached --quiet && exit 0
          git commit -m "Avatar Fabiano: finalize visual states and audio cache busting"
          git push origin HEAD:avatar-fabiano-production
