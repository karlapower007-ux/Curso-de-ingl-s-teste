name: Resolve Avatar Fabiano Worker URL

on:
  push:
    branches: [avatar-fabiano-production]
    paths:
      - '.github/workflows/resolve-avatar-worker-url.yml'

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve and probe live worker
        shell: bash
        run: |
          set -u
          JSON=$(curl --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          SUB=$(printf '%s' "$JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['subdomain'])")
          URL="https://avatar-fabiano-site.$SUB.workers.dev"
          echo "PUBLIC_URL=$URL"
          for PATHNAME in "/" "/admin" "/health"; do
            OUT="/tmp/out$(echo "$PATHNAME" | tr '/' '_').txt"
            CODE=$(curl --compressed --silent --show-error --max-time 30 -o "$OUT" -w '%{http_code}' "$URL$PATHNAME")
            BYTES=$(wc -c <"$OUT")
            echo "PATH=$PATHNAME STATUS=$CODE BYTES=$BYTES"
            head -c 260 "$OUT" || true
            echo
            echo "---"
          done
