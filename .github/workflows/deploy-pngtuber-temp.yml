name: Deploy Emma PNGTuber Temporary

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - '.github/workflows/deploy-pngtuber-temp.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Guard protected core and PNGTuber source
        run: |
          node --check public/emma-static.js
          APP_HASH=$(git hash-object public/app.js)
          WORKER_HASH=$(git hash-object src/index.js)
          test "$APP_HASH" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$WORKER_HASH" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('public/emma-static.js','utf8');
          const css=fs.readFileSync('public/emma-static.css','utf8');
          const html=fs.readFileSync('public/index.html','utf8');
          const fail=m=>{throw new Error(m)};
          for(const token of ['EMMA_FRAME_URLS','SILENCE_THRESHOLD','OPEN_THRESHOLD','--mouth-open','FNS_EMMA_PNGTUBER','image-swapping']){
            if(!js.includes(token))fail('PNGTuber token missing: '+token);
          }
          for(const forbidden of ['class ExpressionTurbine','class AvatarManager','class AvatarWatchdog','fns-smile-proportions','TRAVA ANTI-RISCO']){
            if(js.includes(forbidden)||html.includes(forbidden))fail('Legacy visual code still active: '+forbidden);
          }
          if(!css.includes('.avatar-mouth-motion'))fail('Legacy mouth CSS kill rule missing');
          if(!css.includes('display:none!important'))fail('Legacy visual layer kill rule missing');
          if(!html.includes('emma-static.js?v=20'))fail('PNGTuber cache-bust missing');
          console.log('QA PNGTUBER SOURCE PASS');
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate PNGTuber production DOM
        run: |
          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1100,deviceScaleFactor:1});
            await page.goto('https://fns-stt.karlapower007.workers.dev/?qa=pngtuber-v1',{waitUntil:'networkidle2',timeout:60000});
            await page.click('button[data-view="live"]');
            await page.waitForSelector('.card.teacher',{timeout:30000});
            const opened=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('.card.teacher')];
              const card=cards.find(x=>x.querySelector('h3')?.textContent?.trim()==='Emma');
              const button=card?.querySelector('button.primary');
              if(!button)return false;
              button.click();
              return true;
            });
            if(!opened)throw new Error('Emma could not be opened');
            await page.waitForSelector('#avatarFace.human-avatar #emmaPortrait',{timeout:30000});
            await page.waitForFunction(()=>!!window.FNS_EMMA_PNGTUBER,{timeout:30000});
            await new Promise(r=>setTimeout(r,500));

            const result=await page.evaluate(async()=>{
              const face=document.querySelector('#avatarFace.human-avatar');
              const portrait=document.querySelector('#emmaPortrait');
              const sample=async value=>{
                face.style.setProperty('--mouth-open',String(value));
                await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
                return window.FNS_EMMA_PNGTUBER.getState();
              };
              return {
                mouthExists:!!document.querySelector('.avatar-mouth-motion'),
                fxExists:!!document.querySelector('.avatar-fx-layer'),
                webglExists:!!document.querySelector('.avatar-webgl-layer'),
                rig:face.dataset.expressionRig,
                visualMode:face.dataset.avatarVisualMode,
                portraitSrc:portrait.getAttribute('src'),
                closed:await sample(0),
                talking:await sample(0.20),
                open:await sample(0.80)
              };
            });

            if(result.mouthExists)throw new Error('Legacy .avatar-mouth-motion still exists: '+JSON.stringify(result));
            if(result.fxExists)throw new Error('Legacy avatar-fx-layer still exists: '+JSON.stringify(result));
            if(result.webglExists)throw new Error('Legacy WebGL layer still exists: '+JSON.stringify(result));
            if(result.rig!=='pngtuber-v1'||result.visualMode!=='image-swapping')throw new Error('PNGTuber rig not active: '+JSON.stringify(result));
            if(result.closed.state!=='closed'||result.talking.state!=='talking'||result.open.state!=='open')throw new Error('Amplitude state switching failed: '+JSON.stringify(result));

            fs.writeFileSync('pngtuber-production-state.json',JSON.stringify(result,null,2));
            const avatar=await page.$('#avatarFace.human-avatar');
            await avatar.screenshot({path:'pngtuber-production-avatar.png'});
            console.log('QA PNGTUBER PRODUCTION PASS',JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload PNGTuber evidence
        uses: actions/upload-artifact@v4
        with:
          name: emma-pngtuber-evidence
          path: |
            fns-digital-human/worker/pngtuber-production-avatar.png
            fns-digital-human/worker/pngtuber-production-state.json
          if-no-files-found: error
