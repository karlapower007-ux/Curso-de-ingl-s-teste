name: QA split Windows 10 ISO small parts
on:
  push:
    branches: [professores-ia-qemu-bootstrap]

permissions:
  actions: read
  contents: read

jobs:
  split-win10-small:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win10e-iso-parts
          path: src
          repository: karlapower007-ux/Curso-de-ingl-s-teste
          run-id: 36065249477
          github-token: ${{ github.token }}
      - name: Reconstruct verified ISO and split small
        shell: bash
        run: |
          set -euo pipefail
          cat src/win10e.part.* > win10e.iso
          echo 'ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668  win10e.iso' | sha256sum -c -
          split -b 240M -d -a 2 win10e.iso small.part.
          sha256sum small.part.* > small.parts.sha256
          ls -lh small.part.*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('small.part.00') != '' }}
        with:
          name: win10e-small-00
          path: small.part.00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('small.part.01') != '' }}
        with:
          name: win10e-small-01
          path: small.part.01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
