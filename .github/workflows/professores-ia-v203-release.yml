name: Professores IA v2.0.3 corrected release

on:
  push:
    branches: [professores-ia-v203-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build corrected installer from accepted v2.0.2 core
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          rm -rf old release storage shared oem .v203-work
          mkdir -p old release storage shared oem
          unzip -q qa/Professores_IA_v2.0.2_FORBIDDEN_FIX.zip -d old
          setup="$(find old -type f -name '*.exe' -print -quit)"
          test -n "$setup"
          echo 'e88a737fd6f6a15490a00f6e7b8b7363d9427ad107b73114470d492b36f6408a  '"$setup" | sha256sum -c -
          gzip -dc patches/professores-v203-ui.patch.gz > /tmp/professores-v203-ui.patch
          python3 tools/build_professores_v203.py \
            --setup "$setup" \
            --patch /tmp/professores-v203-ui.patch \
            --out release/Professores_IA_v2.0.3_CORRIGIDO_Setup.exe

          node --check .v203-work/payload/static/app.js
          node --check .v203-work/payload/static/avatar-engine.js
          node --check .v203-work/payload/static/performance-engine.js

          grep -q "2.0.3-20260925" .v203-work/payload/static/app.js
          grep -q "onpointerdown" .v203-work/payload/static/app.js
          grep -q "pushHeld" .v203-work/payload/static/app.js
          grep -q "speechSynthesis" .v203-work/payload/static/app.js
          grep -q "Segure para falar" .v203-work/payload/static/app.js
          grep -q "visemes/" .v203-work/payload/static/avatar-engine.js
          ! grep -q "_createParametricMouth();" .v203-work/payload/static/avatar-engine.js
          ! grep -qF '.viseme-layer{display:none!important}' .v203-work/payload/static/styles.css
          grep -q ".ptt-control" .v203-work/payload/static/styles.css
          grep -q "professores-ia-v2.0.3" .v203-work/payload/static/sw.js
          grep -q "app.js?v=2.0.3" .v203-work/payload/static/index.html

          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.v203-work/payload')
          m=json.loads((root/'manifest.sha256.json').read_text(encoding='utf-8'))
          assert m.get('version') == '2.0.2', m.get('version')
          for rel, meta in m['files'].items():
              data=(root/rel).read_bytes()
              assert hashlib.sha256(data).hexdigest()==meta['sha256'], rel
              assert len(data)==meta['size'], rel
          print('MANIFEST: PASS')
          PY

          cp release/Professores_IA_v2.0.3_CORRIGIDO_Setup.exe oem/
          sha256sum release/Professores_IA_v2.0.3_CORRIGIDO_Setup.exe | tee release/Professores_IA_v2.0.3_CORRIGIDO_Setup.exe.sha256
          cat release/V203_BUILD.json

      - name: Prepare Windows 10 x64 acceptance test
        shell: bash
        run: |
          set -euo pipefail
          cat > oem/install.bat <<'BAT'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\OEM\acceptance-v203.ps1 > C:\OEM\guest-test-v203.log 2>&1
          exit /b %ERRORLEVEL%
          BAT

          cat > oem/acceptance-v203.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $out='C:\QAResults'
          New-Item -ItemType Directory -Force $out | Out-Null
          $result=[ordered]@{
            schema=5
            release='2.0.3-20260925'
            pass=$false
            checks=[ordered]@{}
            installer_checks=$null
            provider_ready=$null
            setup_sha256=$null
            error=$null
          }
          try {
            $os=Get-CimInstance Win32_OperatingSystem
            $cs=Get-CimInstance Win32_ComputerSystem
            $root=Join-Path $env:LOCALAPPDATA 'ProfessoresIA'
            $desktop=[Environment]::GetFolderPath('Desktop')
            $result.os=$os|Select-Object Caption,Version,BuildNumber,OSArchitecture,ProductType
            $result.checks.client_x64=($os.ProductType -eq 1 -and $cs.SystemType -eq 'x64-based PC' -and $os.Caption -match 'Windows (10|11)')
            $result.checks.no_prior_install=(!(Test-Path $root))
            $result.checks.no_prior_data=(!(Test-Path (Join-Path $env:APPDATA 'ProfessoresIA')))
            $result.checks.no_prior_shortcut=(!(Test-Path (Join-Path $desktop 'Professores IA.lnk')))
            if($result.checks.Values -contains $false){throw 'Clean Windows client baseline failed'}

            $setup='C:\OEM\Professores_IA_v2.0.3_CORRIGIDO_Setup.exe'
            $result.setup_sha256=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
            Start-Process -FilePath $setup | Out-Null

            $acceptancePath=Join-Path $root 'evidence\acceptance-schema4.json'
            $deadline=(Get-Date).AddMinutes(8)
            while(!(Test-Path $acceptancePath) -and (Get-Date) -lt $deadline){Start-Sleep -Seconds 2}
            if(!(Test-Path $acceptancePath)){throw 'Installer produced no schema 4 evidence'}
            Start-Sleep -Seconds 3

            Copy-Item $acceptancePath (Join-Path $out 'installer-acceptance-schema4.json')
            $acceptance=Get-Content $acceptancePath -Raw | ConvertFrom-Json
            $result.checks.installer_schema4=($acceptance.schema -eq 4 -and $acceptance.pass -eq $true)
            $result.installer_checks=$acceptance.checks

            $page=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/' -TimeoutSec 20
            $app=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/static/app.js' -TimeoutSec 20
            $avatar=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/static/avatar-engine.js' -TimeoutSec 20
            $css=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/static/styles.css' -TimeoutSec 20
            $sw=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/static/sw.js' -TimeoutSec 20
            $index=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8789/static/index.html' -TimeoutSec 20
            $health=Invoke-RestMethod 'http://127.0.0.1:8789/api/health' -TimeoutSec 20
            try {$cfg=Invoke-RestMethod 'http://127.0.0.1:8789/api/config' -TimeoutSec 20; $result.provider_ready=[bool]$cfg.provider_ready} catch {}

            $result.checks.root_http200=($page.StatusCode -eq 200 -and $page.Content -match 'Professores IA')
            $result.checks.app_build_203=($app.StatusCode -eq 200 -and $app.Content -match '2\.0\.3-20260925')
            $result.checks.walkie_talkie_present=($app.Content -match 'onpointerdown' -and $app.Content -match 'pushHeld' -and $app.Content -match 'Segure para falar')
            $result.checks.voice_capture_code=($app.Content -match 'getUserMedia' -and $app.Content -match 'AudioContext' -and $app.Content -match 'WebSocket')
            $result.checks.tts_fallback_code=($app.Content -match 'speechSynthesis' -and $app.Content -match 'SpeechSynthesisUtterance')
            $result.checks.real_viseme_layer=($avatar.Content -match 'visemes/' -and $avatar.Content -notmatch '_createParametricMouth\(\);')
            $result.checks.no_fake_mouth_css=($css.Content -notmatch 'viseme-layer\{display:none!important\}' -and $css.Content -notmatch '\.parametric-mouth\{')
            $result.checks.ptt_css=($css.Content -match '\.ptt-control' -and $css.Content -match 'touch-action:none')
            $result.checks.cache_busted=($sw.Content -match 'professores-ia-v2\.0\.3' -and $index.Content -match 'app\.js\?v=2\.0\.3')
            $result.checks.health_ok=($health.ok -eq $true)
            $result.checks.desktop_shortcut=(Test-Path (Join-Path $desktop 'Professores IA.lnk'))

            try {
              $voice=New-Object -ComObject SAPI.SpVoice
              $voices=@($voice.GetVoices())
              $result.checks.windows_tts_engine=($voices.Count -gt 0)
            } catch {
              $result.checks.windows_tts_engine=$false
            }

            $result.pass=($result.checks.Values -notcontains $false)
            $health | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $out 'health.json') -Encoding UTF8
            $app.Content | Set-Content (Join-Path $out 'served-app.js') -Encoding UTF8
            $avatar.Content | Set-Content (Join-Path $out 'served-avatar-engine.js') -Encoding UTF8
            $css.Content | Set-Content (Join-Path $out 'served-styles.css') -Encoding UTF8
          } catch {
            $result.error=$_.Exception.Message
          } finally {
            $result | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $out 'independent-acceptance-v203.json') -Encoding UTF8
            if(Test-Path (Join-Path $env:LOCALAPPDATA 'ProfessoresIA\evidence')){
              Copy-Item (Join-Path $env:LOCALAPPDATA 'ProfessoresIA\evidence\*') $out -Recurse -Force
            }
            $deadline=(Get-Date).AddMinutes(2)
            while(!(Test-Path 'Z:\') -and (Get-Date) -lt $deadline){Start-Sleep -Seconds 2}
            if(Test-Path 'Z:\'){
              Copy-Item "$out\*" 'Z:\' -Recurse -Force
              Set-Content 'Z:\QA_DONE.txt' 'DONE' -Encoding ASCII
            }
            shutdown.exe /s /t 10 /f
          }
          PS1

      - name: Execute corrected installer in clean Windows 10 x64 client
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name professores-v203 \
            --device=/dev/kvm --device=/dev/net/tun \
            --cap-add NET_ADMIN --cap-add NET_RAW \
            -e VERSION=ltsc10 -e RAM_SIZE=6G -e CPU_CORES=4 -e DISK_SIZE=28G \
            -e USERNAME=QA -e PASSWORD='QaPass!234' -e REGION=en-US -e KEYBOARD=en-US \
            -e LOG=Y -e SHUTDOWN=Y \
            -v "$PWD/storage:/storage" -v "$PWD/shared:/shared" -v "$PWD/oem:/oem" \
            --stop-timeout 120 \
            dockurr/windows@sha256:0cff9eb0e7aee9953e55bc682852ca4fdca233145a58ae1ec94f0b0c01a2ed30

          deadline=$((SECONDS+1500))
          while ((SECONDS < deadline)); do
            if [ -f shared/QA_DONE.txt ]; then break; fi
            if ! docker ps --format '{{.Names}}' | grep -qx professores-v203; then
              docker logs professores-v203
              exit 42
            fi
            sleep 10
          done
          test -f shared/QA_DONE.txt
          cat shared/independent-acceptance-v203.json

          python3 - <<'PY'
          import json
          with open('shared/independent-acceptance-v203.json', encoding='utf-8-sig') as f:
              r=json.load(f)
          assert r['schema']==5, r
          assert r['release']=='2.0.3-20260925', r
          assert r['pass'] is True, r
          assert all(v is True for v in r['checks'].values()), r
          ic=r.get('installer_checks') or {}
          for key in ('clean_install','first_run','payload_manifest','rollback_failure_detected','rollback_restored','runtime_self_test','shortcuts_created','x64_os'):
              assert ic.get(key) is True, (key,ic)
          print('WINDOWS V2.0.3 ACCEPTANCE: PASS')
          PY

      - name: Package only after corrected Windows acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          cp release/Professores_IA_v2.0.3_CORRIGIDO_Setup.exe final/
          cp release/V203_BUILD.json final/
          cp shared/independent-acceptance-v203.json final/WINDOWS_ACCEPTANCE_V203.json
          cp shared/installer-acceptance-schema4.json final/INSTALLER_ACCEPTANCE_SCHEMA4.json
          cat > final/LEIA-ME.txt <<'TXT'
          PROFESSORES IA v2.0.3 CORRIGIDO

          Esta entrega substitui a v2.0_FINAL anterior, que reutilizava o executável v2.0.2.

          Correções verificadas nesta build:
          - removida a boca SVG/patch que causava aparência de tampão e deslocamento;
          - visemas reais reativados sobre o rosto;
          - botão de fala em modo walkie-talkie: segure para falar e solte para enviar;
          - captura de microfone permanece restrita ao período em que o botão está pressionado;
          - reprodução de áudio em tempo real preservada;
          - fallback TTS do navegador/Windows incluído quando não chegam chunks de áudio remoto;
          - cache da interface versionado em 2.0.3.

          O núcleo do instalador 2.0.2 aprovado foi preservado; o payload visual foi reconstruído,
          re-hashado e aceito novamente em Windows 10 x64 cliente real.
          TXT
          (cd final && zip -q -9 ../Professores_IA_v2.0.3_CORRIGIDO.zip ./*)
          sha256sum Professores_IA_v2.0.3_CORRIGIDO.zip > Professores_IA_v2.0.3_CORRIGIDO.zip.sha256
          cat release/V203_BUILD.json
          cat Professores_IA_v2.0.3_CORRIGIDO.zip.sha256

      - name: Save VM diagnostics
        if: always()
        shell: bash
        run: |
          docker logs professores-v203 > shared/container-v203.log 2>&1 || true
          docker stop -t 120 professores-v203 || true

      - name: Upload corrected final release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Professores_IA_v2.0.3_CORRIGIDO
          path: |
            Professores_IA_v2.0.3_CORRIGIDO.zip
            Professores_IA_v2.0.3_CORRIGIDO.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload v2.0.3 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professores-ia-v203-windows-evidence
          path: shared/
          if-no-files-found: warn
          retention-days: 14
