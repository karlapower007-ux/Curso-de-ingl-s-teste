name: Deploy Consciência Fabiano V10 Production Safely

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths:
      - "consciencia-fabiano/**"
      - ".github/workflows/qa-cloudflare-native-rag.yml"
      - ".github/workflows/v80-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: consciencia-cloudflare-native-production
  cancel-in-progress: false

jobs:
  preflight-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout promoted production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preserve library data and migration boundaries
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -n "$BEFORE_SHA"
          git diff --exit-code "$BEFORE_SHA"...HEAD -- \
            consciencia-fabiano/public/failover-v3.js \
            consciencia-fabiano/public/sw-v3.js \
            consciencia-fabiano/public/biblioteca_backup.json \
            consciencia-fabiano/public/biblioteca_backup
          CHANGED="$(git diff --name-only "$BEFORE_SHA"...HEAD)"
          if printf '%s\n' "$CHANGED" | grep -Eq '^consciencia-fabiano/supabase/migrations/'; then
            echo "Protected Supabase migration path changed; refusing deploy."
            exit 1
          fi
          echo "LIBRARY_PRESERVATION_GATE=pass"

      - name: Install existing development dependency set
        working-directory: consciencia-fabiano
        run: npm install --ignore-scripts

      - name: Run complete legacy plus V8 acceptance suite
        working-directory: consciencia-fabiano
        run: |
          npm run check
          npm run test:adaptive-v80

      - name: Verify no paid dependency was introduced
        working-directory: consciencia-fabiano
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.hard_guards.paid_dependency_required' v8-preservation-manifest.json)" = "false"
          test "$(jq -r '.library.reindex_required' v8-preservation-manifest.json)" = "false"
          test "$(jq -r '.hard_guards.pre_final_llm_calls' v8-preservation-manifest.json)" = "0"
          echo "V10_ZERO_COST_AND_LOAD_GUARD=pass"

      - name: Arm rollback after all preflight gates pass
        shell: bash
        run: echo "DEPLOY_ARMED=true" >> "$GITHUB_ENV"

      - name: Deploy official Worker
        working-directory: consciencia-fabiano
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FABIANO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FABIANO_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          # Do not trust a stale Account ID secret. Discover the account that the authenticated
          # Fabiano token can actually see, then deploy the existing Worker in that account.
          ACCOUNTS="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")"
          DISCOVERED_ACCOUNT_ID="$(printf '%s' "$ACCOUNTS" | jq -r '.result[0].id // empty')"
          test -n "$DISCOVERED_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$DISCOVERED_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_DISCOVERY=pass"
          npx wrangler deploy

      - name: Remove retired external-provider secrets
        working-directory: consciencia-fabiano
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FABIANO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FABIANO_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNTS="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts?per_page=50" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")"
          DISCOVERED_ACCOUNT_ID="$(printf '%s' "$ACCOUNTS" | jq -r '.result[0].id // empty')"
          test -n "$DISCOVERED_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$DISCOVERED_ACCOUNT_ID"
          printf '%s' '{"GEMINI_API_KEY":null,"GOOGLE_API_KEY":null,"XAI_API_KEY":null,"GROK_API_KEY":null}' | npx wrangler secret bulk >/dev/null || true
          echo "RETIRED_PROVIDER_SECRETS=removed-or-absent"

      - name: Verify V10 production endpoint
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          OK=false
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 20 https://consciencia-fabiano.focoeepoder2.workers.dev/health/deploy || true)"
            VERSION="$(printf '%s' "$BODY" | jq -r '.version // ""' 2>/dev/null || true)"
            HEALTH="$(printf '%s' "$BODY" | jq -r '.ok // false' 2>/dev/null || true)"
            if [ "$HEALTH" = "true" ] && [ "$VERSION" = "10.0.0-zero-cost-private-offline-online" ]; then
              OK=true
              break
            fi
            sleep 3
          done
          test "$OK" = "true"
          echo "V10_PRODUCTION_ENDPOINT=healthy"
          printf '%s' "$BODY" | jq -e '
            .zero_cost_guard == true and
            .external_privacy_gate == true and
            .external_models_receive_original_files == false and
            .external_models_receive_full_library == false and
            .full_offline_mode_supported == true and
            .workers_ai_used == true and
            (.provider_chain|index("groq-20b") != null) and
            (.provider_chain|index("groq-120b") != null) and
            (.provider_chain|index("workers-ai") != null) and
            (.provider_chain|index("offline-local") != null)
          ' >/dev/null
          curl -fsS --max-time 20 https://consciencia-fabiano.focoeepoder2.workers.dev/ -o /tmp/fabiano-home.html
          grep -Fq 'Dicionário / Enciclopédia' /tmp/fabiano-home.html
          grep -Fq '100% offline' /tmp/fabiano-home.html
          echo "V10_DICTIONARY_UI=visible"
          echo "V10_OFFLINE_ONLINE_UI=visible"
          # Functional dictionary acceptance: real production route, strict lock, paging contract, no technical metadata.
          DICT_HTTP="$(curl -sS --max-time 45 -o /tmp/v10-dictionary.json -w '%{http_code}' -X POST https://consciencia-fabiano.focoeepoder2.workers.dev/api/dictionary/search -H 'Content-Type: application/json' --data '{"query":"Adão","page":1,"page_size":50}' || true)"
          if [ "$DICT_HTTP" != "200" ]; then
            echo "V10_DICTIONARY_HTTP=$DICT_HTTP"
            jq -c '{ok,code,message}' /tmp/v10-dictionary.json 2>/dev/null || head -c 1200 /tmp/v10-dictionary.json
            exit 1
          fi
          DICT="$(cat /tmp/v10-dictionary.json)"
          printf '%s' "$DICT" | jq -e '.ok == true and .strict_focus_lock == true and .intent_lock == true and .evidence_lock == true and .page == 1 and .page_size == 50 and (.matches|type=="array") and (.total > 0) and ((.matches|length) > 0) and (.encyclopedia_index == "sqlite-fts5" or .encyclopedia_index == "strict-scan-fallback")' >/dev/null
          if printf '%s' "$DICT" | grep -Eqi '"(filename|document_id|chunk_index)"[[:space:]]*:|Standard Works|Obras Padrão'; then
            echo "Technical metadata leaked from dictionary"
            exit 1
          fi
          # Verify the browser-facing asset itself calls the public /api route.
          APP_JS="$(curl -fsS --max-time 20 "https://consciencia-fabiano.focoeepoder2.workers.dev/app.js?v=${GITHUB_SHA}")"
          grep -Fq 'api("/api/dictionary/search"' <<<"$APP_JS"
          grep -Fq 'OPERATING_MODE_KEY = "fns_operating_mode_v10"' <<<"$APP_JS"
          grep -Fq 'offlineDictionarySearch' <<<"$APP_JS"
          if grep -Eqi 'gemini|api\.x\.ai' <<<"$APP_JS"; then
            echo "Retired provider leaked into browser asset"
            exit 1
          fi
          if grep -Fq 'api("/dictionary/search"' <<<"$APP_JS"; then
            echo "Stale browser dictionary route detected"
            exit 1
          fi
          echo "V10_DICTIONARY_BROWSER_ROUTE=pass"
          echo "V10_DICTIONARY_FUNCTIONAL=pass"

      - name: Roll back Worker to previous production commit on failure
        if: failure() && env.DEPLOY_ARMED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FABIANO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FABIANO_CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROLLBACK_SHA"
          git checkout --force "$ROLLBACK_SHA"
          cd consciencia-fabiano
          npm install --ignore-scripts
          ACCOUNTS="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts?per_page=50" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")"
          DISCOVERED_ACCOUNT_ID="$(printf '%s' "$ACCOUNTS" | jq -r '.result[0].id // empty')"
          test -n "$DISCOVERED_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="$DISCOVERED_ACCOUNT_ID"
          npx wrangler deploy
          echo "V10_AUTOMATIC_WORKER_ROLLBACK=executed"
