name: E2E Consciência Fabiano on Fabiano Cloudflare

on:
  push:
    branches: [consciencia-fabiano-fabiano-cloudflare]
    paths:
      - 'consciencia-fabiano/scripts/e2e-production.mjs'
      - '.github/workflows/e2e-consciencia-fabiano-fabiano.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://consciencia-fabiano.focoeepoder2.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-fabiano-fabiano-cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('fns-consciencia-fabiano-e2e');
            core.setSecret(token);
            core.exportVariable('OIDC_TOKEN', token);
      - name: Run full production E2E
        working-directory: consciencia-fabiano
        run: node scripts/e2e-production.mjs
