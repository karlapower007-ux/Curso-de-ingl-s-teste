name: Audit FNS Git History

on:
  push:
    branches:
      - estudos-profundos-fns-v33-golden-20260920
    paths:
      - ".github/workflows/audit-fns-git-history.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all refs and history for ChatGPT Site linkage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune

          echo "=== REFS CONTAINING HOSTING FILES ==="
          FOUND=0
          while read -r ref; do
            for p in .openai/hosting.json .openai/site.json hosting.json chatgpt-site.json; do
              if git cat-file -e "$ref:$p" 2>/dev/null; then
                echo "REF=$ref PATH=$p"
                git show "$ref:$p"
                FOUND=1
              fi
            done
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin refs/heads refs/tags)
          [ "$FOUND" -eq 1 ] || echo "NO_HOSTING_LINK_FILE_IN_ANY_REF"

          echo "=== COMMITS THAT EVER TOUCHED HOSTING FILES ==="
          git log --all --oneline -- .openai/hosting.json .openai/site.json hosting.json chatgpt-site.json || true

          echo "=== HISTORY DOMAIN HITS ==="
          git log --all -S'estudos-profundos-fns.karlapower007.chatgpt.site'             --oneline --all -- . ':!.github/workflows/audit-fns-git-history.yml' || true

          echo "=== HISTORY APPGPRJ HITS ==="
          git log --all -G'appgprj_[A-Za-z0-9]+'             --oneline --all -- . ':!.github/workflows/audit-fns-git-history.yml' || true

          echo "=== CURRENT REF FILE HITS ==="
          git grep -n -E 'estudos-profundos-fns\.karlapower007\.chatgpt\.site|appgprj_|source_version_number|projection_revision'             $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/heads refs/tags) --             ':!.github/workflows/audit-fns-git-history.yml' 2>/dev/null | head -n 300 || true
