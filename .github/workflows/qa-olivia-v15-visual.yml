name: QA Olivia V15 Visual Screenshot (Manual)

# Pixel-level V15 QA now runs inside deploy-fns-worker.yml after deployment.
# Keeping this workflow manual avoids duplicate production browsers and removes
# the old naturalWidth-only test that missed a visually black avatar.
on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: V15 visual QA location
        run: |
          echo 'The authoritative Olivia V15 pixel test is part of Deploy FNS Worker.'
          echo 'It verifies real rendered pixels and blocks /tts, /stt and /chat during visual QA.'
