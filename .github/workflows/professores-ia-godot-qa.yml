name: Professores IA Godot Free QA

on:
  push:
    branches:
      - professores-ia-godot-free-v220
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-runtime-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate avatar contract
        run: python qa/test_godot_avatar_contract.py

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64*' | head -n1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Parse project and scripts in real Godot
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Run avatar scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 5
