name: Autonomous Cloudflare Native Release

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths:
      - 'consciencia-fabiano/**'
      - '.github/workflows/autonomous-cloudflare-native-release.yml'
  workflow_dispatch:

concurrency:
  group: consciencia-cloudflare-native-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: consciencia-fabiano
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_RAG_SEARCH_URL: ${{ secrets.SUPABASE_RAG_SEARCH_URL }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_UPSERT_URL: ${{ secrets.PINECONE_UPSERT_URL }}
      PINECONE_QUERY_URL: ${{ secrets.PINECONE_QUERY_URL }}
      VERCEL_STANDBY_URL: ${{ secrets.VERCEL_STANDBY_URL }}
      DENO_STANDBY_URL: ${{ secrets.DENO_STANDBY_URL }}
      SECONDARY_STANDBY_URL: ${{ secrets.SECONDARY_STANDBY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Autonomous provision and deploy
        run: bash ./scripts/autonomous-release.sh
