name: Bootstrap Consciência Fabiano
on:
  push:
    branches: [consciencia-do-fabiano]
    paths: ['.github/workflows/bootstrap-consciencia-fabiano.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check reusable secrets and Render backend
        shell: bash
        env:
          HAS_OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          HAS_FNS_OWNER_PASSWORD: ${{ secrets.FNS_OWNER_PASSWORD }}
          HAS_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HAS_RENDER_ADMIN_TOKEN: ${{ secrets.RENDER_ADMIN_TOKEN }}
          HAS_FABIANO_ADMIN_TOKEN: ${{ secrets.FABIANO_ADMIN_TOKEN }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bool(){ [ -n "$1" ] && echo yes || echo no; }
          echo "OWNER_PASSWORD=$(bool "$HAS_OWNER_PASSWORD")"
          echo "FNS_OWNER_PASSWORD=$(bool "$HAS_FNS_OWNER_PASSWORD")"
          echo "ADMIN_TOKEN=$(bool "$HAS_ADMIN_TOKEN")"
          echo "RENDER_ADMIN_TOKEN=$(bool "$HAS_RENDER_ADMIN_TOKEN")"
          echo "FABIANO_ADMIN_TOKEN=$(bool "$HAS_FABIANO_ADMIN_TOKEN")"
          echo "CLOUDFLARE_API_TOKEN=$(bool "$HAS_CF_TOKEN")"
          echo "CLOUDFLARE_ACCOUNT_ID=$(bool "$HAS_CF_ACCOUNT")"
          echo "=== Render /health ==="
          curl -sS --max-time 45 https://avatar-fabiano-api.onrender.com/health || true
