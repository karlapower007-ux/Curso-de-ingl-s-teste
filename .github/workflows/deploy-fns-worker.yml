name: Deploy FNS Worker

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fns-digital-human/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Protect Emma core and validate Olivia V7
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v6.js
          node --check src/strict-output-v7.js
          node --check public/app.js
          node --check public/natural-state.js
          node --check public/natural-turns.js
          node --check public/olivia-core-v7.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' public/index.html
          grep -q '"main": "src/strict-output-v7.js"' wrangler.jsonc
          grep -q 'olivia-core-v7.js?v=7' public/index.html
          grep -q 'olivia-v7.css?v=7' public/index.html
          ! grep -q 'olivia-core-v6.js?v=6' public/index.html
          ! grep -q 'MutationObserver' public/olivia-core-v7.js
          grep -q "document.body.appendChild(p)" public/olivia-core-v7.js
          echo 'CORE LOCK + OLIVIA V7 SOURCE PASS'

      - name: Validate turbines A-O and lossless Hi-Fi
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const front=fs.readFileSync('public/olivia-core-v7.js','utf8');
          const back=fs.readFileSync('src/strict-output-v7.js','utf8');
          for(const letter of 'ABCDEFGHIJKLMNO'){
            if(!front.includes(letter+':{label:'))throw new Error('frontend turbine missing '+letter);
            if(!back.includes(letter+':{speaker:'))throw new Error('backend turbine missing '+letter);
          }
          if(!back.includes("@cf/deepgram/aura-2-es"))throw new Error('Aura-2 Spanish missing');
          if(!back.includes("encoding:'linear16',container:'wav'"))throw new Error('lossless Hi-Fi turbines missing');
          if(!front.includes("browser-fallback-"))throw new Error('fast browser fallback missing');
          console.log('TURBINES A-O PASS');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v7-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA production Olivia V7 and Emma lock
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'

          curl --compressed --fail --silent --show-error "$BASE/?olivia=v7&qa=source" -o production.html
          grep -q 'olivia-core-v7.js?v=7' production.html
          grep -q 'olivia-v7.css?v=7' production.html
          grep -q 'FNS FINAL FIX: MOTOR PNGTUBER DA EMMA' production.html

          for f in olivia-fechada.png olivia-falando.png olivia-aberta.png; do
            curl --compressed --fail --silent --show-error -o "$f" "$BASE/assets/$f?v=v7-20260917"
          done
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const hashes=new Set();
          for(const f of ['olivia-fechada.png','olivia-falando.png','olivia-aberta.png']){
            const b=fs.readFileSync(f);
            if(b[0]!==0x89||b[1]!==0x50||b[2]!==0x4e||b[3]!==0x47)throw new Error(f+' invalid');
            hashes.add(crypto.createHash('sha256').update(b).digest('hex'));
          }
          if(hashes.size!==3)throw new Error('Olivia frames not distinct');
          console.log('PRODUCTION OLIVIA ASSETS PASS');
          NODE

          curl --compressed --fail --silent --show-error --max-time 15 -D turbine-a.headers -o turbine-a.audio \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hola. Bienvenido a nuestra práctica de español.","teacher":"Olivia","voice_turbine":"A"}' \
            "$BASE/tts"
          test -s turbine-a.audio
          grep -iq '^x-fns-voice-turbine: A' turbine-a.headers

          curl --compressed --fail --silent --show-error --max-time 15 -D turbine-k.headers -o turbine-k.audio \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hola. Vamos a practicar la pronunciación con calma.","teacher":"Olivia","voice_turbine":"K"}' \
            "$BASE/tts"
          test -s turbine-k.audio
          grep -iq '^x-fns-voice-turbine: K' turbine-k.headers
          echo 'PRODUCTION TTS TURBINES A + K PASS'

          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            await page.goto('https://fns-stt.karlapower007.workers.dev/?olivia=v7&qa=portal',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('#liteModal[data-olivia-v7="true"]',{timeout:30000});
            await page.waitForSelector('#oliviaAvatarPortalV7',{timeout:30000});
            const health=await page.evaluate(()=>window.FNS_OLIVIA_V7?.health());
            if(!health?.portalBodyChild||!health?.portalOutsideModal||health?.turbineCount!==15)throw new Error('V7 portal/turbine health failed '+JSON.stringify(health));
            if(!health?.imageLoaded)throw new Error('V7 avatar image not loaded '+JSON.stringify(health));
            const options=await page.evaluate(()=>[...document.querySelectorAll('#voiceTurbineSel option')].map(o=>o.value).join(''));
            if(options!=='ABCDEFGHIJKLMNO')throw new Error('A-O selector mismatch '+options);
            const stable=await page.evaluate(async()=>{
              const p=document.getElementById('oliviaAvatarPortalV7');
              const stage=document.getElementById('oliviaV7Stage');
              if(stage)stage.replaceChildren(document.createElement('div'));
              await new Promise(r=>setTimeout(r,300));
              const now=document.getElementById('oliviaAvatarPortalV7');
              return {same:now===p,parentBody:now?.parentElement===document.body,insideModal:document.querySelector('#liteModal')?.contains(now)};
            });
            if(!stable.same||!stable.parentBody||stable.insideModal)throw new Error('Body portal became unstable '+JSON.stringify(stable));
            const emma=await page.evaluate(()=>({pngtuber:!!window.FNS_EMMA_PNGTUBER,strict:!!window.FNS_EMMA_STRICT_OUTPUT}));
            if(!emma.pngtuber||!emma.strict)throw new Error('Emma guards missing '+JSON.stringify(emma));
            console.log('PRODUCTION V7 DOM PORTAL PASS',health,stable,emma);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final status
        run: echo 'DEPLOY PASS - Olivia V7 body portal stable; turbines A-O active; Emma/core unchanged'
