<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Avatar Fabiano</title><style>body{font-family:Segoe UI,sans-serif;background:#0b0e14;color:#eee;margin:0;padding:24px}main{max-width:720px;margin:auto;background:#151a24;padding:24px;border-radius:16px;border:1px solid #303746}input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:9px}input{background:#202634;color:white;border:1px solid #414b60}button{border:0;background:#d6b36a;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;background:#0d1118;padding:14px;border-radius:10px;min-height:80px}small{color:#a9b0c0}</style></head><body><main><h1>Biblioteca do Avatar Fabiano</h1><p>Envie um PDF para a memória vetorial. O token fica apenas nesta sessão do navegador.</p><input id="token" type="password" placeholder="ADMIN_TOKEN"><input id="pdf" type="file" accept="application/pdf"><button id="upload">Enviar e indexar PDF</button><button id="health">Ver status</button><pre id="out">Pronto.</pre><small>Não coloque o ADMIN_TOKEN no HTML nem no código do frontend.</small><script>const out=document.getElementById('out');document.getElementById('health').onclick=async()=>{const r=await fetch('/health');out.textContent=JSON.stringify(await r.json(),null,2)};document.getElementById('upload').onclick=async()=>{const token=document.getElementById('token').value;const f=document.getElementById('pdf').files[0];if(!token||!f){out.textContent='Informe o token e escolha um PDF.';return}const fd=new FormData();fd.append('arquivo',f);out.textContent='Enviando e indexando...';const r=await fetch('/admin/upload-pdf',{method:'POST',headers:{'X-Admin-Token':token},body:fd});const d=await r.json();out.textContent=JSON.stringify(d,null,2)};</script></main></body></html>
