name: Retry Cloudflare provision after R2 activation

on:
  push:
    branches: [consciencia-cloudflare-native-v1]
    paths: ['.github/workflows/retry-cloudflare-provision-after-r2.yml']

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: consciencia-fabiano
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-cloudflare-native-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Retry native resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          echo "=== R2 ==="
          npx wrangler r2 bucket list > /tmp/r2-list.txt 2>&1
          cat /tmp/r2-list.txt
          if grep -q 'consciencia-fabiano-pdfs' /tmp/r2-list.txt; then
            echo "R2_READY=yes" | tee -a /tmp/result.env
          else
            npx wrangler r2 bucket create consciencia-fabiano-pdfs > /tmp/r2-create.txt 2>&1
            rc=$?
            cat /tmp/r2-create.txt
            if [ "$rc" = "0" ]; then echo "R2_READY=yes" | tee -a /tmp/result.env; else echo "R2_READY=no" | tee -a /tmp/result.env; fi
          fi

          echo "=== VECTORIZE ==="
          npx wrangler vectorize get consciencia-fabiano-rag > /tmp/vectorize-get.txt 2>&1
          vc=$?
          cat /tmp/vectorize-get.txt
          if [ "$vc" = "0" ]; then
            echo "VECTORIZE_READY=yes" | tee -a /tmp/result.env
          else
            npx wrangler vectorize create consciencia-fabiano-rag --dimensions=1024 --metric=cosine > /tmp/vectorize-create.txt 2>&1
            vcc=$?
            cat /tmp/vectorize-create.txt
            if [ "$vcc" = "0" ]; then echo "VECTORIZE_READY=yes" | tee -a /tmp/result.env; else echo "VECTORIZE_READY=no" | tee -a /tmp/result.env; fi
          fi

          echo "=== D1 ==="
          npx wrangler d1 list --json > /tmp/d1-list.json 2>/tmp/d1-list.err
          dc=$?
          cat /tmp/d1-list.err
          cat /tmp/d1-list.json
          if [ "$dc" = "0" ]; then
            DB_ID=$(jq -r '.[] | select(.name=="consciencia-fabiano-rag-db") | (.uuid // .id)' /tmp/d1-list.json | head -1)
            if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
              npx wrangler d1 create consciencia-fabiano-rag-db --json > /tmp/d1-create.json 2>/tmp/d1-create.err
              dcc=$?
              cat /tmp/d1-create.err
              cat /tmp/d1-create.json
              if [ "$dcc" = "0" ]; then
                DB_ID=$(jq -r '.uuid // .id // .database_id // .d1_databases[0].database_id // empty' /tmp/d1-create.json | head -1)
              fi
            fi
            if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
              echo "D1_READY=yes" | tee -a /tmp/result.env
              echo "D1_DATABASE_ID=$DB_ID" | tee -a /tmp/result.env
            else
              echo "D1_READY=no" | tee -a /tmp/result.env
            fi
          else
            echo "D1_READY=no" | tee -a /tmp/result.env
          fi

          echo "=== RESULT ==="
          cat /tmp/result.env

      - name: Patch D1 id and migrate when all resources are ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/result.env
          if [ "${R2_READY:-no}" != "yes" ] || [ "${VECTORIZE_READY:-no}" != "yes" ] || [ "${D1_READY:-no}" != "yes" ]; then
            echo "NOT_ALL_READY"
            exit 0
          fi
          python3 - "$D1_DATABASE_ID" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path("wrangler.jsonc")
          data=json.loads(p.read_text())
          data["d1_databases"][0]["database_id"]=sys.argv[1]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          npx wrangler d1 execute consciencia-fabiano-rag-db --remote --file=./migrations/0001_init.sql
          echo "ALL_NATIVE_RESOURCES_READY=yes" | tee -a /tmp/result.env

      - name: Commit provisioned binding and remove one-shot workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/retry-cloudflare-provision-after-r2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consciencia-fabiano/wrangler.jsonc
          git commit -m "Retry Cloudflare-native provisioning after R2 activation"
          git push origin HEAD:consciencia-cloudflare-native-v1
