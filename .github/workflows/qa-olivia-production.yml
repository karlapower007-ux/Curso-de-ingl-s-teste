name: QA Olivia Production

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  qa-olivia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fns-digital-human/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source QA Olivia v5
        run: |
          node --check public/olivia-core-v4.js
          node --check public/olivia-visual-v5.js
          grep -q "FNS OLIVIA CORE V4" public/olivia-core-v4.js
          grep -q "FNS OLIVIA VISUAL V5" public/olivia-visual-v5.js
          grep -q "data-fns-olivia-visual-v5" public/olivia-static.css
          grep -q "olivia-core-v4.js?v=4" public/index.html
          grep -q "olivia-visual-v5.js?v=5" public/index.html
          grep -q "olivia-static.css?v=5" public/index.html
          grep -q "olivia-fechada.png?v=v5-20260917" public/index.html
          grep -q "olivia-falando.png?v=v5-20260917" public/index.html
          grep -q "olivia-aberta.png?v=v5-20260917" public/index.html
          echo 'SOURCE OLIVIA V5 QA PASS'

      - name: Wait for production deploy
        run: sleep 10

      - name: Production Olivia assets
        run: |
          for f in olivia-fechada.png olivia-falando.png olivia-aberta.png; do
            curl --compressed --fail --silent --show-error -o "$f" "https://fns-stt.karlapower007.workers.dev/assets/$f?v=v5-20260917"
          done
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const hashes=new Set();
          for(const f of ['olivia-fechada.png','olivia-falando.png','olivia-aberta.png']){
            const b=fs.readFileSync(f);
            if(b.length<5000)throw new Error(f+' too small '+b.length);
            if(b[0]!==0x89||b[1]!==0x50||b[2]!==0x4e||b[3]!==0x47)throw new Error(f+' is not PNG');
            const w=b.readUInt32BE(16),h=b.readUInt32BE(20);
            if(w<256||h<256)throw new Error(f+' dimensions too small '+w+'x'+h);
            hashes.add(crypto.createHash('sha256').update(b).digest('hex'));
          }
          if(hashes.size!==3)throw new Error('Olivia frames are not distinct');
          console.log('PRODUCTION OLIVIA ASSETS PASS');
          NODE

      - name: Production Olivia Spanish chat
        run: |
          curl --compressed --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"message":"Hola Olivia. Quiero practicar español contigo.","teacher":"Olivia","level":"A1","accent":"Español","input_language":"es-ES","input_language_label":"Español","strict_language":"es-ES","history":[]}' \
            -o olivia-chat.json \
            'https://fns-stt.karlapower007.workers.dev/chat'
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('olivia-chat.json','utf8'));
          if(!data.ok||!data.reply)throw new Error('Olivia chat failed '+JSON.stringify(data));
          if(data.strict_language!=='es-ES'||data.language_guard!=='FNS-OLIVIA-A-H')throw new Error('Olivia strict flags missing '+JSON.stringify(data));
          const text=String(data.reply).toLowerCase();
          if(/\b(i am|my name|thank you|how are you|good morning|hello)\b/i.test(text))throw new Error('English leak '+data.reply);
          if(/\b(você|voce|não|nao|obrigado|obrigada|bom dia|meu nome)\b/i.test(text))throw new Error('Portuguese leak '+data.reply);
          console.log('PRODUCTION OLIVIA CHAT PASS',data.reply);
          NODE

      - name: Production Olivia TTS route
        run: |
          STATUS=$(curl --compressed --silent --show-error -D olivia-tts.headers -o olivia-tts.body -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hola, soy Olivia. ¿Cómo te llamas?","teacher":"Olivia","language":"es-ES"}' \
            'https://fns-stt.karlapower007.workers.dev/tts')
          echo "Olivia TTS status=$STATUS"
          if [ "$STATUS" = "200" ]; then
            test -s olivia-tts.body
            grep -i '^content-type: audio/' olivia-tts.headers
            grep -i '^x-fns-voice-language:' olivia-tts.headers || true
          fi

      - name: Install browser QA dependency
        run: npm install --no-save puppeteer-core@24.18.0

      - name: Browser QA Olivia v5 anti-blackout and voice
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.message||e)));

            await page.goto('https://fns-stt.karlapower007.workers.dev/?olivia=v5',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('#liteModal .human-avatar[data-teacher="olivia"] img',{timeout:30000});
            await page.waitForFunction(()=>window.FNS_OLIVIA_VISUAL_V5?.health?.().loaded===true,{timeout:30000});

            const assertVisible=async(label)=>{
              const h=await page.evaluate(()=>window.FNS_OLIVIA_VISUAL_V5.health());
              if(!h.active||!h.modal||!h.stage||!h.face||!h.image||!h.loaded)throw new Error(label+' missing visual '+JSON.stringify(h));
              if(h.faceDisplay==='none'||h.faceVisibility==='hidden'||Number(h.faceOpacity)<0.99)throw new Error(label+' face hidden '+JSON.stringify(h));
              if(h.imageDisplay==='none'||h.imageVisibility==='hidden'||Number(h.imageOpacity)<0.99)throw new Error(label+' image hidden '+JSON.stringify(h));
              if(!h.faceRect||h.faceRect.width<200||h.faceRect.height<300||!h.imageRect||h.imageRect.width<200||h.imageRect.height<300)throw new Error(label+' zero/collapsed size '+JSON.stringify(h));
              if(!/olivia-(fechada|falando|aberta)\.png/.test(h.src))throw new Error(label+' wrong src '+JSON.stringify(h));
              if(h.errors.length)throw new Error(label+' visual errors '+JSON.stringify(h.errors));
              return h;
            };

            await assertVisible('boot');
            await sleep(6500); // natural ambient wrapper has had time to run
            await assertVisible('ambient');

            await page.evaluate(()=>setNaturalAvatarState('listening'));
            await sleep(400);
            await assertVisible('listening');

            await page.evaluate(()=>{
              const face=document.querySelector('#liteModal .human-avatar[data-teacher="olivia"]');
              face?.style.setProperty('--mouth-open','0.35','important');
            });
            await sleep(400);
            let h=await assertVisible('talking');
            if(!h.src.includes('olivia-falando.png'))throw new Error('talking frame did not persist '+JSON.stringify(h));

            await page.evaluate(()=>{
              const face=document.querySelector('#liteModal .human-avatar[data-teacher="olivia"]');
              face?.style.setProperty('--mouth-open','0.80','important');
              setNaturalAvatarState('speaking');
            });
            await sleep(400);
            h=await assertVisible('speaking-open');
            if(!h.src.includes('olivia-aberta.png'))throw new Error('open frame did not persist '+JSON.stringify(h));

            // Simulate the exact failures reported by the user: hidden node, broken src,
            // removed face and a black loading overlay. V5 must recover automatically.
            await page.evaluate(()=>{
              const face=document.querySelector('#liteModal .human-avatar[data-teacher="olivia"]');
              const img=face?.querySelector('img');
              if(face){face.style.setProperty('display','none','important');face.style.setProperty('opacity','0','important');}
              if(img)img.src='about:blank';
            });
            await sleep(500);
            await assertVisible('recovered-hidden-and-src');

            await page.evaluate(()=>document.querySelector('#liteModal .human-avatar[data-teacher="olivia"]')?.remove());
            await sleep(500);
            await assertVisible('recovered-removed-face');

            await page.evaluate(()=>{
              const stage=document.querySelector('#liteModal .avatar-stage');
              const blocker=document.createElement('div');
              blocker.className='avatar-loading-overlay';
              blocker.style.cssText='position:absolute;inset:0;background:#000;z-index:9999;display:block;opacity:1';
              stage?.appendChild(blocker);
            });
            await sleep(400);
            const blocker=await page.evaluate(()=>{
              const el=document.querySelector('#liteModal .avatar-loading-overlay');
              if(!el)return null;
              const c=getComputedStyle(el);return {display:c.display,opacity:c.opacity,visibility:c.visibility};
            });
            if(blocker&&blocker.display!=='none'&&Number(blocker.opacity)>0)throw new Error('black overlay survived '+JSON.stringify(blocker));
            await assertVisible('overlay-guard');

            await page.evaluate(()=>{
              const face=document.querySelector('#liteModal .human-avatar[data-teacher="olivia"]');
              face?.style.setProperty('--mouth-open','0','important');
              setNaturalAvatarState('idle');
            });
            await sleep(2500);
            await assertVisible('idle-persistent');

            // Force remote TTS failure and prove the es-ES browser fallback still works in v5.
            await page.setRequestInterception(true);
            page.on('request',req=>{
              if(req.url().includes('/tts')&&req.method()==='POST')req.respond({status:503,contentType:'application/json',body:JSON.stringify({ok:false,code:'FORCED_QA_TTS_FAILURE'})});
              else req.continue();
            });
            await page.evaluate(()=>{
              window.__OLIVIA_QA_SPOKEN__=[];
              const synth=window.speechSynthesis;
              synth.cancel=()=>{};
              synth.getVoices=()=>[];
              synth.speak=(u)=>{
                window.__OLIVIA_QA_SPOKEN__.push({text:u.text,lang:u.lang});
                setTimeout(()=>u.onstart?.(),10);
                setTimeout(()=>u.onend?.(),80);
              };
            });
            await page.click('#voiceBtn');
            await page.waitForFunction(()=>window.__OLIVIA_QA_SPOKEN__?.length>0,{timeout:10000});
            const spoken=await page.evaluate(()=>window.__OLIVIA_QA_SPOKEN__[0]);
            if(spoken.lang!=='es-ES')throw new Error('browser voice fallback is not es-ES '+JSON.stringify(spoken));
            if(pageErrors.length)throw new Error('Unhandled page errors '+JSON.stringify(pageErrors));

            console.log('OLIVIA V5 BROWSER QA PASS',JSON.stringify({visual:await page.evaluate(()=>window.FNS_OLIVIA_VISUAL_V5.health()),spoken}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final Olivia status
        run: echo 'OLIVIA V5 PRODUCTION QA PASS - no blackout after boot/listening/speaking; DOM removal, broken src and black overlay recovery verified'
