name: Consciência Fabiano V8 Adaptive Acceptance

on:
  push:
    branches:
      - consciencia-v8-adaptive-production-baseline-staging-20260921
    paths:
      - "consciencia-fabiano/**"
      - ".github/workflows/consciencia-v80-adaptive-acceptance.yml"
  pull_request:
    branches:
      - consciencia-cloudflare-native-v1
    paths:
      - "consciencia-fabiano/**"
      - ".github/workflows/consciencia-v80-adaptive-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consciencia-v80-adaptive-acceptance
  cancel-in-progress: true

jobs:
  preserve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V8 staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current production baseline
        run: git fetch origin consciencia-cloudflare-native-v1

      - name: Refuse unauthorized frontend or library regression
        shell: bash
        run: |
          set -euo pipefail
          BASE=origin/consciencia-cloudflare-native-v1
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"

          if printf '%s\n' "$CHANGED" | grep -Eq '^consciencia-fabiano/(supabase/migrations|public/biblioteca_backup)'; then
            echo "V8 preservation gate: protected library/migration path changed."
            exit 1
          fi

          if printf '%s\n' "$CHANGED" | grep -Eq '^consciencia-fabiano/public/(index\.html|failover-v3\.js|sw-v3\.js)
      - name: Verify preservation manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.library.expected_verified_chunks' consciencia-fabiano/v8-preservation-manifest.json)" = "28636"
          test "$(jq -r '.library.expected_verified_vectors' consciencia-fabiano/v8-preservation-manifest.json)" = "28636"
          test "$(jq -r '.library.historical_verified_fallback_chunks' consciencia-fabiano/v8-preservation-manifest.json)" = "25199"
          test "$(jq -r '.hard_guards.pre_final_llm_calls' consciencia-fabiano/v8-preservation-manifest.json)" = "0"
          test "$(jq -r '.hard_guards.production_auto_promotion' consciencia-fabiano/v8-preservation-manifest.json)" = "false"
          echo "V8_MANIFEST_GATE=pass"

      - name: Install only existing dev dependencies
        working-directory: consciencia-fabiano
        run: npm install --ignore-scripts

      - name: Run legacy plus V8 acceptance gates
        working-directory: consciencia-fabiano
        run: npm run check

      - name: Explicit V8 overload test
        working-directory: consciencia-fabiano
        run: npm run test:adaptive-v80

      - name: Validate autonomous release shell
        working-directory: consciencia-fabiano
        run: bash -n scripts/autonomous-release.sh

      - name: Gate summary
        run: |
          echo "V8_ADAPTIVE_ACCEPTANCE=pass"
          echo "PRODUCTION_DEPLOY=disabled"
          echo "FRONTEND_PRESERVED=protected-core-plus-authorized-citation-ui"
          echo "LIBRARY_REINDEX=disabled"
; then
            echo "V8 preservation gate: protected frontend core changed."
            exit 1
          fi

          FRONTEND_CHANGED="$(printf '%s\n' "$CHANGED" | grep -E '^consciencia-fabiano/public/' || true)"
          if [ -n "$FRONTEND_CHANGED" ]; then
            test -f consciencia-fabiano/v8-citation-ui-authorized.json
            test "$(jq -r '.feature' consciencia-fabiano/v8-citation-ui-authorized.json)" = "citation_dictionary_v8_0_1"
            test "$(jq -r '.library.mutate_existing_chunks' consciencia-fabiano/v8-citation-ui-authorized.json)" = "false"
            test "$(jq -r '.library.mutate_existing_vectors' consciencia-fabiano/v8-citation-ui-authorized.json)" = "false"

            UNAUTHORIZED="$(printf '%s\n' "$FRONTEND_CHANGED" | grep -Ev '^consciencia-fabiano/public/(app\.js|style\.css)
      - name: Verify preservation manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.library.expected_verified_chunks' consciencia-fabiano/v8-preservation-manifest.json)" = "28636"
          test "$(jq -r '.library.expected_verified_vectors' consciencia-fabiano/v8-preservation-manifest.json)" = "28636"
          test "$(jq -r '.library.historical_verified_fallback_chunks' consciencia-fabiano/v8-preservation-manifest.json)" = "25199"
          test "$(jq -r '.hard_guards.pre_final_llm_calls' consciencia-fabiano/v8-preservation-manifest.json)" = "0"
          test "$(jq -r '.hard_guards.production_auto_promotion' consciencia-fabiano/v8-preservation-manifest.json)" = "false"
          echo "V8_MANIFEST_GATE=pass"

      - name: Install only existing dev dependencies
        working-directory: consciencia-fabiano
        run: npm install --ignore-scripts

      - name: Run legacy plus V8 acceptance gates
        working-directory: consciencia-fabiano
        run: npm run check

      - name: Explicit V8 overload test
        working-directory: consciencia-fabiano
        run: npm run test:adaptive-v80

      - name: Validate autonomous release shell
        working-directory: consciencia-fabiano
        run: bash -n scripts/autonomous-release.sh

      - name: Gate summary
        run: |
          echo "V8_ADAPTIVE_ACCEPTANCE=pass"
          echo "PRODUCTION_DEPLOY=disabled"
          echo "FRONTEND_PRESERVED=yes"
          echo "LIBRARY_REINDEX=disabled"
 || true)"
            if [ -n "$UNAUTHORIZED" ]; then
              echo "V8 preservation gate: unauthorized frontend file changed:"
              printf '%s\n' "$UNAUTHORIZED"
              exit 1
            fi
            echo "V8_FRONTEND_SCOPE=authorized-citation-dictionary-only"
          else
            echo "V8_FRONTEND_SCOPE=unchanged"
          fi

          echo "V8_PRESERVATION_GATE=pass"

      - name: Verify preservation manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.library.expected_verified_chunks' consciencia-fabiano/v8-preservation-manifest.json)" = "28636"
          test "$(jq -r '.library.expected_verified_vectors' consciencia-fabiano/v8-preservation-manifest.json)" = "28636"
          test "$(jq -r '.library.historical_verified_fallback_chunks' consciencia-fabiano/v8-preservation-manifest.json)" = "25199"
          test "$(jq -r '.hard_guards.pre_final_llm_calls' consciencia-fabiano/v8-preservation-manifest.json)" = "0"
          test "$(jq -r '.hard_guards.production_auto_promotion' consciencia-fabiano/v8-preservation-manifest.json)" = "false"
          echo "V8_MANIFEST_GATE=pass"

      - name: Install only existing dev dependencies
        working-directory: consciencia-fabiano
        run: npm install --ignore-scripts

      - name: Run legacy plus V8 acceptance gates
        working-directory: consciencia-fabiano
        run: npm run check

      - name: Explicit V8 overload test
        working-directory: consciencia-fabiano
        run: npm run test:adaptive-v80

      - name: Validate autonomous release shell
        working-directory: consciencia-fabiano
        run: bash -n scripts/autonomous-release.sh

      - name: Gate summary
        run: |
          echo "V8_ADAPTIVE_ACCEPTANCE=pass"
          echo "PRODUCTION_DEPLOY=disabled"
          echo "FRONTEND_PRESERVED=yes"
          echo "LIBRARY_REINDEX=disabled"
