name: Set Consciência private access
on:
  push:
    branches: [consciencia-do-fabiano]
    paths: ['.github/workflows/set-consciencia-access.yml']
permissions:
  contents: write
jobs:
  set-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consciencia-do-fabiano
      - name: Update owner token hash and clean one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('consciencia-fabiano/src/index.js')
          s=p.read_text()
          old='6181e1c1b0ce09c367fcfc3be871baec2d356e80f2752db66cff41a736621c6c'
          new='4df264da389c491ea6b9a57f10715108246440ae738f9378b65a64a4c4ce4fc0'
          if old not in s:
              raise SystemExit('old hash not found')
          p.write_text(s.replace(old,new))
          PY
          git rm .github/workflows/set-consciencia-access.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consciencia-fabiano/src/index.js
          git commit -m "Set private owner access for Consciência"
          git push origin HEAD:consciencia-do-fabiano
