name: QA Emma Anatomical Mouth Stress

on:
  push:
    branches:
      - fns-digital-human
    paths:
      - '.github/workflows/qa-emma-anatomical-temp.yml'

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run anatomical mouth stress test
        run: |
          npm install --no-save puppeteer-core@24.18.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,
              executablePath:process.env.CHROME_BIN,
              args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']
            });
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1100,deviceScaleFactor:1});
            page.on('console',msg=>console.log('BROWSER',msg.type(),msg.text()));
            await page.goto('https://fns-stt.karlapower007.workers.dev/?qa=emma-anatomical-stress',{waitUntil:'networkidle2',timeout:60000});
            await page.click('button[data-view="live"]');
            await page.waitForSelector('.card.teacher',{timeout:30000});
            const opened=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('.card.teacher')];
              const card=cards.find(x=>x.querySelector('h3')?.textContent?.trim()==='Emma');
              const button=card?.querySelector('button.primary');
              if(!button)return false;
              button.click();
              return true;
            });
            if(!opened) throw new Error('Emma teacher card could not be opened');
            await page.waitForSelector('.human-avatar .avatar-mouth-motion',{timeout:30000});
            await new Promise(r=>setTimeout(r,800));

            // Enable voice so typed stress prompts produce real TTS turns when available.
            const voice=await page.$('#voiceBtn');
            if(voice){
              await voice.click();
              await page.waitForFunction(()=>{
                const t=document.querySelector('#statusText')?.textContent||'';
                return /Ready/i.test(t);
              },{timeout:30000}).catch(()=>{});
            }

            const phrases=[
              'Emma, please say slowly: Bumblebee, Pamplona, Memento, Mississippi.',
              'Emma, say this with a huge smile: Seeing three tiny bees flying over the green sea makes me extremely happy.',
              'Emma, say: You threw the blue hoop through the loop.'
            ];

            async function sampleState(label){
              return await page.evaluate((label)=>{
                const avatar=document.querySelector('.human-avatar');
                const mouth=document.querySelector('.human-avatar .avatar-mouth-motion');
                const s=getComputedStyle(mouth);
                const rect=mouth.getBoundingClientRect();
                const aRect=avatar.getBoundingClientRect();
                return {
                  label,
                  speaking:avatar.classList.contains('avatar-speaking'),
                  display:s.display,
                  visibility:s.visibility,
                  opacity:s.opacity,
                  width:s.width,
                  height:s.height,
                  renderedWidth:rect.width,
                  renderedHeight:rect.height,
                  renderedWidthPct:aRect.width?rect.width/aRect.width*100:0,
                  top:s.top,
                  left:s.left,
                  backgroundImage:s.backgroundImage,
                  borderRadius:s.borderRadius,
                  boxShadow:s.boxShadow,
                  transform:s.transform,
                  inlineWidth:mouth.style.getPropertyValue('width'),
                  inlineHeight:mouth.style.getPropertyValue('height'),
                  inlineTop:mouth.style.getPropertyValue('top'),
                  inlineBackground:mouth.style.getPropertyValue('background'),
                  fakeV19Exists:!!document.getElementById('fns-nova-boca-v19'),
                  ghostV19StyleExists:!!document.getElementById('fns-override-v19')
                };
              },label);
            }

            const evidence=[];
            for(let i=0;i<phrases.length;i++){
              await page.waitForFunction(()=>{
                const input=document.querySelector('#chatInput');
                const send=document.querySelector('#sendBtn');
                return input && send && !input.disabled && !send.disabled;
              },{timeout:30000});
              await page.focus('#chatInput');
              await page.evaluate((text)=>{const el=document.querySelector('#chatInput');el.value=text;el.dispatchEvent(new Event('input',{bubbles:true}));},phrases[i]);
              await page.click('#sendBtn');

              const started=await page.waitForFunction(()=>{
                const avatar=document.querySelector('.human-avatar');
                return avatar?.classList.contains('avatar-speaking') || /Speaking/i.test(document.querySelector('#statusText')?.textContent||'');
              },{timeout:30000}).then(()=>true).catch(()=>false);

              if(started){
                await new Promise(r=>setTimeout(r,220));
                evidence.push(await sampleState('phrase-'+(i+1)+'-speaking'));
                const avatarEl=await page.$('.human-avatar');
                await avatarEl.screenshot({path:`emma-anatomical-${i+1}.png`});
                await page.waitForFunction(()=>!document.querySelector('.human-avatar')?.classList.contains('avatar-speaking'),{timeout:45000}).catch(()=>{});
              } else {
                evidence.push(await sampleState('phrase-'+(i+1)+'-no-speaking-detected'));
              }
              await new Promise(r=>setTimeout(r,500));
            }

            // Stability sampling across competing RAF loops.
            const stability=[];
            for(let i=0;i<40;i++){
              stability.push(await sampleState('stability-'+i));
              await new Promise(r=>setTimeout(r,25));
            }

            const valid=s=>
              s.display!=='none' && s.visibility!=='hidden' && parseFloat(s.opacity)>=0.9 &&
              s.inlineWidth==='10.5%' && s.inlineHeight==='7px' && s.inlineTop==='58.2%' &&
              String(s.backgroundImage).includes('linear-gradient') &&
              s.borderRadius!=='0px' && String(s.boxShadow).includes('inset') &&
              !s.fakeV19Exists && !s.ghostV19StyleExists;
            const validCount=stability.filter(valid).length;
            const result={phrases,evidence,stabilityValid:validCount,stabilityTotal:stability.length,final:stability.at(-1)};
            fs.writeFileSync('emma-anatomical-state.json',JSON.stringify(result,null,2));
            await page.screenshot({path:'emma-anatomical-page.png',fullPage:true});
            console.log('ANATOMICAL_RESULT',JSON.stringify(result));
            if(validCount<36) throw new Error('Anatomical cavity not stable against core resets: '+validCount+'/'+stability.length+' samples valid');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emma-anatomical-mouth-evidence
          path: |
            emma-anatomical-*.png
            emma-anatomical-state.json
          if-no-files-found: warn
