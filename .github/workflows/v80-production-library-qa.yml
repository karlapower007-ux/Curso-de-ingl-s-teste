name: V8 Production Library Desktop Mobile QA

on:
  push:
    branches:
      - "ops-v80-final-ui-qa-*"
    paths:
      - ".github/workflows/v80-production-library-qa.yml"
      - "ops/run-v80-production-library-qa.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser QA tooling
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Validate production Biblioteca desktop and mobile
        shell: bash
        run: |
          cat > ./library-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const base='https://consciencia-fabiano.focoeepoder2.workers.dev';
          const profiles=[
            {name:'desktop',viewport:{width:1440,height:900},isMobile:false},
            {name:'mobile',viewport:{width:390,height:844},isMobile:true}
          ];
          const report={ok:false,base,profiles:[],started_at:new Date().toISOString()};
          const browser=await chromium.launch({headless:true});
          try{
            for(const p of profiles){
              const context=await browser.newContext({
                viewport:p.viewport,isMobile:p.isMobile,
                userAgent:p.isMobile?'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 Chrome/153 Mobile Safari/537.36':undefined
              });
              const page=await context.newPage();
              await page.addInitScript(()=>{sessionStorage.setItem('consciencia_fabiano_owner_token_session_v2','gadu');});
              const errors=[];
              page.on('pageerror',e=>errors.push('pageerror:'+String(e.message||e)));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              page.on('response',r=>{if(r.status()>=400)errors.push('http:'+r.status()+':'+r.url())});
              page.on('requestfailed',r=>errors.push('requestfailed:'+r.url()+':'+String(r.failure()?.errorText||'')));
              page.on('dialog',async d=>{
                if(d.type()==='prompt')await d.accept('gadu');
                else await d.dismiss();
              });
              const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
              if(!response?.ok())throw new Error(p.name+' homepage HTTP '+response?.status());
              await page.locator('#libraryTab').waitFor({state:'visible',timeout:20000});
              await page.locator('#libraryTab').click({timeout:15000});
              await page.locator('#libraryPanel').waitFor({state:'visible',timeout:15000});
              await page.waitForFunction(()=>document.querySelectorAll('#booksList .book').length>=8,{timeout:45000}).catch(()=>null);
              await page.waitForTimeout(1200);
              const debugState=await page.evaluate(()=>({
                libraryButtonExists:!!document.querySelector('#libraryTab'),
                libraryButtonClass:document.querySelector('#libraryTab')?.className||'',
                libraryPanelClass:document.querySelector('#libraryPanel')?.className||'',
                chatPanelClass:document.querySelector('#chatPanel')?.className||'',
                ownerToken:sessionStorage.getItem('consciencia_fabiano_owner_token_session_v2')||'',
                appReady:document.readyState,
                onclickBound:typeof document.querySelector('#libraryTab')?.onclick==='function',
                scripts:[...document.scripts].map(s=>s.src||'[inline]')
              }));
              const opened=await page.locator('#libraryPanel').isVisible();
              if(!opened){
                report.profiles.push({name:p.name,viewport:p.viewport,ok:false,panel_visible:false,tab_active:false,visible_documents:0,status:'panel-not-opened',documents:[],errors:errors.slice(0,20),debug:debugState});
                await context.close();
                continue;
              }
              const directManifest=await page.evaluate(async()=>{
                try{
                  const r=await fetch('/api/v1/r2/library-manifest',{headers:{'X-FNS-Owner-Token':'gadu'}});
                  const j=await r.json().catch(()=>({}));
                  return {ok:r.ok,status:r.status,total_books:Number(j?.total_books||0),total_chunks:Number(j?.total_chunks||0),vector_count:Number(j?.vector_count||0),generation:String(j?.generation||''),source:String(j?.source||''),metadata_is_array:Array.isArray(j?.metadata),metadata_count:Array.isArray(j?.metadata)?j.metadata.length:0,metadata_sample:Array.isArray(j?.metadata)?j.metadata.slice(0,3).map(x=>({keys:Object.keys(x||{}).sort(),document_id:String(x?.document_id||''),filename:String(x?.filename||x?.arquivo||''),title:String(x?.title||x?.titulo||'')})):[]};
                }catch(e){return {ok:false,status:0,error:String(e?.message||e)}}
              });
              const rows=await page.locator('#booksList .book').evaluateAll(nodes=>nodes.map(n=>({
                title:n.querySelector('strong')?.textContent?.trim()||'',
                detail:n.querySelector('small')?.textContent?.trim()||''
              })));
              const status=await page.locator('#adminStatus').textContent().catch(()=>null);
              const panelVisible=await page.locator('#libraryPanel').isVisible();
              const tabActive=await page.locator('#libraryTab').evaluate(el=>el.classList.contains('active'));
              const meaningful=rows.filter(x=>x.title && !/Nenhum PDF encontrado/i.test(x.title));
              const seriousErrors=errors.filter(x=>!/favicon|Failed to load resource.*404/i.test(x));
              const listReady=meaningful.length>=8;
              const ok=panelVisible && tabActive && listReady && directManifest.ok===true && directManifest.total_books>=8 && !/vazia|não foi possível|erro/i.test(String(status||''));
              report.profiles.push({
                name:p.name,viewport:p.viewport,ok,panel_visible:panelVisible,tab_active:tabActive,
                visible_documents:meaningful.length,status:String(status||''),
                documents:meaningful.slice(0,20),errors:seriousErrors.slice(0,30),list_ready:listReady,direct_manifest:directManifest
              });
              await context.close();
            }
            report.ok=report.profiles.every(x=>x.ok);
            report.completed_at=new Date().toISOString();
            await fs.writeFile('./v80-production-library-qa.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if(!report.ok)process.exitCode=1;
          }finally{await browser.close();}
          EOF
          node ./library-qa.mjs

      - name: Upload UI QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-production-library-ui-qa
          path: v80-production-library-qa.json
          retention-days: 30
