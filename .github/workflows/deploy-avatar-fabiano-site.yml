name: Deploy Avatar Fabiano Public Site

on:
  push:
    branches: [avatar-fabiano-production]
    paths:
      - 'avatar-fabiano/cloudflare/**'
      - '.github/workflows/deploy-avatar-fabiano-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: avatar-fabiano/cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Validate
        run: |
          set -euo pipefail
          node --check worker.js
          grep -q 'FABIANO_CF_V1_20260917' public/index.html
          grep -q 'FABIANO_CF_V1_20260917' public/admin.html
          grep -q "const API = location.origin" public/index.html
          grep -q "const API = location.origin" public/admin.html
          grep -q '/static/avatar-fabiano-perfil.png' public/index.html
          grep -q '/static/avatar-fabiano-debatendo.png' public/index.html
          grep -q "searchParams.set('_ts'" public/index.html

      - name: Deploy public frontend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live smoke test
        run: |
          set -euo pipefail
          BASE='https://avatar-fabiano-site.karlapower007.workers.dev'
          ok=0
          for i in $(seq 1 30); do
            echo "Smoke attempt $i/30"
            if curl --compressed --fail --silent --show-error --max-time 25 "$BASE/?v=FABIANO_CF_V1_20260917" -o /tmp/index.html &&
               curl --compressed --fail --silent --show-error --max-time 25 "$BASE/admin?v=FABIANO_CF_V1_20260917" -o /tmp/admin.html &&
               grep -q 'FABIANO_CF_V1_20260917' /tmp/index.html &&
               grep -q 'FABIANO_CF_V1_20260917' /tmp/admin.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          curl --compressed --fail --silent --show-error --max-time 25 "$BASE/health" -o /tmp/health.json
          curl --compressed --fail --silent --show-error --max-time 25 "$BASE/static/avatar-fabiano-perfil.png" -o /tmp/perfil.png
          curl --compressed --fail --silent --show-error --max-time 25 "$BASE/static/avatar-fabiano-debatendo.png" -o /tmp/debatendo.png
          test -s /tmp/perfil.png
          test -s /tmp/debatendo.png
          grep -q '"ok":true' /tmp/health.json
          echo 'AVATAR FABIANO PUBLIC SITE LIVE PASS'
