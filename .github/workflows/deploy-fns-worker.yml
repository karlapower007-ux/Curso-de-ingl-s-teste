name: Deploy FNS Worker

on:
  push:
    branches: [fns-digital-human]
    paths:
      - 'fns-digital-human/worker/**'
      - '.github/workflows/deploy-fns-worker.yml'
      - '.github/workflows/qa-olivia-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: fns-digital-human/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install

      - name: Materialize frozen Olivia V16 avatar frames
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const name of ['fechada', 'falando', 'aberta']) {
            const src = `public/assets/olivia-${name}-v16.b64`;
            const dst = `public/assets/olivia-${name}-v16.jpg`;
            const raw = fs.readFileSync(src, 'utf8').replace(/^data:image\/jpeg;base64,/i, '').replace(/\s+/g, '');
            const buf = Buffer.from(raw, 'base64');
            fs.writeFileSync(dst, buf);
            console.log(`${name}: materialized ${buf.length} bytes`);
          }
          NODE
          for name in fechada falando aberta; do
            dst="public/assets/olivia-${name}-v16.jpg"
            fallback="public/assets/olivia-${name}-v15.jpg"
            if ! file "$dst" | grep -q JPEG; then
              echo "V16 $name source invalid; using protected V15 JPEG fallback"
              cp "$fallback" "$dst"
            fi
            file "$dst" | grep -q JPEG
            test -s "$dst"
          done
          echo 'FROZEN OLIVIA V16 VISUAL MATERIALIZATION PASS'

      - name: Protect frozen visual/core + validate Olivia V18 behavior
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/strict-output.js
          node --check src/strict-output-v7.js
          node --check src/strict-output-v16.js
          node --check src/strict-output-v17.js
          node --check src/strict-output-v18.js
          node --check public/app.js
          node --check public/avatar-core.js
          test "$(git hash-object public/app.js)" = "900e50a3f92c53f5e46cd7c05556024a14c7bf72"
          test "$(git hash-object public/avatar-core.js)" = "eae5d60c405daf911a6e1828b30d62668e341c23"
          test "$(git hash-object public/avatar.html)" = "1192f6e04eac2e474e8bd261bb7e1db2ea40fac7"
          test "$(git hash-object src/index.js)" = "e53139aa0b73bd11f54b1f8b83529a1ce93406dc"
          test "$(git hash-object src/strict-output-v16.js)" = "bc35e9edfa35bcce85e905c5cac49609cc518340"
          grep -q 'FNS EMMA OUTPUT TURBINE A-H' src/strict-output.js
          grep -q '"main": "src/strict-output-v18.js"' wrangler.jsonc
          grep -q "language:'es-ES'" src/strict-output-v7.js
          grep -q "languageLabel:'Español'" src/strict-output-v7.js
          grep -q "subtitle:'Profesora de español'" src/strict-output-v7.js
          grep -q 'olivia-fechada-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-falando-v16.jpg' src/strict-output-v16.js
          grep -q 'olivia-aberta-v16.jpg' src/strict-output-v16.js
          grep -q 'FNS-OLIVIA-V18-END-TO-END' src/strict-output-v18.js
          grep -q 'pollinations-openai' src/strict-output-v18.js
          grep -q 'hf-free-ai-chat' src/strict-output-v18.js
          grep -q 'static_fallback:false' src/strict-output-v18.js
          echo 'FROZEN V16 VISUAL + CORE LOCK + OLIVIA V18 SOURCE PASS'

      - name: V18 primary + quota failover contracts — fake providers only
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v18.js';

          const seen=[];
          const envOk={AI:{async run(model,input){
            seen.push(structuredClone(input.messages));
            const last=[...input.messages].reverse().find(x=>x.role==='user')?.content||'';
            return {response:/te amo mucho/i.test(last)
              ?'Gracias por decírmelo. Me alegra hablar contigo. ¿Cómo estás hoy?'
              :'¡Hola! Estoy muy bien. ¿Cómo estás tú?'};
          }}};
          const first=new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',level:'A1',message:'Hola',history:[]})});
          const r1=await worker.fetch(first,envOk,{}); const j1=await r1.json();
          if(!r1.ok||!j1.reply||j1.fallback!==false)throw new Error('primary first turn failed '+JSON.stringify(j1));
          const second=new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',level:'A1',message:'Te amo mucho',messages:[{role:'user',content:'Hola'},{role:'assistant',content:j1.reply}]})});
          const r2=await worker.fetch(second,envOk,{}); const j2=await r2.json();
          if(!r2.ok||!j2.reply||j2.reply===j1.reply)throw new Error('primary contextual turn failed '+JSON.stringify(j2));
          const final=seen.at(-1)||[];
          if(!final.some(x=>x.role==='user'&&x.content==='Hola')||!final.some(x=>x.role==='assistant'&&x.content===j1.reply)||!final.some(x=>x.role==='user'&&x.content==='Te amo mucho'))throw new Error('full context not delivered');

          const originalFetch=globalThis.fetch;
          let publicCalls=0;
          globalThis.fetch=async (url,options={})=>{
            if(String(url)==='https://text.pollinations.ai/openai'){
              publicCalls++;
              const sent=JSON.parse(String(options.body||'{}')).messages||[];
              if(!sent.some(x=>x.role==='user'&&x.content==='Hola'))throw new Error('fallback lost prior turn');
              if(!sent.some(x=>x.role==='user'&&x.content==='¿Qué haces hoy?'))throw new Error('fallback lost current turn');
              return Response.json({choices:[{message:{content:'Hoy hablo contigo y te ayudo con español. ¿Qué quieres practicar?'}}]},{status:200});
            }
            throw new Error('unexpected public URL '+String(url));
          };
          try{
            const envQuota={AI:{async run(){throw new Error('4006 daily free allocation used up your neurons')}}};
            const req=new Request('https://qa.local/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher:'Olivia',level:'A1',message:'¿Qué haces hoy?',history:[{role:'user',content:'Hola'},{role:'assistant',content:'¡Hola! ¿Cómo estás?'}]})});
            const res=await worker.fetch(req,envQuota,{}); const json=await res.json();
            if(!res.ok||!json.reply||json.fallback!==true||json.provider!=='pollinations-openai'||json.cloudflare_quota!==true||publicCalls!==1)throw new Error('quota failover failed '+JSON.stringify(json));
          }finally{globalThis.fetch=originalFetch;}
          console.log('V18 CHAT CONTRACT PASS — primary context + quota failover both return real replies');
          NODE

      - name: Local mock contract — never touch Workers AI/public providers
        run: |
          node --input-type=module <<'NODE'
          import worker from './src/strict-output-v18.js';
          const env = new Proxy({}, { get(){ throw new Error('AI/env access forbidden in QA mock'); } });
          for (const path of ['/tts','/chat','/stt']) {
            const req = new Request('https://qa.local'+path, {
              method:'POST',
              headers:{'Content-Type':'application/json','X-FNS-QA-Mock':'1'},
              body:JSON.stringify({teacher:'Olivia',text:'Hola'})
            });
            const res = await worker.fetch(req, env, {});
            if (!res.ok || res.headers.get('X-FNS-QA-Mock') !== '1') throw new Error('mock leak '+path);
          }
          console.log('MOCK QA PASS — 0 Workers AI/public-provider calls');
          NODE

      - name: Wrangler bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/fns-v18-dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production HTML/assets smoke — frozen visuals, no AI endpoints
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://fns-stt.karlapower007.workers.dev'
          curl --compressed --fail --silent --show-error "$BASE/?avatar=olivia&v=18&qa=visual-only" -o olivia-v18.html
          grep -q 'olivia-fechada-v16.jpg' olivia-v18.html
          grep -q 'olivia-falando-v16.jpg' olivia-v18.html
          grep -q 'olivia-aberta-v16.jpg' olivia-v18.html
          grep -q 'es-ES' olivia-v18.html
          grep -q 'Profesora de español' olivia-v18.html
          for f in olivia-fechada-v16.jpg olivia-falando-v16.jpg olivia-aberta-v16.jpg; do
            curl --compressed --fail --silent --show-error -o "$f" "$BASE/assets/$f?v=16"
            file "$f" | grep -q JPEG
          done
          echo 'PRODUCTION FROZEN V16 VISUAL PASS — NO VISUAL REGRESSION'

      - name: Production V18 live chat smoke — real deployed path
        run: |
          set -euo pipefail
          BASE='https://fns-stt.karlapower007.workers.dev'
          curl --compressed --silent --show-error --max-time 35 \
            -H 'Content-Type: application/json' \
            -d '{"teacher":"Olivia","level":"A1","message":"Hola, ¿cómo estás?","history":[]}' \
            "$BASE/chat" -o live-chat.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('live-chat.json','utf8'));
          if(j.ok!==true||typeof j.reply!=='string'||j.reply.trim().length<2)throw new Error('LIVE CHAT DID NOT RETURN REPLY: '+JSON.stringify(j));
          if(j.static_fallback!==false)throw new Error('static fallback regression: '+JSON.stringify(j));
          console.log('PRODUCTION LIVE CHAT PASS', {provider:j.provider,fallback:j.fallback,reply:j.reply.slice(0,100)});
          NODE

      - name: Browser end-to-end QA — reply bubble -> TTS -> mouth frame
        run: |
          npm install --no-save puppeteer-core@24.18.0 pngjs@7.0.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const {PNG}=require('pngjs');

          function wavTone(durationMs=900,sampleRate=16000){
            const samples=Math.floor(sampleRate*durationMs/1000), dataBytes=samples*2;
            const b=Buffer.alloc(44+dataBytes);
            b.write('RIFF',0); b.writeUInt32LE(36+dataBytes,4); b.write('WAVE',8); b.write('fmt ',12);
            b.writeUInt32LE(16,16); b.writeUInt16LE(1,20); b.writeUInt16LE(1,22); b.writeUInt32LE(sampleRate,24);
            b.writeUInt32LE(sampleRate*2,28); b.writeUInt16LE(2,32); b.writeUInt16LE(16,34); b.write('data',36); b.writeUInt32LE(dataBytes,40);
            for(let i=0;i<samples;i++)b.writeInt16LE(Math.round(Math.sin(2*Math.PI*440*i/sampleRate)*25000),44+i*2);
            return b;
          }

          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            let chatCalls=0,ttsCalls=0;
            await page.setRequestInterception(true);
            page.on('request',req=>{
              const u=new URL(req.url());
              if(u.pathname==='/chat'&&req.method()==='POST'){
                chatCalls++;
                return req.respond({status:200,contentType:'application/json',body:JSON.stringify({ok:true,reply:'Estoy bien y feliz de hablar contigo. ¿Cómo estás tú?',teacher:'Olivia',dynamic_chat:true,static_fallback:false})});
              }
              if(u.pathname==='/tts'&&req.method()==='POST'){
                ttsCalls++;
                return req.respond({status:200,contentType:'audio/wav',body:wavTone()});
              }
              if(u.pathname==='/stt')return req.abort('blockedbyclient');
              req.continue();
            });
            await page.goto('https://fns-stt.karlapower007.workers.dev/?avatar=olivia&v=18&qa=e2e',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('#textInput',{visible:true});
            await page.evaluate(()=>{
              window.__fnsQaFrames=[];
              const img=document.getElementById('olivia-avatar-img');
              const note=()=>window.__fnsQaFrames.push(img.currentSrc||img.src||'');
              new MutationObserver(note).observe(img,{attributes:true,attributeFilter:['src']});
              note();
            });
            await page.type('#textInput','Hola, ¿cómo estás?');
            await page.click('#sendBtn');
            await page.waitForFunction(()=>document.querySelectorAll('.chat-message.assistant').length>0,{timeout:12000});
            await new Promise(r=>setTimeout(r,1200));
            const state=await page.evaluate(()=>({
              assistant:[...document.querySelectorAll('.chat-message.assistant')].map(x=>x.textContent.trim()),
              frames:window.__fnsQaFrames||[],
              status:document.getElementById('status')?.textContent||'',
              image:document.getElementById('olivia-avatar-img')?.currentSrc||''
            }));
            if(chatCalls!==1)throw new Error('expected 1 chat call, got '+chatCalls);
            if(ttsCalls<1)throw new Error('reply reached DOM but did not trigger TTS');
            if(!state.assistant.some(x=>/Estoy bien/i.test(x)))throw new Error('assistant reply not injected into #chat-history '+JSON.stringify(state));
            if(!state.frames.some(x=>/olivia-(falando|aberta)-v16\.jpg/i.test(x)))throw new Error('TTS did not activate mouth frames '+JSON.stringify(state));

            const img=await page.$('#olivia-avatar-img');
            const rendered=await img.screenshot({encoding:'binary'});
            const png=PNG.sync.read(rendered);
            let nonBlack=0; for(let i=0;i<png.data.length;i+=4){if(png.data[i]+png.data[i+1]+png.data[i+2]>30)nonBlack++;}
            if(nonBlack/(png.width*png.height)<0.35)throw new Error('avatar blank during E2E');
            await page.screenshot({path:'olivia-v18-e2e-proof.png',fullPage:true});
            console.log('OLIVIA V18 E2E PASS — API JSON -> assistant bubble -> TTS -> mouth frame', {chatCalls,ttsCalls,status:state.status,frames:state.frames.slice(-8)});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload V18 end-to-end proof
        uses: actions/upload-artifact@v4
        with:
          name: olivia-v18-end-to-end-proof
          path: fns-digital-human/worker/olivia-v18-e2e-proof.png
          retention-days: 30

      - name: Final status
        run: echo 'DEPLOY V18 PASS — live chat reply verified; browser reply bubble -> TTS -> mouth animation verified; V16 visual/HTML/CSS/assets/avatar-core frozen'
